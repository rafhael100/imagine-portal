name: Portal SEO F138 - Engine Ed25519 multilingual v2 interoperability

on:
  pull_request:
    paths:
      - 'apps/portal/app/Domain/SeoReview/PortalSeoSignedMultilingualV2Lab.php'
      - 'apps/portal/labs/seo-f138-signed-multilingual/**'
      - 'apps/portal/docs/PORTAL-SEO-F138-V2-CROSS-REPO-REVIEW.md'
      - '.github/workflows/portal-seo-f138-multilingual-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-repo:
    name: Engine F126 to Portal F138 / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    env:
      CI: 'true'
      APP_ENV: testing
      SEO_F126_SIGNER_LAB: '1'
      PORTAL_SEO_F138_LAB: '1'
    steps:
      - name: Checkout isolated Portal candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Checkout immutable Engine F126 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: rafhael100/imagine-seo-engine
          ref: 38b80fe77bd74ea6e19b8751014038ac3b9f8400
          path: .qa/seo-f138
          persist-credentials: false
      - name: Verify exact Engine SHA and clean index
        run: |
          set -euo pipefail
          test "$(git -C .qa/seo-f138 rev-parse HEAD)" = 38b80fe77bd74ea6e19b8751014038ac3b9f8400
          test -z "$(git -C .qa/seo-f138 status --porcelain --untracked-files=no)"
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: PHP ${{ matrix.php }} with sodium
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: sodium
      - name: Validate PHP and Node syntax
        run: |
          set -euo pipefail
          php -m | grep -i sodium
          php -l apps/portal/app/Domain/SeoReview/PortalSeoSignedMultilingualV2Lab.php
          php -l apps/portal/labs/seo-f138-signed-multilingual/verify-portal.php
          node --check apps/portal/labs/seo-f138-signed-multilingual/emit-from-engine.mjs
          node --check .qa/seo-f138/src/seo-signed-multilingual-evidence-v2.mjs
      - name: Actual Engine HTML audit, sign and independent PHP verify
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for scenario in valid blocked tampered wrong-key other-tenant expired wrong-contract bad-flags wrong-status extra-claim wrong-prefix; do
            node apps/portal/labs/seo-f138-signed-multilingual/emit-from-engine.mjs \
              "$scenario" "$tmp/$scenario-envelope.json" "$tmp/$scenario-public.key"
            php apps/portal/labs/seo-f138-signed-multilingual/verify-portal.php \
              "$tmp/$scenario-envelope.json" "$tmp/$scenario-public.key" "$scenario"
          done
      - name: Check for unexpected tracked modifications
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C .qa/seo-f138 status --porcelain --untracked-files=no)"
