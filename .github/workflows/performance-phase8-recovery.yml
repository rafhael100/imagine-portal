name: Performance package, recovery and release preflight
on:
  push:
    branches: ['feat/admin-phase7-exact-compose-flow-2026-11-17']
    paths: ['apps/portal/**', '.github/workflows/performance-phase8-recovery.yml']
permissions:
  contents: read
jobs:
  exact-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ADMIN_PHASE7_CI: '1'
      ADMIN_PHASE8_NAVIGATION_CI: '1'
      ADMIN_PHASE8_RECOVERY_CI: '1'
      ADMIN_PHASE9_MAINTENANCE_CI: '1'
      ADMIN_PHASE10_STORAGE_CI: '1'
      ADMIN_PHASE11_RELEASE_CI: '1'
      ADMIN_PHASE12_MATERIALS_CI: '1'
      ADMIN_PHASE13_BUILD_CI: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-performance-ai
          ref: 3da0ba8552473baf4d4be10d86129259640a29c5
          path: engine
          persist-credentials: false
      - name: Read-only inventory regression
        run: python3 apps/portal/tests/Fixtures/phase8-readiness/test_inventory.py
      - name: Offline certificate and build-context regression
        run: |
          python3 -B apps/portal/tests/Fixtures/phase12-materials/test_crypto.py
          python3 -B apps/portal/tests/Fixtures/phase13-build/test_context_canaries.py
      - name: Locked browser and CI trust tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnss3-tools
          mkdir -p "$RUNNER_TEMP/phase7-browser"
          cd "$RUNNER_TEMP/phase7-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          echo "NODE_PATH=$RUNNER_TEMP/phase7-browser/node_modules" >> "$GITHUB_ENV"
      - name: Exact package, materials, build receipt and complete isolated recovery
        run: bash apps/portal/tests/Fixtures/phase7/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: performance-phase8-exact-package-evidence
          path: |
            ${{ runner.temp }}/phase7-evidence
            ${{ runner.temp }}/phase8-recovery-evidence
            ${{ runner.temp }}/phase9-maintenance-evidence
            ${{ runner.temp }}/phase10-storage-evidence
            ${{ runner.temp }}/phase11-release-evidence
            ${{ runner.temp }}/phase13-build-evidence
          retention-days: 7
