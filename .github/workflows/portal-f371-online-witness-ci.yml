name: Portal F371 - Online witness pre-post candidate (NO SERVING)
on:
  pull_request:
    paths:
      - 'apps/portal/app/Infrastructure/Recovery/**'
      - 'infra/development/portal-recovery/test-f371.php'
      - '.github/workflows/portal-f371-online-witness-ci.yml'
permissions:
  contents: read
jobs:
  online-witness-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          tools: none
          coverage: none
      - name: No external trust source is bound to HTTP
        run: |
          set -euo pipefail
          php -l apps/portal/app/Infrastructure/Recovery/IndependentWitnessCandidateVerifier.php
          php -l apps/portal/app/Infrastructure/Recovery/PortalOnlineWitnessSource.php
          php -l apps/portal/app/Infrastructure/Recovery/OnlineWitnessFenceCandidate.php
          php -l infra/development/portal-recovery/test-f371.php
          php infra/development/portal-recovery/test-f371.php
