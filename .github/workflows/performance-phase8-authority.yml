name: Performance Phase8 navigation native authority PostgreSQL
on:
  push:
    branches: ['feat/admin-phase7-exact-compose-flow-2026-11-17']
    paths: ['apps/portal/**', '.github/workflows/performance-phase8-authority.yml']
  pull_request:
    paths: ['apps/portal/**', '.github/workflows/performance-phase8-authority.yml']
permissions:
  contents: read
jobs:
  navigation-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-phase4-ci
          POSTGRES_DB: performance_phase4_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d performance_phase4_ci" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      CI: 'true'
      APP_ENV: testing
      APP_DEBUG: 'false'
      ADMIN_PHASE4_PG_CI: '1'
      PERFORMANCE_ADMIN_PG_CI: '1'
      PORTAL_ADMIN_AUTH_ENABLED: 'true'
      PERFORMANCE_ADMIN_LAB_ENABLED: 'true'
      PERFORMANCE_NATIVE_READ_ENABLED: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: performance_phase4_ci
      DB_USERNAME: postgres
      DB_PASSWORD: synthetic-phase4-ci
      PERFORMANCE_AUTHORITY_DB_USERNAME: portal_performance_runtime
      PERFORMANCE_AUTHORITY_DB_PASSWORD: SYNTHETIC_PHASE4_CI_ONLY
      PERFORMANCE_AUTHORITY_SSLMODE: disable
      PERFORMANCE_ADMIN_LAB_ENGINE_ROOT: ${{ github.workspace }}/engine
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-performance-ai
          ref: 7f40693e8663578b8de721d9eca2e62262f46fa8
          path: engine
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, sodium, mbstring, dom, xml, curl
          tools: composer:v2
          coverage: none
      - name: Locked dependencies and disposable native authority
        working-directory: apps/portal
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php artisan migrate --force --no-interaction
          php tests/Fixtures/phase4/authority-role.php
      - name: Operation-specific navigation, filters, signatures and denial events
        working-directory: apps/portal
        run: php artisan test --no-ansi --filter='NativePerformanceAuthorityTest|NativePerformanceReadNavigationTest|NativePerformanceAccountMandateStoreTest|NativePerformanceAccountMandateTenantCollisionTest|NativePerformanceAccountMandateChannelIsolationTest|SignedServiceReadClientTest|PerformanceSecurityEventsTest'
      - name: Reject pre-existing restore destination without deleting it
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          DOCKER_HOST: ''
          DOCKER_CONTEXT: ''
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTIONS" == true && "$CI" == true && "$ADMIN_PHASE4_PG_CI" == 1 ]]
          [[ "$DB_DATABASE" == performance_phase4_ci && "$APP_ENV" == testing ]]
          [[ "$PG_CONTAINER" =~ ^[0-9a-f]{12,64}$ ]]
          [[ "$(docker inspect -f '{{.Config.Image}}' "$PG_CONTAINER")" == postgres:18 ]]
          # This CI database is disposable; never disturb a pre-existing destination.
          exists() {
            docker exec "$PG_CONTAINER" psql -X -qAt -v ON_ERROR_STOP=1 -U postgres -d performance_phase4_ci -c "SELECT count(*) FROM pg_database WHERE datname='performance_mandate_restore_ci'"
          }
          [[ "$(exists)" == 0 ]]
          docker exec "$PG_CONTAINER" createdb -U postgres performance_mandate_restore_ci
          created_by_this_test=1
          refusal_log="$(mktemp "$RUNNER_TEMP/phase15-target-refusal-XXXXXXXX.log")"
          cleanup() {
            rm -f -- "$refusal_log"
            if [[ "$created_by_this_test" == 1 ]]; then
              docker exec "$PG_CONTAINER" dropdb -U postgres --if-exists performance_mandate_restore_ci >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          if bash apps/portal/tests/Fixtures/phase15-mandate-restore/run.sh >"$refusal_log" 2>&1; then
            echo 'FAIL PHASE15 EXISTING DESTINATION ACCEPTED'
            exit 1
          fi
          # Require the *specific* destination guard, not an unrelated script error.
          grep -Fxq 'PHASE15_RESTORE_DESTINATION_PREEXISTS_NO_DELETE' "$refusal_log"
          [[ "$(exists)" == 1 ]]
          echo 'PASS PHASE15 EXISTING DESTINATION PRESERVED'
      - name: Restore populated synthetic mandate and event tables in disposable PostgreSQL
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          DOCKER_HOST: ''
          DOCKER_CONTEXT: ''
        run: bash apps/portal/tests/Fixtures/phase15-mandate-restore/run.sh
