name: Portal Asaas webhook inbox candidate - NO BILLING
on:
  pull_request:
    paths:
      - 'apps/portal/app/Homologation/AsaasWebhookInboxCandidate.php'
      - 'apps/portal/ops/private-purchase/asaas-inbox-ci.sql'
      - 'apps/portal/ops/private-purchase/test_asaas_inbox_ci.php'
      - '.github/workflows/portal-asaas-webhook-inbox.yml'
permissions:
  contents: read
jobs:
  synthetic-inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - name: Checkout immutable PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install PHP with PostgreSQL driver
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, mbstring
          coverage: none
          tools: none
      - name: Check PHP syntax
        run: |
          php -l apps/portal/app/Homologation/AsaasWebhookInboxCandidate.php
          php -l apps/portal/ops/private-purchase/test_asaas_inbox_ci.php
      - name: Start disposable loopback-only PostgreSQL18
        run: |
          set -euo pipefail
          docker run -d --rm --name imagine-asaas-inbox-ci \
            -e POSTGRES_DB=portal_asaas_inbox_ci \
            -e POSTGRES_PASSWORD=ci-only-not-a-customer-password \
            -p 127.0.0.1:5432:5432 postgres:18-alpine >/dev/null
          for attempt in $(seq 1 50); do
            if docker exec imagine-asaas-inbox-ci psql -U postgres \
              -d portal_asaas_inbox_ci -Atc 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo 'PostgreSQL CI did not become ready' >&2
          exit 1
      - name: Verify Asaas authenticated inbox and fail closed on payment
        env:
          ASAAS_INBOX_CI: '1'
          PGPASSWORD: ci-only-not-a-customer-password
        run: |
          set -euo pipefail
          php apps/portal/ops/private-purchase/test_asaas_inbox_ci.php
          echo 'PASS fictional Asaas inbound event persistence; NO ROUTE, NO BILLING, NO PAYMENT RELEASE' >> "$GITHUB_STEP_SUMMARY"
      - name: Destroy disposable database
        if: always()
        run: docker rm -f imagine-asaas-inbox-ci >/dev/null 2>&1 || true
