name: OnePage Portal R24 private source output containment (CI-only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['fix/onepage-approved-selection-order-r23-20261123']
    paths:
      - '.github/workflows/onepage-approved-brief-output-r24.yml'
      - 'apps/portal/app/Domain/SitesIntegration/OnepageApprovedBriefExportGate.php'
      - 'tests/onepage-approved-brief-output-r24.php'
permissions:
  contents: read
concurrency:
  group: portal-onepage-output-r24-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  output-containment:
    if: >-
      github.repository == 'rafhael100/imagine-portal' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'review/portal-onepage-private-source-output-r24-20261123' &&
      github.event.pull_request.base.ref == 'fix/onepage-approved-selection-order-r23-20261123' &&
      github.event.pull_request.base.sha == 'a3bf63ff48f57415ef8dfed51669e17737ab9958'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
          tools: none
      - name: Exact checkout, syntax and real gate regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          php -l apps/portal/app/Domain/SitesIntegration/OnepageApprovedBriefExportGate.php
          php -l tests/onepage-approved-brief-output-r24.php
          php tests/onepage-approved-brief-output-r24.php | tee "$RUNNER_TEMP/r24.txt"
          grep -Eq '^ONEPAGE APPROVED BRIEF SOURCE BOUNDARY PASS: [1-9][0-9]* checks; default-deny, no official approval or transport[.]$' "$RUNNER_TEMP/r24.txt"
          grep -Eq '^ONEPAGE PORTAL OUTPUT R24 PASS: [1-9][0-9]* synthetic checks; NO-GO[.]$' "$RUNNER_TEMP/r24.txt"
      - name: No operational environment or secret files
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .env.production
          test ! -f .env.local
          test ! -d .pinned-portal
