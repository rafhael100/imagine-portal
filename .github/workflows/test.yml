name: Testes do portal

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# F224: keep latest validation per review PR or branch; older jobs are
# superseded by a newer SHA, preventing a large queue of stale candidates.
concurrency:
  group: portal-node-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # Dependências fixadas; provedores de pagamento, fiscal e e-mail são simulados nos testes.
      - name: Instalar dependências
        run: npx --yes pnpm@11.25.0 install --frozen-lockfile --ignore-scripts
      - name: Conferir sintaxe do Portal cliente, equipe e servidor
        run: |
          node --check account-ui.js
          node --check portal.js
          node --check server/app.mjs
          node --check server/account-export.mjs
      - name: Testar aplicação sem credenciais ou cobranças reais
        run: npm test
