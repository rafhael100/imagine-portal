name: Portal Landing Page site binding guard (draft)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['integration/portal-landing-head-admission-2026-11-19-r12']
    paths:
      - '.github/workflows/landing-page-site-binding.yml'
      - 'apps/portal/app/Domain/SitesIntegration/LandingPageCurrentHeadAdmissionCandidate.php'
      - 'apps/portal/app/Domain/SitesIntegration/LandingPageSiteOrderBinding.php'
      - 'apps/portal/app/Domain/SitesIntegration/PortalLandingPageSiteOrderBindingSource.php'
      - 'apps/portal/app/Domain/SitesIntegration/DenyingPortalLandingPageSiteOrderBindingSource.php'
      - 'tests/landing-page-head-admission-offline.php'
permissions:
  contents: read
concurrency:
  group: portal-landing-site-binding-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  binding-security:
    if: >-
      github.repository == 'rafhael100/imagine-portal' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'security/portal-landing-site-bound-admission-2026-11-20-r13' &&
      github.event.pull_request.base.ref == 'integration/portal-landing-head-admission-2026-11-19-r12' &&
      github.event.pull_request.base.sha == 'b5a4bfc10ef18f0c661eb69d04a4b2d3bac83661'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-sites
          ref: 4c2a6f010f6db51c0b950a6cc48c854ba0d614ac
          path: .pinned-sites
          fetch-depth: 1
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - name: Verify immutable Sites and lint bindings
        run: |
          set -euo pipefail
          test "$(git -C .pinned-sites rev-parse HEAD)" = 4c2a6f010f6db51c0b950a6cc48c854ba0d614ac
          php -l apps/portal/app/Domain/SitesIntegration/LandingPageSiteOrderBinding.php
          php -l apps/portal/app/Domain/SitesIntegration/PortalLandingPageSiteOrderBindingSource.php
          php -l apps/portal/app/Domain/SitesIntegration/DenyingPortalLandingPageSiteOrderBindingSource.php
          php -l apps/portal/app/Domain/SitesIntegration/LandingPageCurrentHeadAdmissionCandidate.php
          php -l tests/landing-page-head-admission-offline.php
      - name: Exercise site/tenant fencing and preserve existing S2S contracts
        run: |
          set -euo pipefail
          php tests/landing-page-head-admission-offline.php | tee site-binding.log
          grep -Eq '^PORTAL LANDING HEAD ADMISSION PASS: [0-9]+ checks;' site-binding.log
          php tests/landing-page-head-s2s-request-offline.php | tee landing.log
          grep -Eq '^PORTAL LANDING HEAD REQUEST PASS: [0-9]+ checks;' landing.log
          php tests/onepage-current-head-s2s-dispatch-offline.php | tee onepage.log
          grep -Eq '^PORTAL ONEPAGE HEAD DISPATCH PASS: [0-9]+ checks;' onepage.log
