name: Portal F63 - static HTML credential-bound DEMO Performance
on:
  push:
    branches:
      - dev/portal-f63-static-credential-workbench-html-2026-11-10
  pull_request:
    paths:
      - 'apps/portal/tools/f63-render-credential-workbench.php'
      - 'apps/portal/tests/ui/test-f63-static-credential-workbench.mjs'
      - 'apps/portal/app/Domain/PerformanceDashboard/CredentialBoundPerformanceWorkbenchPreview.php'
      - '.github/workflows/portal-f63-static-credential-workbench-ci.yml'
permissions:
  contents: read
jobs:
  static-offline-preview:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: F63 strict offline HTML and malicious payload protection
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/portal/tools/f63-render-credential-workbench.php
          php -l apps/portal/app/Domain/PerformanceDashboard/CredentialBoundPerformanceWorkbenchPreview.php
          node --check apps/portal/tests/ui/test-f63-static-credential-workbench.mjs
          php apps/portal/tests/Unit/CredentialBoundPerformanceWorkbenchPreviewStandalone.php
          node apps/portal/tests/ui/test-f63-static-credential-workbench.mjs
          if grep -R -n -E 'f63-render-credential-workbench|PORTAL_F63_STATIC_HTML_LAB' apps/portal/routes/ apps/portal/bootstrap/; then
            echo 'FAIL F63 offline renderer exposed via Portal routes'
            exit 1
          fi
