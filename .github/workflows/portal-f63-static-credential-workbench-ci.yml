name: Portal F87 - Performance credential workbench offline (private/public)
on:
  pull_request:
    paths:
      - 'apps/portal/tools/f63-render-credential-workbench.php'
      - 'apps/portal/tests/ui/test-f63-static-credential-workbench.mjs'
      - 'apps/portal/app/Domain/PerformanceDashboard/CredentialBoundPerformanceWorkbenchPreview.php'
      - 'apps/portal/app/Domain/PerformanceDashboard/PerformanceCampaignObservationState.php'
      - 'apps/portal/app/Domain/PerformanceDashboard/PerformanceReviewObservationState.php'
      - 'apps/portal/app/Domain/Catalog/PerformanceChannel.php'
      - 'apps/portal/tests/Fixtures/performance-f100-credential-demo.json'
      - '.github/workflows/portal-f63-static-credential-workbench-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-f87-static-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-offline-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify negative constraints, CSP and offline HTML
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/portal/tools/f63-render-credential-workbench.php
          php -l apps/portal/app/Domain/PerformanceDashboard/CredentialBoundPerformanceWorkbenchPreview.php
          node --check apps/portal/tests/ui/test-f63-static-credential-workbench.mjs
          php apps/portal/tests/Unit/CredentialBoundPerformanceWorkbenchPreviewStandalone.php \
            apps/portal/tests/Fixtures/performance-f100-credential-demo.json
          node apps/portal/tests/ui/test-f63-static-credential-workbench.mjs \
            apps/portal/tests/Fixtures/performance-f100-credential-demo.json
          if grep -R -n -E 'f63-render-credential-workbench|PORTAL_F63_STATIC_HTML_LAB' apps/portal/routes/ apps/portal/bootstrap/ apps/portal/app/Providers/; then
            echo 'FAIL: static preview registered as operational route' >&2
            exit 1
          fi
      - name: Render DEMO artifact for internal review only
        if: matrix.php == '8.4' && matrix.node == '22'
        shell: bash
        env:
          APP_ENV: testing
          PORTAL_F62_CREDENTIAL_WORKBENCH_LAB: '1'
          PORTAL_F63_STATIC_HTML_LAB: '1'
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .portal-f87-artifact
          php apps/portal/tools/f63-render-credential-workbench.php \
            apps/portal/tests/Fixtures/performance-f100-credential-demo.json \
            > .portal-f87-artifact/performance-f100-DEMO.html
          grep -q 'DEMONSTRAÇÃO NÃO HOMOLOGADA' .portal-f87-artifact/performance-f100-DEMO.html
          test -s .portal-f87-artifact/performance-f100-DEMO.html
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.4' && matrix.node == '22'
        with:
          name: imagine-portal-f87-performance-f100-demo
          path: .portal-f87-artifact/performance-f100-DEMO.html
          if-no-files-found: error
          retention-days: 2
