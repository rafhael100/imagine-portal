name: Portal F1-02-B - PG18 synthetic lab

on:
  pull_request:
    paths:
      - 'apps/portal/labs/f1-02-b/**'
      - '.github/workflows/portal-f1-02-b-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-f1-02-b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-pg18:
    name: Disposable PostgreSQL 18 and PDO_PGSQL
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/portal-f1-02-b-pg18-lab-2026-11-08'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: portal_f1_02_lab
          POSTGRES_USER: lab_owner
          POSTGRES_PASSWORD: synthetic-only-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_owner -d portal_f1_02_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout immutable PR content
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: PHP 8.4 with PDO_PGSQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none

      - name: Verify lab script syntax and isolated fixtures
        run: |
          php -v
          php -m | grep -i '^pdo_pgsql$'
          php -l apps/portal/labs/f1-02-b/run.php
          test -s apps/portal/labs/f1-02-b/schema.sql
          test -s apps/portal/labs/f1-02-b/README.md

      - name: Execute ONLY synthetic PostgreSQL lab
        env:
          PORTAL_LAB_ALLOW: '1'
          PORTAL_LAB_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=portal_f1_02_lab'
          PORTAL_LAB_ADMIN_USER: lab_owner
          PORTAL_LAB_ADMIN_PASSWORD: synthetic-only-${{ github.run_id }}
          PORTAL_LAB_RUNTIME_PASSWORD: synthetic-runtime-${{ github.run_id }}
        run: php apps/portal/labs/f1-02-b/run.php

      - name: Confirm no operational Portal auth routes were changed
        run: |
          git diff --check
          grep -q 'nenhuma rota de autenticacao' apps/portal/routes/web.php
