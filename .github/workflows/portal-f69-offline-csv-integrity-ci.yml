name: Portal F69 - offline CSV integrity verification
on:
  push:
    branches:
      - dev/portal-f69-offline-csv-integrity-check-2026-11-10
  pull_request:
    paths:
      - 'apps/portal/tools/f69-verify-budget-csv.mjs'
      - 'apps/portal/tests/ui/test-f69-offline-csv-integrity.mjs'
      - '.github/workflows/portal-f69-offline-csv-integrity-ci.yml'
permissions:
  contents: read
jobs:
  offline-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Verify F66-F69 offline CSV and reject modified exports
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/portal/tools/f69-verify-budget-csv.mjs
          node --check apps/portal/tests/ui/test-f69-offline-csv-integrity.mjs
          node apps/portal/tests/ui/test-f66-offline-budget-csv.mjs
          node apps/portal/tests/ui/test-f67-budget-csv-audit.mjs
          node apps/portal/tests/ui/test-f68-multi-scenario-budget-csv.mjs
          node apps/portal/tests/ui/test-f69-offline-csv-integrity.mjs
          if grep -R -n -E 'f69-verify-budget-csv|PORTAL_F69_CSV_INTEGRITY_LAB' apps/portal/routes/ apps/portal/bootstrap/; then
            echo 'FAIL: F69 laboratory exposed in runtime'
            exit 1
          fi
