name: Portal F144 - Inventory of cumulative review diff (NO-GO)
on:
  push:
    branches:
      - review/portal-f144-integration-inventory-ci-2026-11-11
  pull_request:
    paths:
      - 'apps/portal/tools/integration/**'
      - '.github/workflows/portal-f144-integration-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-file-scope-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout candidate with full Git history
        uses: actions/checkout@v5
        with:
          # pull_request's default checkout is a GitHub-generated merge commit.
          # The inventory must inspect the PR's actual head, not that synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use pinned major Node release
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch only the protected development comparison ref
        env:
          PORTAL_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            refs/heads/dev/fast-track-portal-2026-11-05:refs/remotes/origin/dev/fast-track-portal-2026-11-05
          git rev-parse --verify refs/remotes/origin/dev/fast-track-portal-2026-11-05^{commit}
          test "$(git rev-parse HEAD)" = "$PORTAL_EXPECTED_HEAD"
      - name: Test the review inventory tool on synthetic git-path fixtures
        run: node --test apps/portal/tools/integration/inventory.test.mjs
      - name: Generate exact full diff inventory and NO-GO summary
        env:
          PORTAL_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PORTAL_REVIEW_INVENTORY_DIR: ${{ runner.temp }}/portal-integration-inventory
        run: node apps/portal/tools/integration/inventory.mjs
      - name: Archive metadata-only evidence, not source or secrets
        uses: actions/upload-artifact@v5
        with:
          name: portal-integration-scope-f144
          path: ${{ runner.temp }}/portal-integration-inventory/
          if-no-files-found: error
          retention-days: 3
