name: Portal F429 first partial month contractual proposal NO-CHARGE
on:
  pull_request:
    paths:
      - 'apps/portal/app/Homologation/Commerce/PerformanceFirstPartialMonthProposal.php'
      - 'apps/portal/tools/test_performance_first_partial_month_f429.php'
      - '.github/workflows/portal-performance-partial-month-f429.yml'
permissions:
  contents: read
jobs:
  provisional-partial-month:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      APP_ENV: testing
      PAYMENTS_ENABLED: 'false'
    steps:
      - name: Checkout exact PR SHA without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup pinned PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate calendar days, floor, dispute gates and no billing privileges
        run: |
          set -euo pipefail
          php -l apps/portal/app/Homologation/Commerce/PerformanceFirstPartialMonthProposal.php
          php -l apps/portal/tools/test_performance_first_partial_month_f429.php
          php apps/portal/tools/test_performance_first_partial_month_f429.php
          grep -Fq "'contract_policy_ratified'=>false" apps/portal/app/Homologation/Commerce/PerformanceFirstPartialMonthProposal.php
          grep -Fq "'can_charge'=>false" apps/portal/app/Homologation/Commerce/PerformanceFirstPartialMonthProposal.php
          grep -Fq "'can_write_psp'=>false" apps/portal/app/Homologation/Commerce/PerformanceFirstPartialMonthProposal.php
      - name: Keep financial NO-GO explicit
        run: |
          echo 'F429: partial-month floor is only a draft contractual formula, NOT approved billing.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No official media statement, first-month policy ratification, real invoice, PSP or production.' >> "$GITHUB_STEP_SUMMARY"
