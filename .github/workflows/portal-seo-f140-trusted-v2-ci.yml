name: Portal SEO F140 - trusted multilingual v2 signer registry and revocation

on:
  pull_request:
    paths:
      - 'apps/portal/app/Domain/SeoReview/PortalSeoPgTrustedMultilingualV2Lab.php'
      - 'apps/portal/labs/seo-f140-trusted-v2/**'
      - 'apps/portal/docs/PORTAL-SEO-F140-TRUSTED-V2-KEYS.md'
      - '.github/workflows/portal-seo-f140-trusted-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trusted-v2:
    name: Trusted Engine v2 and PG18 revocation / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f108-ci-postgres-only
          POSTGRES_DB: portal_gsc_f108_ci
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_gsc_f108_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      CI: 'true'
      APP_ENV: testing
      APP_DEBUG: 'false'
      SEO_F126_SIGNER_LAB: '1'
      PORTAL_SEO_F138_LAB: '1'
      PORTAL_SEO_F140_PG_CI: '1'
      PORTAL_SEO_F128_PG_CI: '1'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: portal_gsc_f108_ci
      DB_USERNAME: postgres
      DB_PASSWORD: f108-ci-postgres-only
      POSTGRES_PASSWORD: f108-ci-postgres-only
      F140_ROLE_PASSWORD: f140-ci-role-only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LOG_CHANNEL: stderr
    steps:
      - name: Checkout isolated Portal candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout exact Engine F126 signed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: rafhael100/imagine-seo-engine
          ref: 38b80fe77bd74ea6e19b8751014038ac3b9f8400
          path: .qa/seo-f138
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: PHP ${{ matrix.php }} with PostgreSQL and sodium
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_pgsql, sodium, mbstring, dom, xml, fileinfo, zip
          tools: composer:v2
          coverage: none
      - name: Validate source and immutable Engine
        run: |
          set -euo pipefail
          test "$(git -C .qa/seo-f138 rev-parse HEAD)" = 38b80fe77bd74ea6e19b8751014038ac3b9f8400
          php -l apps/portal/app/Domain/SeoReview/PortalSeoPgTrustedMultilingualV2Lab.php
          php -l apps/portal/app/Domain/SeoReview/PortalSeoSignedMultilingualV2Lab.php
          php -l apps/portal/app/Domain/SeoReview/PortalSeoPgSigningKeyRevocationLab.php
          php -l apps/portal/labs/seo-f140-trusted-v2/verify-registered-signer.php
          node --check apps/portal/labs/seo-f138-signed-multilingual/emit-from-engine.mjs
      - name: Install locked Laravel dependencies
        working-directory: apps/portal
        run: |
          set -euo pipefail
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          composer dump-autoload --no-interaction --no-scripts --no-plugins
      - name: Create disposable PG18 RLS schema
        working-directory: apps/portal
        run: php artisan migrate --force --no-interaction
      - name: Engine signatures, key enrolment and cooperative revocation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for mode in valid blocked other-tenant tampered; do
            node apps/portal/labs/seo-f138-signed-multilingual/emit-from-engine.mjs \
              "$mode" "$tmp/$mode-envelope.json" "$tmp/$mode-public.key"
          done
          node apps/portal/labs/seo-f138-signed-multilingual/emit-from-engine.mjs \
            valid "$tmp/revocable-envelope.json" "$tmp/revocable-public.key"
          php apps/portal/labs/seo-f140-trusted-v2/verify-registered-signer.php "$tmp"
      - name: Assert unchanged tracked sources
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C .qa/seo-f138 status --porcelain --untracked-files=no)"
