name: Portal F96 - Performance observation and display-only convergence
on:
  push:
    branches:
      - review/portal-f96-performance-observation-contract-ci-2026-11-10
  pull_request:
    paths:
      - 'apps/portal/tests/Unit/PerformanceObservationStateContractStandalone.php'
      - 'apps/portal/app/Domain/PerformanceDashboard/**'
      - 'apps/portal/tests/Unit/OfflinePerformanceWorkbenchPreviewStandalone.php'
      - 'apps/portal/tools/f60-render-performance-workbench.php'
      - 'apps/portal/tests/ui/test-f60-static-workbench.mjs'
      - '.github/workflows/portal-f96-performance-observation-ci.yml'
permissions:
  contents: read
jobs:
  observation-vocabulary:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate non-operational Performance statuses, DTO and HTML
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/portal/tests/Unit/PerformanceObservationStateContractStandalone.php
          php -l apps/portal/app/Domain/PerformanceDashboard/PerformanceCampaignObservationState.php
          php -l apps/portal/app/Domain/PerformanceDashboard/PerformanceReviewObservationState.php
          php apps/portal/tests/Unit/PerformanceObservationStateContractStandalone.php
          php apps/portal/tests/Unit/OfflinePerformanceWorkbenchPreviewStandalone.php
          php -l apps/portal/tools/f60-render-performance-workbench.php
          node --check apps/portal/tests/ui/test-f60-static-workbench.mjs
          node apps/portal/tests/ui/test-f60-static-workbench.mjs
          if grep -R -n -E 'OfflinePerformanceWorkbenchPreview|f60-render-performance-workbench|PORTAL_F60_HTML_LAB|PORTAL_F59_WORKBENCH_LAB' apps/portal/routes apps/portal/bootstrap apps/portal/app/Providers; then
            echo 'BLOCK: Offline Performance consumer exposed to Laravel runtime' >&2
            exit 1
          fi
          if grep -R -n -E 'PerformanceCampaignObservationState|PerformanceReviewObservationState' apps/portal/routes apps/portal/bootstrap; then
            echo 'BLOCK: Observation enum wired to HTTP route/bootstrap' >&2
            exit 1
          fi
