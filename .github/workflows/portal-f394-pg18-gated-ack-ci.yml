name: Portal F394 - Real PG18 revocation gates independent ACK claim (NO SERVING)
on:
  pull_request:
    paths:
      - 'apps/portal/app/Infrastructure/Recovery/Pg18VerifiedRevocationAckPreparationCandidate.php'
      - 'infra/development/portal-recovery/f394-*'
      - '.github/workflows/portal-f394-pg18-gated-ack-ci.yml'
permissions:
  contents: read
jobs:
  worker-intent-postgres-revoke-worker-ack:
    runs-on: ubuntu-24.04
    timeout-minutes: 21
    env:
      PORTAL_F390_CI: DISPOSABLE_ONLY
      PORTAL_F391_CI: DISPOSABLE_ONLY
      PORTAL_F394_CI: DISPOSABLE_ONLY
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Bootstrap only synthetic Portal PostgreSQL18 in disposable Docker
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo python3 infra/development/portal-db/prepare-secrets.py "$GITHUB_WORKSPACE/infra/development/portal-db/.private"
          sudo docker compose -p imagine-portal-f394-ci -f infra/development/portal-db/compose.yaml build provision
          sudo docker compose -p imagine-portal-f394-ci -f infra/development/portal-db/compose.yaml up -d --wait postgres
          sudo docker compose -p imagine-portal-f394-ci -f infra/development/portal-db/compose.yaml run --rm -T --interactive=false provision php provision.php install
          sudo docker pull node:24-alpine
      - name: Prove NO ACK until actual restricted PG18 row is revoked
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$PORTAL_F394_CI" = DISPOSABLE_ONLY
          scratch="$(mktemp -d)"
          sudo chown 82:82 "$scratch"
          sudo chmod 700 "$scratch"
          trap 'sudo rm -rf -- "$scratch"' EXIT
          tool(){
            sudo docker compose -p imagine-portal-f394-ci -f infra/development/portal-db/compose.yaml \
              run --rm -T --interactive=false \
              -e GITHUB_ACTIONS=true -e RUNNER_ENVIRONMENT=github-hosted \
              -e PORTAL_ENROLLMENT_CI=DISPOSABLE_ONLY \
              -e PORTAL_RESTORE_QUARANTINE_CI=DISPOSABLE_ONLY \
              -e PORTAL_F390_CI=DISPOSABLE_ONLY \
              -e PORTAL_F391_CI=DISPOSABLE_ONLY \
              -e PORTAL_F394_CI=DISPOSABLE_ONLY \
              -v "$GITHUB_WORKSPACE/infra/development/portal-enrollment:/opt/portal-enrollment:ro" \
              -v "$GITHUB_WORKSPACE/infra/development/portal-mail:/opt/portal-mail:ro" \
              -v "$GITHUB_WORKSPACE/infra/development/portal-activation:/opt/portal-activation:ro" \
              -v "$GITHUB_WORKSPACE/infra/development/portal-recovery:/opt/portal-recovery:ro" \
              -v "$GITHUB_WORKSPACE/apps/portal/database/security/portal_browser_revoke_status_f391_candidate.sql:/opt/f391-status-candidate.sql:ro" \
              -v "$scratch:/opt/f390:rw" provision "$@"
          }
          worker(){
            sudo docker run --rm --network none --user 82:82 \
              --memory 320m --cpus 1 \
              -e GITHUB_ACTIONS=true -e RUNNER_ENVIRONMENT=github-hosted \
              -e PORTAL_F394_CI=DISPOSABLE_ONLY \
              -v "$GITHUB_WORKSPACE/infra/development/portal-recovery:/repo/infra/development/portal-recovery:ro" \
              -v "$scratch:/opt/f390:rw" node:24-alpine node \
              /repo/infra/development/portal-recovery/f394-worker-ack-stage.mjs "$1" /opt/f390
          }
          tool php -l /var/www/html/app/Infrastructure/Recovery/Pg18VerifiedRevocationAckPreparationCandidate.php
          tool php -l /opt/portal-recovery/f394-prepare-ack-pg18.php
          tool php -l /opt/portal-recovery/f394-verify-ack-pg18.php
          if tool php /opt/portal-recovery/f394-prepare-ack-pg18.php wrong; then
            echo 'F394 must reject stray CLI arguments'
            exit 1
          fi
          tool php /opt/portal-recovery/f391-install-status-ci.php
          tool php /opt/portal-recovery/f390-seed-hash-only-pg18.php
          worker seed
          sudo test -s "$scratch/receipt.json"
          sudo test ! -e "$scratch/ack-body.json"
          tool php /opt/portal-recovery/f394-prepare-ack-pg18.php
          sudo test -s "$scratch/ack-body.json"
          worker complete
          sudo test -s "$scratch/ack-receipt.json"
          tool php /opt/portal-recovery/f394-verify-ack-pg18.php
          if grep -R -E '(Pg18VerifiedRevocationAckPreparationCandidate|f394)' \
              apps/portal/routes apps/portal/bootstrap apps/portal/app/Providers; then
            echo 'F394 review-only ACK plan cannot be bound to Laravel HTTP'
            exit 1
          fi
      - name: Destroy only disposable F394 PostgreSQL database and secrets
        if: always()
        run: |
          test "$GITHUB_ACTIONS" = true
          sudo docker compose -p imagine-portal-f394-ci -f infra/development/portal-db/compose.yaml down --volumes --remove-orphans
