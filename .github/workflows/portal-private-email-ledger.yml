name: Private email ledger - disposable PostgreSQL 18
on:
  pull_request:
    paths:
      - 'infra/development/portal-mail/**'
      - 'infra/development/portal-enrollment/**'
      - '.github/workflows/portal-private-email-ledger.yml'
permissions:
  contents: read
concurrency:
  group: portal-private-email-ledger-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  disposable-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Create only disposable runner database
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          sudo python3 infra/development/portal-db/prepare-secrets.py "$GITHUB_WORKSPACE/infra/development/portal-db/.private"
          sudo docker compose -p imagine-portal-email-ledger-ci -f infra/development/portal-db/compose.yaml build provision
          sudo docker compose -p imagine-portal-email-ledger-ci -f infra/development/portal-db/compose.yaml up -d --wait postgres
          sudo docker compose -p imagine-portal-email-ledger-ci -f infra/development/portal-db/compose.yaml run --rm -T --interactive=false provision php provision.php install
      - name: Prove real PostgreSQL ledger invariants without sending mail
        run: |
          set -euo pipefail
          tool() {
            sudo docker compose -p imagine-portal-email-ledger-ci -f infra/development/portal-db/compose.yaml run --rm -T --interactive=false \
              -e GITHUB_ACTIONS=true -e PORTAL_ENROLLMENT_CI=DISPOSABLE_ONLY \
              -v "$GITHUB_WORKSPACE/infra/development/portal-enrollment:/opt/portal-enrollment:ro" \
              -v "$GITHUB_WORKSPACE/infra/development/portal-mail:/opt/portal-mail:ro" provision "$@"
          }
          tool php -l /opt/portal-mail/PgLedger.php
          tool php -l /opt/portal-mail/bridge.php
          tool php -l /opt/portal-mail/test_pg_ledger.php
          tool php /opt/portal-mail/test_pg_ledger.php < /dev/null
      - name: Always remove only the disposable enrollment project
        if: always()
        run: |
          test "$GITHUB_ACTIONS" = true
          sudo docker compose -p imagine-portal-email-ledger-ci -f infra/development/portal-db/compose.yaml down --volumes --remove-orphans
