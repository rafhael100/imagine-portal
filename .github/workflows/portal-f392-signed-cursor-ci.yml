name: Portal F392 - Signed revocation recovery cursor after crash (NO SERVING)
on:
  pull_request:
    paths:
      - 'infra/development/portal-recovery/f392-worker/**'
      - 'infra/development/portal-recovery/f376-worker/src/witness.mjs'
      - 'apps/portal/app/Infrastructure/Recovery/SignedRevocationCursorCandidateVerifier.php'
      - '.github/workflows/portal-f392-signed-cursor-ci.yml'
permissions:
  contents: read
jobs:
  signed-cursor-node-php:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    env:
      PORTAL_F392_CI: DISPOSABLE_ONLY
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          coverage: none
          tools: none
      - name: Verify signed restart cursor with real Worker and no-serving PHP
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$PORTAL_F392_CI" = DISPOSABLE_ONLY
          node --check infra/development/portal-recovery/f376-worker/src/witness.mjs
          node --check infra/development/portal-recovery/f392-worker/cursor.mjs
          node --check infra/development/portal-recovery/f392-worker/test-cursor.mjs
          php -l apps/portal/app/Infrastructure/Recovery/SignedRevocationCursorCandidateVerifier.php
          php -l infra/development/portal-recovery/f392-worker/test-php-interop.php
          if php infra/development/portal-recovery/f392-worker/test-php-interop.php; then
            echo 'F392 must refuse omitted CLI args and private fixture'
            exit 1
          fi
          scratch="$(mktemp -d)"
          chmod 700 "$scratch"
          trap 'rm -rf -- "$scratch"' EXIT
          export F392_INTEROP_DIR="$scratch"
          node infra/development/portal-recovery/f392-worker/test-cursor.mjs
          php infra/development/portal-recovery/f392-worker/test-php-interop.php "$scratch"
          node --test infra/development/portal-recovery/f376-worker/test/witness.test.mjs
