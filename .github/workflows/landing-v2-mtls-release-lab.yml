name: Portal Landing v2 exact acceptance over Sites F1-395 local mTLS (NO-GO)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['test/portal-landing-buyer-rework-v2-exact-2026-11-21-r25']
    paths:
      - '.github/workflows/landing-v2-mtls-release-lab.yml'
      - 'apps/portal/labs/landing-contract-click/landing_v2_mtls_release_lab.php'
      - 'apps/portal/labs/landing-contract-click/LANDING_V2_MTLS_NO_GO.md'
permissions:
  contents: read
concurrency:
  group: landing-v2-mtls-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  same-order-acceptance-to-mtls:
    if: >-
      github.repository == 'rafhael100/imagine-portal' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/portal-landing-v2-local-mtls-proof-2026-11-21-r26' &&
      github.event.pull_request.base.ref == 'test/portal-landing-buyer-rework-v2-exact-2026-11-21-r25' &&
      github.event.pull_request.base.sha == '6c7af097c637501789fe861171f777ab4d3db7de'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      pg18:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      APP_ENV: testing
      LANDING_EXACT_CLICK_LAB: '1'
      LANDING_PREVIEW_GET_LAB: '1'
      LANDING_SITES_RENDER_LAB: '1'
      LANDING_FINAL_ACCEPT_LAB: '1'
      LANDING_REWORK_V2_LAB: '1'
      LANDING_V2_MTLS_LAB: '1'
      SITES_F388_MTLS_LAB: '1'
      SITES_F395_MTLS_LAB: '1'
      F388_FIXTURE_DIR: /tmp/f388-fixture
      R26_SITES_MTLS_ROOT: ${{ github.workspace }}/sites-mtls-snapshot
    steps:
      - name: Exact Portal HEAD, no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact existing Sites renderer, not v4
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-sites
          ref: 8172e5cc14e97951e529c843059c214e05c33db5
          path: sites-snapshot
          sparse-checkout: |
            src/Production
          persist-credentials: false
      - name: Historical real mTLS source and server from Sites #474
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-sites
          ref: 24b1451db8039f3e4cb8835368637f6173ce1b15
          path: sites-mtls-snapshot
          sparse-checkout: |
            src/Domain
            src/Publication
            tests/f388-prepare-mtls-certs.sh
            tests/fixtures/f395-portal-approval-mtls-server.py
          persist-credentials: false
      - name: Verify all exact SHAs, boundaries, and script syntax
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C sites-snapshot rev-parse HEAD)" = 8172e5cc14e97951e529c843059c214e05c33db5
          test "$(git -C sites-mtls-snapshot rev-parse HEAD)" = 24b1451db8039f3e4cb8835368637f6173ce1b15
          test -f sites-mtls-snapshot/src/Publication/PortalClientApprovalMtlsHttpSource.php
          test -f sites-mtls-snapshot/tests/fixtures/f395-portal-approval-mtls-server.py
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, curl, sodium
          coverage: none
      - name: Syntax and isolated browser dependencies
        run: |
          set -euo pipefail
          php -l apps/portal/labs/landing-contract-click/landing_v2_mtls_release_lab.php
          php -m | grep -i -x pdo_pgsql
          php -m | grep -i -x curl
          python3 -m venv "$RUNNER_TEMP/landing-v2-venv"
          source "$RUNNER_TEMP/landing-v2-venv/bin/activate"
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Reuse required same-order v1-to-v2 synthetic browser chain (not counted as new tests)
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/landing-v2-venv/bin/activate"
          php -S 127.0.0.1:8765 apps/portal/labs/landing-contract-click/router.php > "$RUNNER_TEMP/contract.log" 2>&1 & P1=$!
          php -S 127.0.0.1:8766 apps/portal/labs/landing-contract-click/private_preview_router.php > "$RUNNER_TEMP/preview.log" 2>&1 & P2=$!
          php -S 127.0.0.1:8767 apps/portal/labs/landing-contract-click/final_preview_acceptance_lab.php > "$RUNNER_TEMP/final.log" 2>&1 & P3=$!
          php -S 127.0.0.1:8768 apps/portal/labs/landing-contract-click/buyer_rework_v2_lab.php > "$RUNNER_TEMP/rework.log" 2>&1 & P4=$!
          trap 'kill "$P1" "$P2" "$P3" "$P4" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/lab/login >/dev/null; then break; fi
            sleep 1
          done
          python apps/portal/labs/landing-contract-click/browser_test.py > "$RUNNER_TEMP/prereq-click.log"
          grep -F 'LANDING EXACT CLICK BROWSER PASS:' "$RUNNER_TEMP/prereq-click.log"
          LANDING_PREVIEW_HOLD=1 php apps/portal/labs/landing-contract-click/same_order_approved_brief_bridge.php > "$RUNNER_TEMP/prereq-bridge.log"
          grep -F 'LANDING BRIDGE HELD FOR HTTP TEST:' "$RUNNER_TEMP/prereq-bridge.log"
          php apps/portal/labs/landing-contract-click/private_preview_fixture.php seed > "$RUNNER_TEMP/prereq-preview.log"
          php apps/portal/labs/landing-contract-click/sites_renderer_same_order_lab.php render > "$RUNNER_TEMP/prereq-render.log"
          php apps/portal/labs/landing-contract-click/final_preview_acceptance_lab.php init
          php apps/portal/labs/landing-contract-click/buyer_rework_v2_lab.php init
          python apps/portal/labs/landing-contract-click/buyer_rework_v2_browser.py > "$RUNNER_TEMP/v2-proof.log"
          grep -F 'LANDING BUYER REWORK SAME ORDER V1-V2 LAB PASS:' "$RUNNER_TEMP/v2-proof.log"
          grep -F 'PSP=NOT_CALLED; FORM=DISABLED; PUBLISH=NO_GO; LEAD=NOT_TESTED' "$RUNNER_TEMP/v2-proof.log"
      - name: Existing F1-395 ephemeral mTLS identities, loopback only
        run: |
          set -euo pipefail
          bash sites-mtls-snapshot/tests/f388-prepare-mtls-certs.sh
          php apps/portal/labs/landing-contract-click/landing_v2_mtls_release_lab.php emit | tee "$RUNNER_TEMP/r26-evidence.log"
          grep -F 'UNSIGNED=YES; IAM=LAB_ONLY; FORM=OFF; PUBLISH=NO_GO' "$RUNNER_TEMP/r26-evidence.log"
      - name: Sites #474 original mTLS server with actual PG18-clicked v2 evidence
        run: |
          set -euo pipefail
          python3 sites-mtls-snapshot/tests/fixtures/f395-portal-approval-mtls-server.py \
            --ca "$F388_FIXTURE_DIR/ca.crt" \
            --server-cert "$F388_FIXTURE_DIR/server.crt" \
            --server-key "$F388_FIXTURE_DIR/server.key" \
            --fixture-dir "$F388_FIXTURE_DIR" > "$RUNNER_TEMP/f395.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/f395.pid"
          ready=0
          for i in $(seq 1 30); do
            status="$(curl --noproxy '*' --silent --max-time 2 \
              --cacert "$F388_FIXTURE_DIR/ca.crt" \
              --cert "$F388_FIXTURE_DIR/client.crt" \
              --key "$F388_FIXTURE_DIR/client.key" \
              -o /dev/null -w '%{http_code}' \
              https://localhost:18444/internal/sites/v1/approvals/resolve || true)"
            if [ "$status" = 501 ]; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
      - name: Fresh independent PG18 readback vs Sites #474 exact mTLS response, negative matrix
        run: |
          set -euo pipefail
          php apps/portal/labs/landing-contract-click/landing_v2_mtls_release_lab.php check | tee "$RUNNER_TEMP/mtls-proof.log"
          grep -F 'LANDING_V2_PG18_TO_SITES474_MTLS_PASS' "$RUNNER_TEMP/mtls-proof.log"
          grep -F 'SIGNED_PUBLISH_GATE=DENIED' "$RUNNER_TEMP/mtls-proof.log"
      - name: Local simulated static delivery observes SHA, form OFF and backend lead refusal
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8770 apps/portal/labs/landing-contract-click/landing_v2_mtls_release_lab.php > "$RUNNER_TEMP/local-static.log" 2>&1 &
          P="$!"
          trap 'kill "$P" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS --noproxy '*' http://127.0.0.1:8770/lab/static-release -o "$RUNNER_TEMP/landed-v2.html"; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          actual="$(sha256sum "$RUNNER_TEMP/landed-v2.html" | cut -d' ' -f1)"
          expected="$(sed -n 's/^V2_LANDING_HTML_SHA256=//p' "$RUNNER_TEMP/r26-evidence.log")"
          test -n "$expected" && test "$actual" = "$expected"
          ! grep -Ei '<form|<script' "$RUNNER_TEMP/landed-v2.html"
          test "$(curl --noproxy '*' -s -o "$RUNNER_TEMP/post-response" -w '%{http_code}' \
            -X POST -d 'lead=fictional' http://127.0.0.1:8770/lead)" = 403
          grep -F 'NO_DESTINATION_NO_LEAD' "$RUNNER_TEMP/post-response"
          echo "LOCAL_SHA256_OBSERVED=$actual; FORM=OFF; LEAD_403; NO_GO"
      - name: Revocation invalidates independent source despite stale mTLS fixture
        run: |
          set -euo pipefail
          php apps/portal/labs/landing-contract-click/landing_v2_mtls_release_lab.php revoke
          php apps/portal/labs/landing-contract-click/landing_v2_mtls_release_lab.php check-revoked
      - name: Confirm no operational endpoint, IAM writer or publisher bound
        run: |
          set -euo pipefail
          ! grep -R -n 'PortalClientApprovalMtlsHttpSource' sites-mtls-snapshot/apps/sites/app/Providers sites-mtls-snapshot/apps/sites/routes 2>/dev/null
          echo 'F1-395 transport is test-only; Sites #38 remains NO-GO.'
      - name: Destroy ephemeral PKI and listener
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/f395.pid" ]; then kill "$(cat "$RUNNER_TEMP/f395.pid")" 2>/dev/null || true; fi
          rm -rf -- /tmp/f388-fixture
