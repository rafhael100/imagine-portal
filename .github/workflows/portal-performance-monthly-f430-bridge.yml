name: Portal F430 HMAC F425 to PostgreSQL18 F427 one-time review NO-BILLING
on:
  pull_request:
    paths:
      - 'apps/portal/tools/emit_performance_monthly_hmac_pg18_f430.php'
      - '.github/workflows/portal-performance-monthly-f430-bridge.yml'
permissions:
  contents: read
jobs:
  isolated-signed-consumption:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      APP_ENV: testing
      PAYMENTS_ENABLED: 'false'
    steps:
      - name: Checkout exact PR SHA, no persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup pinned PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Signed PHP review to single-use PostgreSQL18, no network
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp /tmp/f430-XXXXXX.sql)"
          chmod 600 "$tmp"
          trap 'rm -f "$tmp"; docker rm -f portal-f430-pg >/dev/null 2>&1 || true' EXIT
          php -l apps/portal/tools/emit_performance_monthly_hmac_pg18_f430.php
          php apps/portal/tools/emit_performance_monthly_hmac_pg18_f430.php "$tmp"
          docker run -d --name portal-f430-pg --network none \
            -e POSTGRES_HOST_AUTH_METHOD=trust postgres:18
          for i in $(seq 1 45); do
            if docker exec portal-f430-pg pg_isready -q -U postgres; then break; fi
            sleep 1
          done
          docker exec portal-f430-pg pg_isready -U postgres
          docker exec portal-f430-pg psql -v ON_ERROR_STOP=1 -U postgres \
            -d postgres -c 'CREATE DATABASE portal_purchase_rehearsal'
          docker exec -i portal-f430-pg psql -v ON_ERROR_STOP=1 -U postgres \
            -d portal_purchase_rehearsal \
            < apps/portal/labs/performance-monthly-f427/schema.sql
          docker exec -i portal-f430-pg psql -v ON_ERROR_STOP=1 -U postgres \
            -d portal_purchase_rehearsal < "$tmp"
          echo 'F430: F425 signed review bound to single F427 PostgreSQL18 transition.' >> "$GITHUB_STEP_SUMMARY"
          echo 'NO-GO: simulated SQL only; no bank APIs, tax invoices, media APIs or production.' >> "$GITHUB_STEP_SUMMARY"
