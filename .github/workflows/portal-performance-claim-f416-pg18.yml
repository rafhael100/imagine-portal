name: Portal F416 synthetic single-use claim PostgreSQL18
on:
  pull_request:
    paths:
      - 'apps/portal/labs/performance-claim-f416/**'
      - '.github/workflows/portal-performance-claim-f416-pg18.yml'
permissions:
  contents: read
jobs:
  isolated-claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed commit with no persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Initialize isolated PostgreSQL 18 with no exposed network
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f portal-f416-pg >/dev/null 2>&1 || true' EXIT
          docker run -d --name portal-f416-pg --network none \
            -e POSTGRES_HOST_AUTH_METHOD=trust postgres:18
          for attempt in $(seq 1 45); do
            if docker exec portal-f416-pg pg_isready -q -U postgres; then break; fi
            sleep 1
          done
          docker exec portal-f416-pg pg_isready -U postgres
          docker exec portal-f416-pg psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c 'CREATE DATABASE portal_purchase_rehearsal'
          docker exec -i portal-f416-pg psql -v ON_ERROR_STOP=1 -U postgres \
            -d portal_purchase_rehearsal \
            < apps/portal/labs/performance-claim-f416/schema.sql
          docker exec -i portal-f416-pg psql -v ON_ERROR_STOP=1 -U postgres \
            -d portal_purchase_rehearsal \
            < apps/portal/labs/performance-claim-f416/test-claims.sql
          echo 'F416: disposable RLS+idempotency proof completed. NO real PSP operation.' >> "$GITHUB_STEP_SUMMARY"
