name: Portal F97 - no DEMO classes or views in runtime image
on:
  push:
    branches:
      - review/portal-f97-strip-demo-runtime-image-2026-11-10
  pull_request:
    paths:
      - 'infra/homologation/f64/Dockerfile'
      - '.github/workflows/portal-f64-private-compose-smoke.yml'
      - 'apps/portal/tools/f93-check-homologation-fence.mjs'
      - 'apps/portal/tests/ui/test-f93-homologation-fence.mjs'
      - '.github/workflows/portal-f97-runtime-demo-pruning-ci.yml'
permissions:
  contents: read
jobs:
  static-image-fence:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Enforce removal of mock classes/templates from runtime Docker build
        shell: bash
        env:
          APP_ENV: testing
          PORTAL_F93_RELEASE_FENCE_LAB: '1'
          PORTAL_F94_INGRESS_GUARD_LAB: '1'
        run: |
          set -euo pipefail
          node --check apps/portal/tools/f93-check-homologation-fence.mjs
          node --check apps/portal/tests/ui/test-f93-homologation-fence.mjs
          node apps/portal/tools/f93-check-homologation-fence.mjs
          node apps/portal/tests/ui/test-f93-homologation-fence.mjs
          node apps/portal/tools/f94-audit-http-ingress-imports.mjs
