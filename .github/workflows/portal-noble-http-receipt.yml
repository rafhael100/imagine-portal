name: Portal Noble HTTP archive metadata receipt only
'on':
  pull_request:
    types: [opened]
    branches: ['test/onepage-d0-finance-pg-v2']
    paths: ['.github/workflows/portal-noble-http-receipt.yml']
permissions:
  contents: read
jobs:
  receipt:
    if: >-
      github.repository == 'rafhael100/imagine-portal' &&
      github.run_attempt == 1 && github.event.pull_request.draft == true &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == 'rafhael100/imagine-portal' &&
      github.event.pull_request.head.ref == 'test/onepage-noble-http-receipt-v1' &&
      github.event.pull_request.base.repo.full_name == 'rafhael100/imagine-portal' &&
      github.event.pull_request.base.ref == 'test/onepage-d0-finance-pg-v2' &&
      github.event.pull_request.base.sha == 'e95baafac952e5fb8577bd4407de76263d11500e'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      LC_ALL: C
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check exact scope and emit signed Ubuntu index receipt (no package execution)
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" RUNNER_TEMP="$RUNNER_TEMP" \
            /usr/bin/python3 -I -B - <<'PY'
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          import lzma
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess
          import tempfile

          REPO = 'rafhael100/imagine-portal'
          BASE = 'e95baafac952e5fb8577bd4407de76263d11500e'
          BASE_TREE = '0b22a8efeb696bb38e6494fedd85a35381f4fe3f'
          BASE_REF = 'test/onepage-d0-finance-pg-v2'
          HEAD_REF = 'test/onepage-noble-http-receipt-v1'
          PATH = '.github/workflows/portal-noble-http-receipt.yml'
          ARCH = 'amd64'
          ENV = {'PATH':'/usr/bin:/bin','LC_ALL':'C'}

          def need(value):
              if not value:
                  raise ValueError('RECEIPT_REFUSED')

          def run(argv, seconds=12, env=None):
              child = subprocess.run(argv, env=ENV if env is None else env, stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True, timeout=seconds)
              return child.stdout

          def tree(commit):
              out = {}
              for entry in run(['git','ls-tree','-rz',commit]).split(b'\0'):
                  if not entry:
                      continue
                  meta, key = entry.split(b'\t',1)
                  mode, kind, blob = meta.split()
                  need(key not in out)
                  out[key] = (mode,kind,blob)
              return out

          def gate():
              need(os.environ.get('GITHUB_ACTIONS')=='true' and
                   os.environ.get('GITHUB_EVENT_NAME')=='pull_request' and
                   os.environ.get('GITHUB_REPOSITORY')==REPO and os.environ.get('GITHUB_RUN_ATTEMPT')=='1')
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())
              p = event['pull_request']
              need(event['action']=='opened' and event['repository']['full_name']==REPO and
                   p['draft'] is True and p['state']=='open')
              need(p['base']['sha']==BASE and p['base']['ref']==BASE_REF and p['head']['ref']==HEAD_REF)
              need(p['base']['repo']['full_name']==p['head']['repo']['full_name']==REPO)
              head=p['head']['sha']
              need(re.fullmatch(r'[0-9a-f]{40}',head) is not None)
              need(run(['git','rev-parse','HEAD']).strip().decode()==head)
              need(run(['git','rev-list','--parents','-n','1',head]).decode().split()==[head,BASE])
              need(run(['git','rev-parse',BASE+'^{tree}']).strip().decode()==BASE_TREE)
              need(run(['git','status','--porcelain=v1','--untracked-files=all'])==b'')
              old,new=tree(BASE),tree(head)
              key=PATH.encode()
              need(key not in old and key in new and new[key][:2]==(b'100644',b'blob'))
              need({k:v for k,v in new.items() if k!=key}==old)
              raw=Path(PATH)
              need(raw.is_file() and not raw.is_symlink())
              b=raw.read_bytes()
              need(hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest().encode()==new[key][2])
              need(run(['dpkg','--print-architecture']).strip()==ARCH.encode())
              release=Path('/etc/os-release').read_text()
              need(re.search(r'^ID=ubuntu$',release,re.M) and re.search(r'^VERSION_CODENAME=noble$',release,re.M))
              return head

          # Exact candidates observed in Ubuntu Noble public amd64 catalog. Drift refuses.
          EXPECTED = {
              'libnginx-mod-http-js':'0.8.2-1ubuntu1',
              'nginx':'1.24.0-2ubuntu7.19',
              'nginx-common':'1.24.0-2ubuntu7.19',
              'libnginx-mod-stream':'1.24.0-2ubuntu7.19',
              'php8.3-fpm':'8.3.6-0ubuntu0.24.04.13',
              'php8.3-common':'8.3.6-0ubuntu0.24.04.13',
              'php8.3-cli':'8.3.6-0ubuntu0.24.04.13',
              'php8.3-opcache':'8.3.6-0ubuntu0.24.04.13',
          }
          ORIGINS={
              'noble':'https://archive.ubuntu.com/ubuntu/',
              'noble-updates':'https://archive.ubuntu.com/ubuntu/',
              'noble-security':'https://security.ubuntu.com/ubuntu/',
          }
          KEY='F6ECB3762474EDA9D21B7022871920D1991BC93C'
          RING=Path('/usr/share/keyrings/ubuntu-archive-keyring.gpg')
          HEX=r'[a-f0-9]{64}'

          def digest(p):
              with p.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()

          def download(url,dest,limit):
              # Only caller-built archive metadata URLs. No redirect or .deb path.
              need('/dists/' in url and not url.endswith('.deb'))
              run(['/usr/bin/curl','--proto','=https','--tlsv1.2','--fail','--silent','--show-error',
                   '--connect-timeout','8','--max-time','60','--max-filesize',str(limit),'-o',str(dest),url],65)
              need(dest.is_file() and not dest.is_symlink() and 0<dest.stat().st_size<=limit)

          def fields(lines):
              result={}
              for line in lines:
                  if not line or line[:1].isspace():continue
                  k,sep,v=line.partition(':')
                  need(sep==':' and re.fullmatch(r'[A-Za-z0-9-]+',k) and k not in result)
                  result[k]=v.strip()
              return result

          def released(root,suite):
              signed=root/(suite+'.InRelease');clear=root/(suite+'.Release')
              download(ORIGINS[suite]+'dists/'+suite+'/InRelease',signed,2**20)
              result=run(['/usr/bin/gpgv','--homedir',str(root),'--keyring',str(RING),'--status-fd','1',
                          '--output',str(clear),str(signed)]).decode('ascii')
              sig=[line.split() for line in result.splitlines() if line.startswith('[GNUPG:] VALIDSIG ')]
              need(len(sig)==1 and sig[0][-1]==KEY)
              lines=clear.read_text().splitlines()
              f=fields(lines)
              need(f['Origin']=='Ubuntu' and f['Suite']==suite and f['Codename']=='noble' and
                   ARCH in f['Architectures'].split() and f.get('Acquire-By-Hash')=='yes')
              now=datetime.now(timezone.utc)
              date=parsedate_to_datetime(f['Date'])
              age=(now-date).total_seconds()
              need(age>=-300 and (suite=='noble' or age<=172800))
              if 'Valid-Until' in f:need(now<=parsedate_to_datetime(f['Valid-Until']))
              p=lines.index('SHA256:');sha={}
              for line in lines[p+1:]:
                  if not line.startswith(' '):break
                  h,n,path=line.split()
                  need(path not in sha and re.fullmatch(HEX,h) and n.isdecimal())
                  sha[path]=(h,int(n))
              return signed,clear,f,sha

          def selected(f,expected):
              p=f.get('Package')
              if p not in expected or f.get('Version')!=expected[p]:return None
              need(f.get('Architecture') in (ARCH,'all') and re.fullmatch(HEX,f.get('SHA256',''))
                   and f.get('Size','').isdecimal() and int(f['Size'])>0
                   and re.fullmatch(r'pool/(?:main|universe)/[a-z0-9]+/[A-Za-z0-9.+-]+/[A-Za-z0-9.+~_-]+[.]deb',f.get('Filename','')))
              return {k:f[k] for k in ('Package','Version','Architecture','SHA256','Size','Filename')}|{
                  k:f[k] for k in ('Depends','Pre-Depends','Provides') if k in f}

          def records(index):
              # Stream after archive size/hash verification; no binary payload parsing.
              rows=[];block=[];expanded=0
              with lzma.open(index,'rt',encoding='utf-8') as f:
                  for line in f:
                      expanded+=len(line)
                      need(expanded<=536870912)
                      if line.strip():
                          block.append(line.rstrip('\n'));need(len(block)<4096)
                      elif block:
                          row=selected(fields(block),EXPECTED)
                          if row is not None:rows.append(row)
                          block=[]
                  if block:
                      row=selected(fields(block),EXPECTED)
                      if row is not None:rows.append(row)
              return rows

          def reduce(found):
              need(set(found)==set(EXPECTED))
              result={}
              for k,items in sorted(found.items()):
                  ranked=sorted(items,key=lambda x:(x['suite'],x['index']))
                  comparable=[{a:b for a,b in x.items() if a not in ('suite','index')} for x in ranked]
                  need(all(x==comparable[0] for x in comparable))
                  result[k]={'record':comparable[0],'origins':[{k:x[k] for k in ('suite','index')} for x in ranked]}
              need('nginx-abi-1.24.0-1' in result['nginx']['record'].get('Provides','').split(', ') and
                   'nginx-abi-1.24.0-1' in result['libnginx-mod-http-js']['record'].get('Depends',''))
              return result

          phase='SCOPE'
          try:
              head=gate()
              phase='ARCHIVE_KEY'
              need(RING.is_file() and not RING.is_symlink())
              with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP'],prefix='noble-http-index-') as tmp:
                  root=Path(tmp);fnd={};archive={}
                  for suite in ORIGINS:
                      phase='SIGNED_RELEASE'
                      signed,clear,release,sha=released(root,suite)
                      archive[suite]={'origin':ORIGINS[suite],'signed_sha256':digest(signed),
                                      'release_sha256':digest(clear),'date':release['Date'],'indexes':{}}
                      for comp in ('main','universe'):
                          phase='INDEX'
                          idx=f'{comp}/binary-amd64/Packages.xz'
                          h,n=sha[idx];need(0<n<=67108864)
                          dest=root/(suite+'-'+comp+'.xz')
                          download(ORIGINS[suite]+f'dists/{suite}/{comp}/binary-amd64/by-hash/SHA256/{h}',dest,n)
                          need(dest.stat().st_size==n and digest(dest)==h)
                          archive[suite]['indexes'][idx]={'sha256':h,'size':n}
                          phase='PACKAGE_RECORDS'
                          for row in records(dest):
                              fnd.setdefault(row['Package'],[]).append(row|{'suite':suite,'index':idx})
                          dest.unlink()
                  phase='CONFLICT_OR_ABI'
                  packages=reduce(fnd)
                  print('D0_NOBLE_HTTP_INDEX_RECEIPT '+json.dumps({
                      'schema':'imagine.noble-http-index-receipt.v1','mode':'metadata_only','portal_base':BASE,
                      'portal_head':head,'arch':ARCH,'key_fingerprint':KEY,'keyring_sha256':digest(RING),
                      'suite':'noble','archives':archive,'packages':packages,
                      'runtime_qualification':'unproven','binary_bytes_received':False,'listener_started':False,
                  },separators=(',',':'),sort_keys=True))
          except Exception:
              print('NOBLE_HTTP_INDEX_RECEIPT_REFUSED phase='+phase)
              raise SystemExit(1)
          PY
