name: Portal F1-391 durable authenticated Asaas webhook inbox PG18 (synthetic)
on:
  pull_request:
    paths:
      - 'apps/portal/app/Homologation/Commerce/CustomerPreviewHandoff.php'
      - 'apps/portal/app/Http/Controllers/CustomerPreviewController.php'
      - 'apps/portal/app/Homologation/Commerce/ApprovedOfferCatalog.php'
      - 'apps/portal/app/Domain/SitesIntegration/AsaasWebhookPgInbox.php'
      - 'apps/portal/ops/psp/asaas-webhook-inbox-ci.sql'
      - 'tests/f391-asaas-webhook-inbox-pg18.php'
      - '.github/workflows/portal-f1-391-asaas-webhook-inbox.yml'
      - 'docs/PORTAL-P0-ASAAS-WEBHOOK-INBOX-GATES.md'
permissions:
  contents: read
jobs:
  durable-asass-webhook:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    env:
      GITHUB_ACTIONS: 'true'
      PORTAL_F391_ASAAS_WEBHOOK_CI: '1'
      DB_HOST: '127.0.0.1'
      DB_DATABASE: 'portal_asaas_ci'
    steps:
      - name: Checkout exact review head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: PHP and PGSQL extension, never PSP access
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          extensions: pdo_pgsql,mbstring
          coverage: none
      - name: Start disposable localhost PostgreSQL18 and initialize forced RLS
        run: |
          set -euo pipefail
          php -l apps/portal/app/Domain/SitesIntegration/AsaasWebhookPgInbox.php
          php -l tests/f391-asaas-webhook-inbox-pg18.php
          docker run --rm -d --name asaas-f391-pg18 \
            -p 127.0.0.1:5432:5432 \
            -e POSTGRES_DB=portal_asaas_ci \
            -e POSTGRES_PASSWORD=CI-ASaaS-ADMIN-SYNTHETIC \
            postgres:18-alpine >/dev/null
          ready=0
          for i in $(seq 1 60); do
            if docker exec asaas-f391-pg18 psql -X -At -v ON_ERROR_STOP=1 \
              -U postgres -d portal_asaas_ci -c 'SELECT 1' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker exec -i asaas-f391-pg18 psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d portal_asaas_ci < apps/portal/ops/psp/asaas-webhook-inbox-ci.sql
      - name: Actual PostgreSQL18 role-scoped webhook persistence and replay proof
        run: |
          set -euo pipefail
          if PORTAL_F391_ASAAS_WEBHOOK_CI=0 php tests/f391-asaas-webhook-inbox-pg18.php; then
            echo 'Unsafe: webhook inbox test ran without explicit CI opt-in' >&2
            exit 1
          fi
          php tests/f391-asaas-webhook-inbox-pg18.php
          echo 'PASS Asaas webhook token, forced-RLS insert, duplicate same-ID, conflicting replay, non-settlement and role-based deny.' >> "$GITHUB_STEP_SUMMARY"
      - name: Always destroy the synthetic PSP PostgreSQL18 instance
        if: always()
        run: docker rm -f asaas-f391-pg18 >/dev/null 2>&1 || true
