name: Portal PERF-F13 - dynamically signed MFA revocation wire event

on:
  push:
    branches:
      - feat/portal-perf-f13-export-signed-event-2026-11-08

permissions:
  contents: read

concurrency:
  group: portal-perf-f13-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-portal-performance-revocation:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: portal-lab-admin-only
          POSTGRES_DB: portal_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PORTAL_CLIENT_LAB_ENABLED: '1'
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: portal_lab
      DB_USERNAME: postgres
      DB_PASSWORD: portal-lab-admin-only
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup PHP 8.4 locked Composer and PDO PostgreSQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: mbstring, dom, xml, pdo, pdo_pgsql, curl, fileinfo, intl, bcmath, zip
      - name: Install locked dependencies with no hooks, plugins, database migrations or deploy
        shell: bash
        run: |
          set -euo pipefail
          cd apps/portal
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          composer dump-autoload --no-interaction --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          git diff --exit-code -- composer.lock
      - name: Guard against accidental operational integration
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/portal/labs/client-auth/LabPerformanceRevocationPublisher.php
          php -l apps/portal/labs/client-auth/LabPerformanceMfaIssuer.php
          php -l apps/portal/labs/performance-contract/test-perf-f11-revocation.php
          php -r "json_decode(file_get_contents('apps/portal/labs/performance-contract/perf-revocation-contract-v1.json'),true,512,JSON_THROW_ON_ERROR);"
          if grep -R -E "LabPerformanceRevocationPublisher|PORTAL_PERF_F11_LAB_ENABLED" apps/portal/routes/ apps/portal/bootstrap/ apps/portal/app/; then
            echo "FAIL: F11 revocation lab referenced by product entrypoint"
            exit 1
          fi
      - name: All historical Portal client-auth F1-F10 regressions
        shell: bash
        run: |
          set -euo pipefail
          cd apps/portal
          php labs/client-auth/bootstrap_lab.php
          php vendor/bin/phpunit --configuration=labs/client-auth/phpunit-lab.xml --no-progress
      - name: F11 revoke and F13 dynamic signed event export
        shell: bash
        env:
          PORTAL_PERF_F11_LAB_ENABLED: '1'
        run: |
          set -euo pipefail
          cd apps/portal
          export PORTAL_F13_EVENT_EXPORT="$RUNNER_TEMP/portal-perf-f13-event.json"
          export PORTAL_F13_HEADERS_EXPORT="$RUNNER_TEMP/portal-perf-f13-wire-headers.json"
          export PERF_WIRE_LAB_TEST_KEY_HEX="$(php -r 'echo bin2hex(random_bytes(32));')"
          php labs/performance-contract/test-perf-f11-revocation.php
          php labs/performance-contract/export-signed-perf-event.php
          test -s "$PORTAL_F13_EVENT_EXPORT"
          test -s "$PORTAL_F13_HEADERS_EXPORT"
          php -r 'require "labs/performance-contract/SyntheticWireEnvelope.php"; $raw=file_get_contents(getenv("PORTAL_F13_EVENT_EXPORT")); $h=json_decode(file_get_contents(getenv("PORTAL_F13_HEADERS_EXPORT")),true,512,JSON_THROW_ON_ERROR); $key=hex2bin(getenv("PERF_WIRE_LAB_TEST_KEY_HEX")); if(\Imagine\Protocol\Lab\SyntheticWireEnvelope::verifyForLab("POST","/_synthetic/perf/revocation",$raw,$h,$key,1800000000)!=="wire_valid_demo"){exit(1);} echo "PASS F13 dynamic HTTP headers signed by Portal lab\n";'
      - name: Product and Composer entrypoints remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          cd apps/portal
          git diff --exit-code -- composer.lock routes/web.php bootstrap/app.php public/index.php
