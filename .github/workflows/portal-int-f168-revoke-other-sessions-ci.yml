name: Portal INT-F168 - Secure revoke-other-sessions Node UI and API
on:
  push:
    branches:
      - review/portal-int-f168-revoke-other-sessions-ui-2026-11-11
  pull_request:
    branches:
      - review/portal-int-f167-rate-limit-expired-bucket-gc-2026-11-11
    paths:
      - 'server/app.mjs'
      - 'server/team.mjs'
      - 'account-ui.js'
      - 'portal.js'
      - 'tests/portal.test.mjs'
      - '.github/workflows/portal-int-f168-revoke-other-sessions-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-self-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify UI/handler parse and lockfile
        run: |
          set -euo pipefail
          node --check server/app.mjs
          node --check server/team.mjs
          node --check account-ui.js
          node --check portal.js
          npx --yes pnpm@11.25.0 install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml
      - name: Run signed-in account isolation and security regressions
        run: |
          set -euo pipefail
          node --test tests/portal.test.mjs
          npm test
