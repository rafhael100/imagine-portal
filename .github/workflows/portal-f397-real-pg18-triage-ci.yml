name: Portal F397 - Signed real PG18 SQL and forged ACK triage (NO SERVING)
on:
  pull_request:
    paths:
      - 'infra/development/portal-recovery/f396-worker/test-signed-triage.mjs'
      - 'infra/development/portal-recovery/test-f397-actual-pg18-triage.php'
      - '.github/workflows/portal-f397-real-pg18-triage-ci.yml'
permissions:
  contents: read
jobs:
  actual-restricted-postgres-status-and-independent-ack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PORTAL_F396_CI: DISPOSABLE_ONLY
      PORTAL_F397_CI: DISPOSABLE_ONLY
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Start only disposable PG18 for real F391 SQL status
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo python3 infra/development/portal-db/prepare-secrets.py "$GITHUB_WORKSPACE/infra/development/portal-db/.private"
          sudo docker compose -p imagine-portal-f397-ci -f infra/development/portal-db/compose.yaml build provision
          sudo docker compose -p imagine-portal-f397-ci -f infra/development/portal-db/compose.yaml up -d --wait postgres
          sudo docker compose -p imagine-portal-f397-ci -f infra/development/portal-db/compose.yaml run --rm -T --interactive=false provision php provision.php install
          sudo docker pull node:24-alpine
      - name: Signed Worker ACK cannot bypass PG18 SQL, fault or revoked status
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$PORTAL_F397_CI" = DISPOSABLE_ONLY
          scratch="$(mktemp -d)"
          sudo chown 82:82 "$scratch"
          sudo chmod 700 "$scratch"
          trap 'sudo rm -rf -- "$scratch"' EXIT
          tool(){
            sudo docker compose -p imagine-portal-f397-ci -f infra/development/portal-db/compose.yaml \
              run --rm -T --interactive=false \
              -e GITHUB_ACTIONS=true -e RUNNER_ENVIRONMENT=github-hosted \
              -e PORTAL_ENROLLMENT_CI=DISPOSABLE_ONLY \
              -e PORTAL_RESTORE_QUARANTINE_CI=DISPOSABLE_ONLY \
              -e PORTAL_F390_CI=DISPOSABLE_ONLY \
              -e PORTAL_F391_CI=DISPOSABLE_ONLY \
              -e PORTAL_F397_CI=DISPOSABLE_ONLY \
              -v "$GITHUB_WORKSPACE/infra/development/portal-enrollment:/opt/portal-enrollment:ro" \
              -v "$GITHUB_WORKSPACE/infra/development/portal-mail:/opt/portal-mail:ro" \
              -v "$GITHUB_WORKSPACE/infra/development/portal-activation:/opt/portal-activation:ro" \
              -v "$GITHUB_WORKSPACE/infra/development/portal-recovery:/opt/portal-recovery:ro" \
              -v "$GITHUB_WORKSPACE/apps/portal/database/security/portal_browser_revoke_status_f391_candidate.sql:/opt/f391-status-candidate.sql:ro" \
              -v "$scratch:/opt/f390:rw" \
              -v "$scratch:/opt/f397:rw" provision "$@"
          }
          tool php -l /opt/portal-recovery/test-f397-actual-pg18-triage.php
          tool php -l /var/www/html/app/Infrastructure/Recovery/SignedRevocationRecoveryTriageCandidate.php
          tool php /opt/portal-recovery/f391-install-status-ci.php
          tool php /opt/portal-recovery/f390-seed-hash-only-pg18.php
          sudo test -s "$scratch/seed.json"
          sudo docker run --rm --network none --user 82:82 \
            --memory 320m --cpus 1 \
            -e GITHUB_ACTIONS=true -e RUNNER_ENVIRONMENT=github-hosted \
            -e PORTAL_F396_CI=DISPOSABLE_ONLY \
            -e F396_SIGNED_FIXTURE_DIR=/opt/f397 \
            -e F397_PG_SEED=/opt/f397/seed.json \
            -v "$GITHUB_WORKSPACE/infra/development/portal-recovery:/repo/infra/development/portal-recovery:ro" \
            -v "$scratch:/opt/f397:rw" node:24-alpine node \
            /repo/infra/development/portal-recovery/f396-worker/test-signed-triage.mjs
          sudo test -s "$scratch/active.json"
          tool php /opt/portal-recovery/test-f397-actual-pg18-triage.php
          if grep -R -E '(SignedRevocationRecoveryTriageCandidate|test-f397)' \
              apps/portal/routes apps/portal/bootstrap apps/portal/app/Providers; then
            echo 'F397 must remain out of Laravel public authorization'
            exit 1
          fi
      - name: Destroy only F397 synthetic PG18, volumes and role secrets
        if: always()
        run: |
          test "$GITHUB_ACTIONS" = true
          sudo docker compose -p imagine-portal-f397-ci -f infra/development/portal-db/compose.yaml down --volumes --remove-orphans
