name: Portal Onepage approved-brief boundary (default deny)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['review/portal-onepage-render-plan-manifest-deny-2026-11-19']
    paths:
      - '.github/workflows/onepage-approved-brief-source-boundary.yml'
      - 'apps/portal/app/Domain/SitesIntegration/ApprovedOnepageBriefSnapshot.php'
      - 'apps/portal/app/Domain/SitesIntegration/ApprovedOnepageBriefSnapshotSource.php'
      - 'apps/portal/app/Domain/SitesIntegration/DenyingApprovedOnepageBriefSnapshotSource.php'
      - 'apps/portal/app/Domain/SitesIntegration/CurrentOnepageBriefApprovalWitness.php'
      - 'apps/portal/app/Domain/SitesIntegration/DenyingCurrentOnepageBriefApprovalWitness.php'
      - 'apps/portal/app/Domain/SitesIntegration/OnepageApprovedBriefExportGate.php'
      - 'tests/onepage-approved-brief-export-gate-offline.php'
      - 'docs/PORTAL-ONEPAGE-APPROVED-BRIEF-BOUNDARY.md'

permissions:
  contents: read

concurrency:
  group: portal-onepage-approved-source-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  default-deny:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/portal-onepage-approved-brief-export-boundary-2026-11-19' &&
      github.event.pull_request.base.sha == '7acee97ebaf474d630415ca456a616b5e12f2df7'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
          tools: none
      - name: Check code boundaries and execute synthetic refusing adapters
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            apps/portal/app/Domain/SitesIntegration/ApprovedOnepageBriefSnapshot.php \
            apps/portal/app/Domain/SitesIntegration/ApprovedOnepageBriefSnapshotSource.php \
            apps/portal/app/Domain/SitesIntegration/DenyingApprovedOnepageBriefSnapshotSource.php \
            apps/portal/app/Domain/SitesIntegration/CurrentOnepageBriefApprovalWitness.php \
            apps/portal/app/Domain/SitesIntegration/DenyingCurrentOnepageBriefApprovalWitness.php \
            apps/portal/app/Domain/SitesIntegration/OnepageApprovedBriefExportGate.php \
            tests/onepage-approved-brief-export-gate-offline.php; do
            php -l "$file"
          done
          php tests/onepage-brief-export-candidate-offline.php
          php tests/onepage-render-plan-candidate-offline.php
          php tests/onepage-approved-brief-export-gate-offline.php | tee "$RUNNER_TEMP/onepage-boundary.txt"
          grep -Eq '^ONEPAGE APPROVED BRIEF SOURCE BOUNDARY PASS: [1-9][0-9]* checks; default-deny, no official approval or transport[.]$' "$RUNNER_TEMP/onepage-boundary.txt"
