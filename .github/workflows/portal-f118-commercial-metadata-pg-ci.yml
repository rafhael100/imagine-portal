name: Portal F118 - Commercial PHP PG18 metadata atomicity CI
on:
  push:
    branches:
      - review/portal-f118-commercial-metadata-pg-atomicity-2026-11-10
  pull_request:
    paths:
      - 'apps/portal/labs/commercial-intake-f117/**'
      - 'apps/portal/labs/commercial-intake-f118/**'
      - '.github/workflows/portal-f118-commercial-metadata-pg-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-metadata-pg18:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f118-fixture-only-not-a-real-secret
          POSTGRES_DB: portal_commercial_lab
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_commercial_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PORTAL_F118_PG_LAB: '1'
      DB_HOST: 127.0.0.1
      DB_DATABASE: portal_commercial_lab
      DB_PASSWORD: f118-fixture-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo,pdo_pgsql
          coverage: none
          tools: none
      - name: Check no Portal runtime routes import this isolated lab
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'PortalF118SyntheticMetadataReservation|commercial-intake-f118' \
            apps/portal/routes apps/portal/bootstrap apps/portal/app 2>/dev/null; then
            echo "F118 must remain outside Laravel runtime" >&2
            exit 1
          fi
      - name: Verify PHP and run true disposable PG18 cases
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/portal/labs/commercial-intake-f117/PortalCommercialMetadataInspector.php
          php -l apps/portal/labs/commercial-intake-f118/PortalF118SyntheticMetadataReservation.php
          php -l apps/portal/labs/commercial-intake-f118/test_pg18_metadata_atomicity.php
          php apps/portal/labs/commercial-intake-f117/test_commercial_metadata.php
          php apps/portal/labs/commercial-intake-f118/test_pg18_metadata_atomicity.php
