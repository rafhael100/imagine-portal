name: Portal Performance Ads signed short-lived read grant lab

on:
  pull_request:
    paths:
      - 'apps/portal/app/Homologation/Commerce/PortalPerformanceAdsReadGrantLabIssuer.php'
      - 'apps/portal/tools/test_performance_ads_read_grant_lab.php'
      - '.github/workflows/portal-perf-ads-read-grant-lab.yml'
      - 'docs/decisions/2026-11-14-portal-performance-ads-s2s-grant-lab.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      APP_ENV: testing
      PORTAL_PERF_ADS_S2S_READ_GRANT_LAB: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          coverage: none
      - name: PHP lint
        run: |
          php -l apps/portal/app/Homologation/Commerce/PortalPerformanceAdsReadGrantLabIssuer.php
          php -l apps/portal/tools/test_performance_ads_read_grant_lab.php
      - name: S2S short-lived read-only HMAC agreement/account/keyref grant
        run: php apps/portal/tools/test_performance_ads_read_grant_lab.php
