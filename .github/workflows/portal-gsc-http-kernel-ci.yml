name: Portal GSC - authenticated Laravel HTTP kernel and encrypted candidate PG18

on:
  pull_request:
    paths:
      - '.github/workflows/portal-gsc-http-kernel-ci.yml'
      - 'apps/portal/labs/gsc-http-kernel/**'
      - 'apps/portal/labs/gsc-https-transport/**'
      - 'apps/portal/labs/gsc-refresh/**'
      - 'apps/portal/app/Domain/Identity/**'
      - 'apps/portal/app/Domain/SeoReview/**'
      - 'apps/portal/app/Infrastructure/Identity/**'
      - 'apps/portal/app/Infrastructure/SeoReview/**'
      - 'apps/portal/app/Http/Controllers/PortalBrowserAuthController.php'
      - 'apps/portal/app/Http/Middleware/PortalBrowserAuthGuard.php'
      - 'apps/portal/database/migrations/**'
      - 'apps/portal/database/security/**'
      - 'apps/portal/labs/gsc-f112-integrated-pg18/**'
      - 'apps/portal/labs/gsc-f114-oauth-state/**'
      - 'apps/portal/labs/gsc-f115-callback/**'
      - 'apps/portal/labs/gsc-f116-local-token/**'
      - 'apps/portal/labs/gsc-f117-property/**'
      - 'apps/portal/tests/Feature/PortalGscOAuth*Test.php'
      - 'apps/portal/tests/Feature/PortalGscConnectionPreflightDefaultDenyTest.php'
      - 'apps/portal/phpunit.xml'
      - 'apps/portal/composer.json'
      - 'apps/portal/composer.lock'
      - 'apps/portal/bootstrap/**'
      - 'apps/portal/config/**'
      - 'apps/portal/routes/**'
      - 'apps/portal/docs/PORTAL-GSC-HTTP-KERNEL-LAB.md'
      - 'apps/portal/docs/PORTAL-GSC-REFRESH-TRANSPORT-CONTRACT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-http-kernel-pg18:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: portal_gsc_f115_lab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f112_synthetic_admin_only
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_gsc_f115_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_DATABASE: portal_gsc_f115_lab
      DB_USERNAME: postgres
      DB_PASSWORD: f112_synthetic_admin_only
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: portal_gsc_f115_lab
      PGUSER: postgres
      PGPASSWORD: f112_synthetic_admin_only
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      PORTAL_OPENSEO_DAILY_LAB: '1'
      PORTAL_GSC_F108_ATOMIC_LAB: '1'
      PORTAL_GSC_F109_VIEW_LAB: '1'
      PORTAL_GSC_F114_OAUTH_LAB: '1'
      PORTAL_GSC_F115_CALLBACK_LAB: '1'
      PORTAL_GSC_F116_LOOPBACK_LAB: '1'
      PORTAL_GSC_F117_PROPERTY_LAB: '1'
      PORTAL_GSC_F118_PROVENANCE_LAB: '1'
      PORTAL_GSC_TOKEN_VAULT_LAB: '1'
      PORTAL_GSC_HTTP_KERNEL_LAB: '1'
      PORTAL_GSC_HTTPS_TRANSPORT_LAB: '1'
    steps:
      - name: Checkout exact Portal candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable GSC core and synthetic vault
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-portal
          ref: de3315df4e8b8c07228d76f6613c799f9c174f31
          path: .qa/gsc-f109
          persist-credentials: false
      - name: Set up pinned PHP 8.4 with PostgreSQL and sodium
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: pdo_pgsql,curl,sodium,mbstring,dom,xml
          coverage: none
          tools: composer
      - name: Verify source identity and review base
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor ed6a4f75c20064ae78c433ceabcac636065fc8e3 "$CANDIDATE_SHA"
          test "$(git -C .qa/gsc-f109 rev-parse HEAD)" = de3315df4e8b8c07228d76f6613c799f9c174f31
          test -z "$(git -C .qa/gsc-f109 status --porcelain --untracked-files=no)"
      - name: Install locked Laravel dependencies and check new harness syntax
        shell: bash
        run: |
          set -euo pipefail
          composer --working-dir=apps/portal validate --strict --no-check-publish
          composer --working-dir=apps/portal install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          composer --working-dir=apps/portal dump-autoload --no-interaction --no-scripts --no-plugins
          php -r '$key="base64:".base64_encode(random_bytes(32)); echo "::add-mask::".$key.PHP_EOL; file_put_contents(getenv("GITHUB_ENV"),"APP_KEY=".$key.PHP_EOL,FILE_APPEND);'
          php -l apps/portal/app/Domain/SeoReview/OfflinePortalGscLoopbackTokenTransportReview.php
          php -l apps/portal/app/Domain/SeoReview/OfflinePortalGscSiteListEvidenceReview.php
          php -l apps/portal/app/Infrastructure/SeoReview/GoogleSearchConsoleHttpsTransportCandidate.php
          php -l apps/portal/app/Domain/SeoReview/GoogleSearchConsoleRefreshTokenPostRequest.php
          php -l apps/portal/labs/gsc-f116-local-token/test-transport.php
          php -l apps/portal/labs/gsc-f117-property/test-property-evidence.php
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          files=sorted(Path('apps/portal/labs/gsc-http-kernel').rglob('*.php'))
          assert files, 'HTTP kernel harness files missing'
          for path in files:
              subprocess.run(['php','-l',str(path)],check=True)
          refresh_files=sorted(Path('apps/portal/labs/gsc-refresh').rglob('*.php'))
          assert refresh_files, 'Refresh laboratory PHP files missing'
          for path in refresh_files:
              subprocess.run(['php','-l',str(path)],check=True)
          for path in sorted(Path('apps/portal/labs/gsc-https-transport').glob('*.py')):
              compile(path.read_text(),str(path),'exec')
          PYCODE
      - name: Prove operational GSC routes and configuration remain disabled
        shell: bash
        working-directory: apps/portal
        run: |
          set -euo pipefail
          for test in \
            tests/Feature/PortalGscOAuthRoutesClosedTest.php \
            tests/Feature/PortalGscOAuthDefaultDenyConfigurationTest.php \
            tests/Feature/PortalGscConnectionPreflightDefaultDenyTest.php; do
            vendor/bin/phpunit "$test"
          done
      - name: Apply genuine Laravel identity and GSC migrations on same disposable DB
        shell: bash
        run: |
          set -euo pipefail
          pushd apps/portal
          for file in \
            2026_11_09_000002_create_portal_identity_foundation.php \
            2026_11_09_000003_add_mfa_replay_counter_to_portal_identities.php \
            2026_11_10_000004_add_org_revision_to_portal_sessions.php \
            2026_11_10_000005_create_portal_auth_throttle_buckets.php \
            2026_11_10_000008_add_session_purpose_to_portal_auth_sessions.php \
            2026_11_11_000012_fence_portal_membership_revision.php \
            2026_11_11_000013_fence_portal_organization_revision.php \
            2026_11_11_000014_guard_portal_session_issuance.php \
            2026_11_12_000016_fence_portal_identity_revision.php \
            2026_11_12_000017_create_portal_service_resource_claims.php \
            2026_11_10_000007_allow_seo_gsc_connect_grant.php \
            2026_11_14_000019_allow_seo_gsc_view_grant.php; do
            php artisan migrate --force --no-interaction --path="database/migrations/$file"
          done
          for file in \
            2026_11_12_000001_create_portal_gsc_oauth_states.php \
            2026_11_12_000002_create_portal_gsc_property_grants.php \
            2026_11_12_000003_create_portal_gsc_security_events.php \
            2026_11_12_000004_create_portal_gsc_oauth_token_candidates.php \
            2026_11_12_000005_enable_portal_gsc_tenant_rls.php \
            2026_11_14_000006_create_portal_gsc_identity_scope_links.php; do
            php artisan migrate --force --no-interaction --realpath --path="$GITHUB_WORKSPACE/.qa/gsc-f109/apps/portal/database/migrations/$file"
          done
          popd
          # The pinned F108 fixture hardcodes its original disposable
          # DB name in exactly ONE CONNECT GRANT statement. Change only
          # that laboratory locator; retain the source SHA and all SQL.
          umask 077
          python3 - <<'PY'
          import os
          from pathlib import Path
          source=Path(".qa/gsc-f109/apps/portal/labs/gsc-f108-atomic-fence/locked-session-gsc.sql").read_text()
          assert source.count("imagine_gsc_ci_test")==1
          out=Path(os.environ["RUNNER_TEMP"])/"gsc-f108-real-schema.sql"
          out.write_text(source.replace("imagine_gsc_ci_test","portal_gsc_f115_lab"))
          PY
          psql -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/gsc-f108-real-schema.sql"
          # Use the original candidate Portal authenticator and proof key
          # SQL on the exact same disposable DB as GSC, without applying
          # any HTTP route or operational secret.
          psql -X -v ON_ERROR_STOP=1 -f apps/portal/database/security/portal_browser_auth.sql
          psql -X -v ON_ERROR_STOP=1 -c "ALTER ROLE portal_browser_runtime LOGIN PASSWORD 'f114_browser_runtime_only'"
          psql -X -v ON_ERROR_STOP=1 -f apps/portal/labs/gsc-f112-integrated-pg18/portal-real-grants-f109-bridge.sql
          # F114 fixture has its previous disposable database hardcoded
          # in a single CONNECT GRANT. Adapt ONLY this test locator, never
          # commit altered upstream SQL or expand roles.
          python3 - <<'PY'
          import os
          from pathlib import Path
          src=Path('apps/portal/labs/gsc-f114-oauth-state/connect-state-fence.sql').read_text()
          assert src.count('portal_gsc_f114_lab')==1
          target=Path(os.environ['RUNNER_TEMP'])/'gsc-f114-f115-database.sql'
          target.write_text(src.replace('portal_gsc_f114_lab','portal_gsc_f115_lab'))
          PY
          psql -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/gsc-f114-f115-database.sql"
          psql -X -v ON_ERROR_STOP=1 -f apps/portal/labs/gsc-f115-callback/bound-state-consumption.sql
          psql -X -v ON_ERROR_STOP=1 -f apps/portal/labs/gsc-http-kernel/post-response-fence.sql
      - name: Exercise new authenticated HTTP kernel flow against local token transport
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          php -S 127.0.0.1:18765 \
            apps/portal/labs/gsc-http-kernel/mock-provider.php \
            > "$RUNNER_TEMP/gsc-http-kernel-loopback.log" 2>&1 &
          mock_pid="$!"
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            status="$(curl --silent --noproxy '*' -o /dev/null \
              -w '%{http_code}' --max-time 1 http://127.0.0.1:18765/token || true)"
            if test "$status" = 404; then ready=1; break; fi
            sleep 0.2
          done
          test "$ready" = 1
          php apps/portal/labs/gsc-f116-local-token/test-transport.php \
            .qa/gsc-f109/apps/portal/app/Domain/SeoReview/GoogleSearchConsoleOAuthTokenExchangePlan.php
          php apps/portal/labs/gsc-f117-property/test-property-evidence.php \
            .qa/gsc-f109/apps/portal/app/Domain/SeoReview/GoogleSearchConsolePropertyIdentifier.php
          php apps/portal/labs/gsc-http-kernel/verify-http-kernel.php \
            .qa/gsc-f109/apps/portal/app/Domain/SeoReview
      - name: Repeat authenticated kernel through verified synthetic TLS before rollback
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tls_dir="$RUNNER_TEMP/gsc-https-kernel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$tls_dir"
          tls_pid=''
          http_pid=''
          cleanup() {
            for pid in "$tls_pid" "$http_pid"; do
              if test -n "$pid"; then
                kill "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
              fi
            done
            rm -rf -- "$tls_dir"
          }
          trap cleanup EXIT
          python3 apps/portal/labs/gsc-https-transport/make-certificates.py "$tls_dir"
          python3 apps/portal/labs/gsc-https-transport/mock-tls-provider.py \
            "$tls_dir" "$tls_dir/kernel-metrics.json" --certificate-mode valid \
            > "$tls_dir/tls-server.log" 2>&1 &
          tls_pid="$!"
          # The same harness also retains the original F116 sink regressions.
          php -S 127.0.0.1:18765 \
            apps/portal/labs/gsc-http-kernel/mock-provider.php \
            > "$tls_dir/http-server.log" 2>&1 &
          http_pid="$!"
          ready=0
          for attempt in {1..50}; do
            kill -0 "$tls_pid"
            kill -0 "$http_pid"
            status="$(curl --silent --noproxy '*' -o /dev/null \
              -w '%{http_code}' --max-time 1 http://127.0.0.1:18765/token || true)"
            if test -s "$tls_dir/kernel-metrics.json" && test "$status" = 404; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" = 1
          PORTAL_GSC_HTTP_KERNEL_HTTPS_LAB=1 \
          PORTAL_GSC_HTTPS_CA_FILE="$tls_dir/ca.pem" \
            php apps/portal/labs/gsc-http-kernel/verify-http-kernel.php \
              .qa/gsc-f109/apps/portal/app/Domain/SeoReview
          python3 - "$tls_dir/kernel-metrics.json" <<'PY'
          import json,sys
          from pathlib import Path
          metrics=json.loads(Path(sys.argv[1]).read_text())
          assert metrics['token']>0 and metrics['sites']>0, 'Kernel never reached both TLS endpoints'
          assert metrics['total']==metrics['token']+metrics['sites'], 'Unexpected HTTP request'
          assert metrics['redirect_target']==metrics['unexpected']==metrics['violations']==0, 'TLS fixture contract violated'
          print('Kernel TLS fixture: token/sites requests observed; no redirects, unexpected requests or contract violations')
          PY
          test ! -s "$tls_dir/tls-server.log"
      - name: Prove refresh lifecycle through authenticated kernel and TLS
        shell: bash
        env:
          PORTAL_GSC_REFRESH_LAB: '1'
        run: |
          set -euo pipefail
          umask 077
          # Apply the refresh fixture only after both original variants pass.
          psql -X -v ON_ERROR_STOP=1 -f apps/portal/labs/gsc-refresh/refresh-fence.sql
          tls_dir="$RUNNER_TEMP/gsc-https-refresh-kernel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$tls_dir"
          tls_pid=''
          http_pid=''
          cleanup() {
            for pid in "$tls_pid" "$http_pid"; do
              if test -n "$pid"; then
                kill "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
              fi
            done
            rm -rf -- "$tls_dir"
          }
          trap cleanup EXIT
          python3 apps/portal/labs/gsc-https-transport/make-certificates.py "$tls_dir"
          python3 apps/portal/labs/gsc-https-transport/mock-tls-provider.py \
            "$tls_dir" "$tls_dir/refresh-metrics.json" --certificate-mode valid \
            > "$tls_dir/tls-server.log" 2>&1 &
          tls_pid="$!"
          php -S 127.0.0.1:18765 \
            apps/portal/labs/gsc-http-kernel/mock-provider.php \
            > "$tls_dir/http-server.log" 2>&1 &
          http_pid="$!"
          ready=0
          for attempt in {1..50}; do
            kill -0 "$tls_pid"
            kill -0 "$http_pid"
            status="$(curl --silent --noproxy '*' -o /dev/null \
              -w '%{http_code}' --max-time 1 http://127.0.0.1:18765/token || true)"
            if test -s "$tls_dir/refresh-metrics.json" && test "$status" = 404; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" = 1
          PORTAL_GSC_HTTP_KERNEL_HTTPS_LAB=1 \
          PORTAL_GSC_HTTP_KERNEL_REFRESH_LAB=1 \
          PORTAL_GSC_HTTPS_CA_FILE="$tls_dir/ca.pem" \
          PORTAL_GSC_TLS_METRICS="$tls_dir/refresh-metrics.json" \
            php apps/portal/labs/gsc-http-kernel/verify-http-kernel.php \
              .qa/gsc-f109/apps/portal/app/Domain/SeoReview
          python3 - "$tls_dir/refresh-metrics.json" <<'PY'
          import json,sys
          from pathlib import Path
          metrics=json.loads(Path(sys.argv[1]).read_text())
          assert metrics['token']>0 and metrics['sites']>0, 'Refresh variant never reached both TLS endpoints'
          assert metrics['total']==metrics['token']+metrics['sites'], 'Unexpected HTTP request'
          assert metrics['redirect_target']==metrics['unexpected']==metrics['violations']==0, 'Refresh fixture contract violated'
          print('Refresh kernel TLS fixture: no redirects, unexpected requests or contract violations')
          PY
          test ! -s "$tls_dir/tls-server.log"
      - name: Roll back six GSC and twelve identity migrations after callback fixture cleanup
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f apps/portal/labs/gsc-refresh/rollback-refresh-fence.sql
          # Table policies depend on the laboratory owner functions. Remove
          # these exact six policies before DROP OWNED; do not rely on role
          # cleanup ordering and never conceal dependencies with CASCADE.
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DROP POLICY portal_http_lab_token_actor ON public.portal_gsc_oauth_token_candidates;
          DROP POLICY portal_http_lab_grant_actor ON public.portal_gsc_property_grants;
          DROP POLICY portal_http_lab_token_state ON public.portal_gsc_oauth_token_candidates;
          DROP POLICY portal_http_lab_grant_state ON public.portal_gsc_property_grants;
          DROP POLICY portal_http_lab_token_revoke_only ON public.portal_gsc_oauth_token_candidates;
          DROP POLICY portal_http_lab_grant_revoke_only ON public.portal_gsc_property_grants;
          SQL
          psql -X -v ON_ERROR_STOP=1 -c "DROP OWNED BY portal_gsc_f114_owner,portal_gsc_f114_runtime,portal_gsc_f114_state_reader RESTRICT"
          # Drop the test-only FK binding AFTER its owner functions
          # are removed; never use CASCADE to hide dangling dependencies.
          psql -X -v ON_ERROR_STOP=1 -c "DROP TABLE public.portal_gsc_f115_state_session_bindings RESTRICT"
          pushd apps/portal
          for file in \
            2026_11_14_000006_create_portal_gsc_identity_scope_links.php \
            2026_11_12_000005_enable_portal_gsc_tenant_rls.php \
            2026_11_12_000004_create_portal_gsc_oauth_token_candidates.php \
            2026_11_12_000003_create_portal_gsc_security_events.php \
            2026_11_12_000002_create_portal_gsc_property_grants.php \
            2026_11_12_000001_create_portal_gsc_oauth_states.php; do
            php artisan migrate:rollback --force --no-interaction --realpath --path="$GITHUB_WORKSPACE/.qa/gsc-f109/apps/portal/database/migrations/$file"
          done
          # Browser candidate SECURITY DEFINER functions depend on the
          # session_purpose column. They must be explicitly torn down
          # BEFORE reverting that migration. This is an ephemeral CI DB,
          # and DROP OWNED affects ONLY the named synthetic auth roles.
          popd
          psql -X -v ON_ERROR_STOP=1 -c "DROP OWNED BY portal_browser_owner,portal_browser_runtime RESTRICT"
          pushd apps/portal
          for file in \
            2026_11_14_000019_allow_seo_gsc_view_grant.php \
            2026_11_10_000007_allow_seo_gsc_connect_grant.php \
            2026_11_12_000017_create_portal_service_resource_claims.php \
            2026_11_12_000016_fence_portal_identity_revision.php \
            2026_11_11_000014_guard_portal_session_issuance.php \
            2026_11_11_000013_fence_portal_organization_revision.php \
            2026_11_11_000012_fence_portal_membership_revision.php \
            2026_11_10_000008_add_session_purpose_to_portal_auth_sessions.php \
            2026_11_10_000005_create_portal_auth_throttle_buckets.php \
            2026_11_10_000004_add_org_revision_to_portal_sessions.php \
            2026_11_09_000003_add_mfa_replay_counter_to_portal_identities.php \
            2026_11_09_000002_create_portal_identity_foundation.php; do
            php artisan migrate:rollback --force --no-interaction --path="database/migrations/$file"
          done
          popd
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C .qa/gsc-f109 status --porcelain --untracked-files=no)"
