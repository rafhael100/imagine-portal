name: Portal P0 - Comercial Astro to Laravel PostgreSQL18 HTTP handoff (CI only)
on:
  pull_request:
    paths:
      - 'apps/portal/app/Http/Controllers/PurchaseRehearsalController.php'
      - 'apps/portal/resources/views/portal/rehearsal/purchase.blade.php'
      - 'apps/portal/tests/Feature/PurchaseRehearsalHttpTest.php'
      - 'apps/portal/tools/prepare_comercial_php_handoff_lab.py'
      - 'apps/portal/tools/test_comercial_php_handoff_browser.py'
      - 'apps/portal/tools/test_portal_sites_after_purchase_pg18.php'
      - 'apps/portal/tools/test_sites_crm_after_purchase_pg18.php'
      - 'apps/portal/tools/test_four_project_fake_consented_crm_pg18.php'
      - '.github/workflows/portal-comercial-pg18-handoff.yml'
  push:
    branches:
      - review/portal-commercial-php-purchase-handoff-2026-11-13
      - review/portal-p0-comercial-portal-visual-evidence-2026-11-13
permissions:
  contents: read
jobs:
  commercial-portal-real-lab:
    name: Locked Comercial Astro / real Laravel + PG18 / Chromium 4 flows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: portal_purchase_rehearsal
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_purchase_rehearsal"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout exact Portal candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout immutable reviewed Comercial offer card source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-comercial
          ref: b0aefbd01f55cbcdb1653a798f05a83b866e3d33
          path: _comercial_candidate
          persist-credentials: false
      - name: Verify immutable Comercial source pin and isolated scripts
        run: |
          set -euo pipefail
          test "$(git -C _comercial_candidate rev-parse HEAD)" = "b0aefbd01f55cbcdb1653a798f05a83b866e3d33"
          test -f _comercial_candidate/package-lock.json
          test -f apps/portal/tools/purchase_http_ci_router.php
          test -f apps/portal/tools/prepare_comercial_php_handoff_lab.py
      - name: Setup pinned PHP 8.4 and PG PDO
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, dom, xml
          coverage: none
          tools: composer:v2
      - name: Setup pinned Node 22 for exact Astro build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Build exact reviewed Astro and prepare only four loopback handoff links
        run: |
          set -euo pipefail
          cd _comercial_candidate
          npm ci --no-audit --no-fund
          npm run build
          node scripts/verify-dist.mjs
          cd ..
          python3 apps/portal/tools/prepare_comercial_php_handoff_lab.py _comercial_candidate/dist "$RUNNER_TEMP/comercial-php-handoff-lab"
          (cd _comercial_candidate && node scripts/verify-dist.mjs)
          test -f "$RUNNER_TEMP/comercial-php-handoff-lab/index.html"
      - name: Setup real Laravel and isolated PostgreSQL role-bound purchase
        working-directory: apps/portal
        run: |
          set -euo pipefail
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          composer dump-autoload --no-interaction --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php -l app/Http/Controllers/PurchaseRehearsalController.php
          php -l tools/purchase_http_ci_router.php
          php tools/test_persisted_purchase.php
      - name: Recheck Laravel access enforcement for commercial offer hint
        working-directory: apps/portal
        env:
          PORTAL_PURCHASE_HTTP_CI: '1'
        run: |
          set -euo pipefail
          php artisan test --filter=PurchaseRehearsalHttpTest --no-ansi
      - name: Execute REAL Astro CTA to Laravel HTTP and PG18, no public endpoint
        working-directory: apps/portal
        env:
          PORTAL_PURCHASE_HTTP_CI: '1'
          APP_ENV: staging
          APP_DEBUG: 'false'
          COMERCIAL_P0_HANDOFF_ROOT: ${{ runner.temp }}/comercial-php-handoff-lab
          P0_REVIEW_SCREENSHOT_DIR: ${{ runner.temp }}/p0-browser-images
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/portal-comercial-playwright"
          "$RUNNER_TEMP/portal-comercial-playwright/bin/python" -m pip install --disable-pip-version-check --no-cache-dir playwright==1.56.0
          php -S 127.0.0.1:18776 tools/purchase_http_ci_router.php > "$RUNNER_TEMP/comercial-portal-php-http.log" 2>&1 &
          PORTAL_PID=$!
          trap 'kill "$PORTAL_PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time,urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18776/_rehearsal/purchase?offer=onepage',timeout=2) as response:
                      assert response.status==200
                  break
              except Exception:
                  time.sleep(.5)
          else: raise SystemExit('Private Laravel loopback refused readiness')
          PY
          "$RUNNER_TEMP/portal-comercial-playwright/bin/python" tools/test_comercial_php_handoff_browser.py
          echo 'NO-GO: GitHub temporary loopback only; no VPS, deployment, customer IAM or real payments.'
      - name: Validate all six Chromium screenshots and trusted metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json,os
          d=Path(os.environ['RUNNER_TEMP'])/'p0-browser-images'
          expected=['01-comercial-desktop.png','02-comercial-mobile.png',
                    '03-portal-choice-desktop.png','04-portal-choice-mobile.png',
                    '05-payment-blocked.png','06-briefing-saved.png']
          report=json.loads((d/'manifest.json').read_text(encoding='utf-8'))
          assert report['schema']=='imagine.p0.visual-review.v1'
          assert report['release_gate']=='NO_GO' and report['publishable'] is False
          assert report['all_data_fictitious'] is True
          for key in ['customer_sessions_used','real_purchases_executed','external_navigation_authorized']:
              assert report[key] is False
          assert [r['filename'] for r in report['screenshots']]==expected
          assert sorted(p.name for p in d.iterdir())==sorted(expected+['manifest.json'])
          for record in report['screenshots']:
              image=d/record['filename']
              assert not image.is_symlink()
              data=image.read_bytes()
              assert data[:8]==bytes.fromhex('89504e470d0a1a0a')
              assert 2000<len(data)<2500000 and record['bytes']==len(data)
              assert record['sha256']==sha256(data).hexdigest()
          assert len((d/'manifest.json').read_bytes())<3000
          print('PASS: six reproducible, checksum-verified simulated journey screenshots, NO-GO.')
          PY
      - name: Upload visual preview snapshots for 7-day review (NO-GO)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: imagine-p0-comercial-portal-visual-browser-review
          path: ${{ runner.temp }}/p0-browser-images
          if-no-files-found: error
          retention-days: 7
      - name: Checkout exact Sites PG18 atomic outbox candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-sites
          ref: 3d20d83d544577a70c091ca1725c084ab6824d2a
          path: _sites_pg_candidate
          persist-credentials: false
      - name: Checkout exact synthetic Sites signed authority verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-sites
          ref: 21732e9558b730e38a6845adb593d29f309ff6a9
          path: _sites_signed_candidate
          persist-credentials: false
      - name: Checkout exact synthetic Portal Sites signer, never an IAM release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-portal
          ref: bf1b2794de4d6000f120ffa2b1e6dd557f34c35e
          path: _portal_sites_signer_candidate
          persist-credentials: false
      - name: Checkout exact metadata-only Sites lead envelope library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-sites
          ref: 057b6f859df5050c842a86d18676e6332a79d1f9
          path: _sites_lead_candidate
          persist-credentials: false
      - name: Checkout exact metadata-only CRM lead envelope inspector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-crm
          ref: 58ac8ee32483c9f6b70af95eac7207a7a9163200
          path: _crm_metadata_candidate
          persist-credentials: false
      - name: Refuse unpinned CRM and Sites source or PHP syntax drift
        run: |
          set -euo pipefail
          test "$(git -C _sites_lead_candidate rev-parse HEAD)" = 057b6f859df5050c842a86d18676e6332a79d1f9
          test "$(git -C _crm_metadata_candidate rev-parse HEAD)" = 58ac8ee32483c9f6b70af95eac7207a7a9163200
          php -l apps/portal/tools/test_sites_crm_after_purchase_pg18.php
          php -l _sites_lead_candidate/src/Integration/SyntheticCrmLeadEnvelopeV1Draft.php
          php -l _sites_lead_candidate/src/Integration/SyntheticLeadBindingAuthorityPreflight.php
          php -l _crm_metadata_candidate/app/Core/Leads/SyntheticLeadEnvelopeV1Inspector.php
      - name: Check exact Portal/Sites signing and storage candidate pins
        run: |
          set -euo pipefail
          test "$(git -C _sites_pg_candidate rev-parse HEAD)" = 3d20d83d544577a70c091ca1725c084ab6824d2a
          test "$(git -C _sites_signed_candidate rev-parse HEAD)" = 21732e9558b730e38a6845adb593d29f309ff6a9
          test "$(git -C _portal_sites_signer_candidate rev-parse HEAD)" = bf1b2794de4d6000f120ffa2b1e6dd557f34c35e
          php -l apps/portal/tools/test_portal_sites_after_purchase_pg18.php
      - name: Create SECOND disposable Sites PG18 database, after Portal UI checks
        run: |
          set -euo pipefail
          php -r '
          $db=new PDO("pgsql:host=127.0.0.1;port=5432;dbname=postgres","postgres","synthetic-ci-only",[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
          if($db->query("SELECT current_database()")->fetchColumn()!=="postgres")exit(2);
          $db->exec("CREATE DATABASE sites_f360_lab");
          $db->exec("ALTER ROLE postgres PASSWORD '\''f360-fictional-admin-disposable-only'\''");
          '
      - name: Run pinned Sites admission, worker, signed source and durable nonce fixtures
        env:
          APP_ENV: testing
          GITHUB_ACTIONS: 'true'
          SITES_F360_PG_LAB: '1'
          SITES_F361_OUTBOX_LAB: '1'
          SITES_F362_CROSS_STACK_LAB: '1'
          SITES_F363_NONCE_LAB: '1'
          SITES_F364_BRIDGE_LAB: '1'
          SITES_P0_AFTER_PURCHASE_LAB: '1'
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: sites_f360_lab
          DB_USERNAME: postgres
          DB_PASSWORD: f360-fictional-admin-disposable-only
          SITES_F362_PORTAL_PATH: ${{ github.workspace }}/_portal_sites_signer_candidate
          SITES_F362_SITES_PATH: ${{ github.workspace }}/_sites_signed_candidate
        run: |
          set -euo pipefail
          php _sites_pg_candidate/tests/f360-pg-durable-admission-outbox.php
          php _sites_pg_candidate/tests/f361-pg-outbox-worker.php
          php _sites_pg_candidate/tests/f362-pinned-portal-to-pg-outbox.php
          php _sites_pg_candidate/tests/f363-pg-durable-nonce.php
          php _sites_pg_candidate/tests/f364-transactional-signed-ingress-adapter.php
          php apps/portal/tools/test_portal_sites_after_purchase_pg18.php
          CRM_P0_AFTER_SITES_LAB=1 php apps/portal/tools/test_sites_crm_after_purchase_pg18.php
          echo 'NO-GO: two disposable PG18 databases, fake grants/keys, no real authorization, Sites publishing or VPS.'
      - name: Verify redacted CI evidence counts and NO-GO flags before archiving
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          f=Path(os.environ['RUNNER_TEMP'])/'p0-commercial-portal-sites-evidence.json'
          m=json.loads(f.read_text(encoding='utf-8'))
          claims=m['claims']
          canonical=json.dumps(claims,separators=(',',':'),ensure_ascii=False)
          assert m['sha256']==hashlib.sha256(canonical.encode()).hexdigest()
          assert m['cryptographically_signed'] is False
          assert claims['release_gate']=='NO_GO'
          assert claims['commercial_to_portal_http_journeys']==4
          assert claims['portal_pg18_durable_fake_purchases']==4
          assert claims['sites_pg18_admitted_projects']==2
          assert claims['sites_pg18_outbox_events']==2
          assert claims['sites_pg18_replay_nonces']==4
          assert claims['performance_products_excluded_from_sites']==2
          assert claims['cross_tenant_forgeries_accepted']==0
          assert claims['network_scope']=='loopback_only'
          assert claims['synthetic_only'] is True
          for flag in ('business_iam_authenticated','external_revocation_verified','real_payment_processed',
                    'customer_data_used','site_publishing_authorized','crm_delivery_authorized',
                    'vps_deployed','production_released'):
              assert claims[flag] is False, flag
          data=f.read_bytes()
          assert len(data)<8000
          for marker in (b'@',b'TEST-',b'Empresa',b'password',b'Bearer ',b'Cookie:'):
              assert marker not in data, marker
          print('PASS: redacted evidence hash, counts, NO-GO and no customer/sample payload.')
          PY
      - name: Verify CRM diagnostic evidence is redacted and NOT an authorization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'p0-sites-crm-deny-evidence.json'
          report=json.loads(path.read_text(encoding='utf-8'))
          claims=report['claims']
          canonical=json.dumps(claims,ensure_ascii=False,separators=(',',':'))
          assert report['sha256']==hashlib.sha256(canonical.encode()).hexdigest()
          assert report['signed'] is False
          assert claims['release_gate']=='NO_GO'
          assert claims['portal_originated_site_outbox_events_delivered']==2
          assert claims['sites_crm_metadata_drafts_checked']==2
          assert claims['crm_submissions_persisted']==0
          assert claims['crm_leads_created']==0
          assert claims['synthetic_only'] is True
          assert claims['production_ready'] is False
          for key in ('crm_delivery_authorized','visitor_payload_inspected',
                      'external_authority_verified','real_customer_session_verified'):
              assert claims[key] is False,key
          raw=path.read_bytes()
          assert len(raw)<3000
          for token in (b'@',b'TEST-',b'Empresa',b'password',b'Bearer ',b'Cookie:'):
              assert token not in raw
          print('PASS: zero CRM delivery, exact pins, only diagnostic metadata and NO-GO evidence.')
          PY
      - name: Retain Sites-to-CRM NO-GO evidence for independent review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: imagine-p0-sites-crm-deny-diagnostic
          path: ${{ runner.temp }}/p0-sites-crm-deny-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Checkout pinned green CRM P0 fake-consented PG18 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-crm
          ref: 50c1eb574aa0ed81055dc256e77302acd1781d71
          path: _crm_fake_consent_candidate
          persist-credentials: false
      - name: Verify independently tested CRM source and PHP syntax
        run: |
          set -euo pipefail
          test "$(git -C _crm_fake_consent_candidate rev-parse HEAD)" = 50c1eb574aa0ed81055dc256e77302acd1781d71
          test -f _crm_fake_consent_candidate/tests/Labs/P0_LeadIngest/synthetic-consented-leads-pg18.sql
          php -l apps/portal/tools/test_four_project_fake_consented_crm_pg18.php
      - name: Create THIRD disposable CRM PostgreSQL18 database only after Site ACK
        run: |
          set -euo pipefail
          php -r '
          $pdo=new PDO("pgsql:host=127.0.0.1;port=5432;dbname=postgres",
            "postgres","f360-fictional-admin-disposable-only",
            [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
          if ($pdo->query("SELECT current_database()")->fetchColumn()!=="postgres") exit(2);
          $pdo->exec("CREATE DATABASE crm_p0_consent_lab");
          $pdo->exec("ALTER ROLE postgres PASSWORD '\''ci-fake-admin-intake-only'\''");
          '
      - name: Install exact CRM fixture with independent fake binding/consent authority
        env:
          PGPASSWORD: ci-fake-admin-intake-only
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres \
            -d crm_p0_consent_lab \
            -f _crm_fake_consent_candidate/tests/Labs/P0_LeadIngest/synthetic-consented-leads-pg18.sql
      - name: Prove actual Portal→Sites ACK then fake-consent CRM durable receipt, deny real contact
        env:
          GITHUB_ACTIONS: 'true'
          PORTAL_P0_FOUR_PROJECT_CONSENT_LAB: '1'
          SITES_F360_PG_LAB: '1'
          DB_HOST: 127.0.0.1
          CRM_LAB_DB: crm_p0_consent_lab
        run: |
          set -euo pipefail
          php apps/portal/tools/test_four_project_fake_consented_crm_pg18.php
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json,os
          file=Path(os.environ['RUNNER_TEMP'])/'p0-four-project-fake-consent-evidence.json'
          content=file.read_bytes()
          assert len(content)<3000
          for marker in (b'@',b'TEST-',b'password',b'Bearer ',b'Cookie:'):
              assert marker not in content
          report=json.loads(content)
          c=report['claims']
          assert report['sha256_integrity_only']==sha256(json.dumps(c,separators=(',',':')).encode()).hexdigest()
          assert c['release_gate']=='NO_GO'
          assert c['portal_purchases_persisted_fake']==4
          assert c['sites_projects_admitted_fake']==2
          assert c['sites_outbox_events_acknowledged_fake']==2
          assert c['crm_leads_persisted_fake']==2
          for k in ('crm_consent_authority_real','crm_service_auth_real',
                    'crm_lgpd_purpose_evidence_real','crm_visitor_payload_real',
                    'crm_public_endpoint_enabled','external_network_or_vps_used'):
              assert c[k] is False,k
          print('PASS: 4-project PG18 synthetic durable lead receipt and NO-GO evidence.')
          PY
      - name: Retain third-database four-project NO-GO synthetic evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: imagine-p0-four-project-fake-consented-crm-pg18
          path: ${{ runner.temp }}/p0-four-project-fake-consent-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain redacted homologation evidence without deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: imagine-p0-comercial-portal-sites-ci-evidence
          path: ${{ runner.temp }}/p0-commercial-portal-sites-evidence.json
          if-no-files-found: error
          retention-days: 7
