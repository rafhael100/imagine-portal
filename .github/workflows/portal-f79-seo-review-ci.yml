name: Portal F79 - SEO Offline Workbench Review

on:
  pull_request:
    paths:
      - 'apps/portal/app/Domain/SeoReview/**'
      - 'apps/portal/tools/f79-render-seo-review.php'
      - 'apps/portal/tests/Fixtures/seo-review-offline-v1.json'
      - 'apps/portal/tests/Unit/OfflineSeoHandoffPreviewTest.php'
      - 'apps/portal/labs/gsc-f135/**'
      - 'apps/portal/labs/gsc-f136/**'
      - 'apps/portal/labs/gsc-f138/**'
      - 'apps/portal/labs/gsc-f140/**'
      - 'apps/portal/labs/gsc-f141/**'
      - 'apps/portal/labs/gsc-f143/**'
      - 'apps/portal/labs/gsc-f146/**'
      - 'apps/portal/labs/gsc-f151/**'
      - 'apps/portal/labs/gsc-f152/**'
      - 'apps/portal/labs/gsc-f155/**'
      - 'apps/portal/labs/gsc-f156/**'
      - 'apps/portal/tools/f153-render-gsc-overlap-trend-offline.php'
      - 'apps/portal/tools/f142-render-gsc-overlap-offline.php'
      - 'apps/portal/tools/f137-render-gsc-offline.php'
      - 'apps/portal/tools/f139-render-gsc-comparison-offline.php'
      - 'apps/portal/tests/ui/test-f79-seo-review.mjs'
      - '.github/workflows/portal-f79-seo-review-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-f79-seo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Checkout exact reviewed SEO Engine source for synthetic parity
        if: matrix.php == '8.4' && matrix.node == '22'
        uses: actions/checkout@v4
        with:
          repository: rafhael100/imagine-seo-engine
          ref: bbcc198b5eb88585534c0a0374ed8c787f40e7ca
          path: .qa/seo-engine
          persist-credentials: false
      - name: Checkout immutable SEO RC32 for F156 synthetic parity
        if: matrix.php == '8.4' && matrix.node == '22'
        uses: actions/checkout@v4
        with:
          repository: rafhael100/imagine-seo-engine
          ref: f46b65aaef9b10e32d02e415907cd916a43b548e
          path: .qa/seo-rc32
          persist-credentials: false
      - name: Verify SEO RC32 F74 to Portal F155 strict DTO parity
        if: matrix.php == '8.4' && matrix.node == '22'
        shell: bash
        env:
          APP_ENV: testing
          PORTAL_GSC_QUERY_PAGE_REVIEW_LAB: '1'
        run: |
          set -euo pipefail
          umask 077
          node --check apps/portal/labs/gsc-f156/emit_node_query_page_review.mjs
          php -l apps/portal/labs/gsc-f156/verify_php_query_page_review.php
          php -l apps/portal/app/Domain/SeoReview/OfflineGscQueryPageReviewPreview.php
          fixture="$(mktemp)"
          trap 'rm -f "$fixture"' EXIT
          for scenario in complete redacted partial empty; do
            node apps/portal/labs/gsc-f156/emit_node_query_page_review.mjs "$scenario" > "$fixture"
            php apps/portal/labs/gsc-f156/verify_php_query_page_review.php "$fixture" "$scenario"
          done
      - name: Check Node SEO F50 to Portal PHP F135 DTO parity
        if: matrix.php == '8.4' && matrix.node == '22'
        shell: bash
        env:
          APP_ENV: testing
          PORTAL_GSC_WORKFLOW_LAB: '1'
        run: |
          set -euo pipefail
          umask 077
          node --check apps/portal/labs/gsc-f136/emit_node_seo_f50.mjs
          php -l apps/portal/labs/gsc-f136/verify_php_seo_f50.php
          fixture="$(mktemp)"
          trap 'rm -f "$fixture"' EXIT
          node apps/portal/labs/gsc-f136/emit_node_seo_f50.mjs > "$fixture"
          php apps/portal/labs/gsc-f136/verify_php_seo_f50.php "$fixture"
          node --check apps/portal/labs/gsc-f138/emit_node_daily_comparison.mjs
          php -l apps/portal/labs/gsc-f138/verify_php_daily_comparison.php
          comparison="$(mktemp)"
          trap 'rm -f "$fixture" "$comparison"' EXIT
          node apps/portal/labs/gsc-f138/emit_node_daily_comparison.mjs > "$comparison"
          PORTAL_GSC_COMPARISON_LAB=1 php apps/portal/labs/gsc-f138/verify_php_daily_comparison.php "$comparison"
          php -l apps/portal/tools/f139-render-gsc-comparison-offline.php
          trend_html="$(mktemp)"
          trap 'rm -f "$fixture" "$comparison" "$trend_html"' EXIT
          PORTAL_GSC_COMPARISON_LAB=1 PORTAL_GSC_COMPARISON_HTML_LAB=1 php             apps/portal/tools/f139-render-gsc-comparison-offline.php "$comparison" > "$trend_html"
          grep -q 'DEMONSTRAÇÃO NÃO HOMOLOGADA' "$trend_html"
          grep -q 'Revisar redução de impressões' "$trend_html"
          grep -q 'name="robots" content="noindex,nofollow"' "$trend_html"
          if grep -Eiq '<(script|form|a)([[:space:]>])' "$trend_html"; then
            echo "F139: interactive output refused" >&2
            exit 1
          fi
          node --check apps/portal/labs/gsc-f140/emit_node_daily_portal_handoff.mjs
          php -l apps/portal/labs/gsc-f140/verify_php_daily_portal_handoff.php
          handoff="$(mktemp)"
          handoff_html="$(mktemp)"
          trap 'rm -f "$fixture" "$comparison" "$trend_html" "$handoff" "$handoff_html"' EXIT
          node apps/portal/labs/gsc-f140/emit_node_daily_portal_handoff.mjs > "$handoff"
          PORTAL_SEO_HANDOFF_LAB=1 php apps/portal/labs/gsc-f140/verify_php_daily_portal_handoff.php "$handoff"
          PORTAL_SEO_HANDOFF_LAB=1 PORTAL_F79_HTML_LAB=1 php \
            apps/portal/tools/f79-render-seo-review.php "$handoff" > "$handoff_html"
          grep -q 'DEMONSTRAÇÃO NÃO HOMOLOGADA' "$handoff_html"
          grep -q 'Cliques fictícios' "$handoff_html"
          if grep -Eiq '<(script|form|a)([[:space:]>])' "$handoff_html"; then
            echo "F140: executable/interactive output refused" >&2
            exit 1
          fi
          node --check apps/portal/labs/gsc-f141/emit_node_overlap.mjs
          php -l apps/portal/labs/gsc-f141/verify_php_overlap.php
          overlap="$(mktemp)"
          trap 'rm -f "$fixture" "$comparison" "$trend_html" "$handoff" "$handoff_html" "$overlap"' EXIT
          node apps/portal/labs/gsc-f141/emit_node_overlap.mjs > "$overlap"
          PORTAL_GSC_OVERLAP_LAB=1 php apps/portal/labs/gsc-f141/verify_php_overlap.php "$overlap"
          node --test .qa/seo-engine/tests/gsc-query-page-url-safety.test.mjs
          node --test .qa/seo-engine/tests/gsc-query-page-variants.test.mjs
          node --test .qa/seo-engine/tests/gsc-strict-arrays.test.mjs
          node --check apps/portal/labs/gsc-f143/emit_node_pagination.mjs
          php -l apps/portal/labs/gsc-f143/verify_php_pagination.php
          pages_fixture="$(mktemp)"
          trap 'rm -f "$fixture" "$comparison" "$trend_html" "$handoff" "$handoff_html" "$overlap" "$pages_fixture"' EXIT
          node apps/portal/labs/gsc-f143/emit_node_pagination.mjs > "$pages_fixture"
          PORTAL_GSC_OVERLAP_LAB=1 PORTAL_GSC_PAGINATION_LAB=1 php \
            apps/portal/labs/gsc-f143/verify_php_pagination.php "$pages_fixture"
          php -l apps/portal/labs/gsc-f146/verify_php_request_response_pair.php
          PORTAL_GSC_OVERLAP_LAB=1 PORTAL_GSC_PAGINATION_LAB=1 PORTAL_GSC_REQUEST_LAB=1 php \
            apps/portal/labs/gsc-f146/verify_php_request_response_pair.php "$pages_fixture"
          php -l apps/portal/labs/gsc-f151/verify_php_next_page.php
          PORTAL_GSC_OVERLAP_LAB=1 PORTAL_GSC_PAGINATION_LAB=1 PORTAL_GSC_REQUEST_LAB=1 php \
            apps/portal/labs/gsc-f151/verify_php_next_page.php "$pages_fixture"
          node --check apps/portal/labs/gsc-f152/emit_node_overlap_trend.mjs
          php -l apps/portal/labs/gsc-f152/verify_php_overlap_trend.php
          overlap_trend="$(mktemp)"
          trap 'rm -f "$fixture" "$comparison" "$trend_html" "$handoff" "$handoff_html" "$overlap" "$pages_fixture" "$overlap_trend"' EXIT
          node apps/portal/labs/gsc-f152/emit_node_overlap_trend.mjs > "$overlap_trend"
          PORTAL_GSC_TRENDS_LAB=1 php \
            apps/portal/labs/gsc-f152/verify_php_overlap_trend.php "$overlap_trend"
          php -l apps/portal/tools/f153-render-gsc-overlap-trend-offline.php
          overlap_trend_html="$(mktemp)"
          PORTAL_GSC_TRENDS_LAB=1 PORTAL_GSC_TREND_HTML_LAB=1 php \
            apps/portal/tools/f153-render-gsc-overlap-trend-offline.php "$overlap_trend" > "$overlap_trend_html"
          grep -q 'DEMONSTRAÇÃO NÃO HOMOLOGADA' "$overlap_trend_html"
          grep -q 'Variação da sobreposição' "$overlap_trend_html"
          grep -q 'Investigar possível aumento da sobreposição editorial' "$overlap_trend_html"
          grep -q 'name="robots" content="noindex,nofollow"' "$overlap_trend_html"
          if grep -Eiq '<(script|form|a)([[:space:]>])' "$overlap_trend_html"; then
            echo "F153: interactive/unsafe HTML refused" >&2
            exit 1
          fi
          pages_html="$(mktemp)"
          trap 'rm -f "$fixture" "$comparison" "$trend_html" "$handoff" "$handoff_html" "$overlap" "$pages_fixture" "$pages_html"' EXIT
          PORTAL_GSC_OVERLAP_LAB=1 PORTAL_GSC_PAGINATION_LAB=1 PORTAL_GSC_OVERLAP_HTML_LAB=1 php \
            apps/portal/tools/f142-render-gsc-overlap-offline.php "$pages_fixture" > "$pages_html"
          grep -q 'Lotes analisados' "$pages_html"
          grep -q 'Pode haver mais páginas de resultados' "$pages_html"
          grep -q 'DEMONSTRAÇÃO NÃO HOMOLOGADA' "$pages_html"
          if grep -Eiq '<(script|form|a)([[:space:]>])' "$pages_html"; then
            echo "F145: unexpected interactive HTML output" >&2
            exit 1
          fi
          php -l apps/portal/tools/f142-render-gsc-overlap-offline.php
          overlap_html="$(mktemp)"
          trap 'rm -f "$fixture" "$comparison" "$trend_html" "$handoff" "$handoff_html" "$overlap" "$overlap_html"' EXIT
          PORTAL_GSC_OVERLAP_LAB=1 PORTAL_GSC_OVERLAP_HTML_LAB=1 php \
            apps/portal/tools/f142-render-gsc-overlap-offline.php "$overlap" > "$overlap_html"
          grep -q 'DEMONSTRAÇÃO NÃO HOMOLOGADA' "$overlap_html"
          grep -q 'Consultas associadas a mais de uma página' "$overlap_html"
          grep -q 'name="robots" content="noindex,nofollow"' "$overlap_html"
          if grep -Eiq '<(script|form|a)([[:space:]>])' "$overlap_html"; then
            echo "F142: interactive output refused" >&2
            exit 1
          fi
          php -l apps/portal/tools/f137-render-gsc-offline.php
          preview="$(mktemp)"
          trap 'rm -f "$fixture" "$comparison" "$trend_html" "$handoff" "$handoff_html" "$overlap" "$pages_fixture" "$overlap_trend" "$pages_html" "$overlap_html" "$preview"' EXIT
          PORTAL_GSC_HTML_LAB=1 php apps/portal/tools/f137-render-gsc-offline.php "$fixture" > "$preview"
          grep -q 'DEMONSTRAÇÃO NÃO HOMOLOGADA' "$preview"
          grep -q 'name="robots" content="noindex,nofollow"' "$preview"
          if grep -Eiq '<(script|form|a)([[:space:]>])' "$preview"; then
            echo "F137: interactive/public surface rejected" >&2
            exit 1
          fi
      - name: Strict offline SEO schema, HTML and fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/portal/app/Domain/SeoReview/OfflineSeoHandoffPreview.php
          php -l apps/portal/app/Domain/SeoReview/OfflineGscWorkflowPreview.php
          php -l apps/portal/app/Domain/SeoReview/OfflineGscDailyComparisonPreview.php
          php -l apps/portal/app/Domain/SeoReview/OfflineGscQueryPageOverlapPreview.php
          php -l apps/portal/app/Domain/SeoReview/OfflineGscQueryPagePaginationPreview.php
          php -l apps/portal/app/Domain/SeoReview/GoogleSearchConsoleQueryPagePaginationPlan.php
          php -l apps/portal/app/Domain/SeoReview/GoogleSearchConsoleProviderResponsePolicy.php
          php -l apps/portal/app/Domain/SeoReview/GoogleSearchConsoleNextPageIntent.php
          php -l apps/portal/app/Domain/SeoReview/OfflineGscOverlapTrendPreview.php
          php -l apps/portal/tests/Unit/GoogleSearchConsoleProviderResponsePolicyTest.php
          php -l apps/portal/labs/gsc-f135/test_dto_bridge.php
          APP_ENV=testing PORTAL_GSC_WORKFLOW_LAB=1 php apps/portal/labs/gsc-f135/test_dto_bridge.php
          php -l apps/portal/tools/f79-render-seo-review.php
          node --check apps/portal/tests/ui/test-f79-seo-review.mjs
          node apps/portal/tests/ui/test-f79-seo-review.mjs
          if grep -R -n -E 'OfflineSeoHandoffPreview|OfflineGscWorkflowPreview|PORTAL_GSC_PAGINATION_LAB|PORTAL_GSC_REQUEST_LAB|PORTAL_GSC_TREND_HTML_LAB|f153-render-gsc-overlap-trend-offline|OfflineGscOverlapTrendPreview|PORTAL_GSC_TRENDS_LAB|GoogleSearchConsoleNextPageIntent|GoogleSearchConsoleProviderResponsePolicy|GoogleSearchConsoleQueryPagePaginationPlan|OfflineGscQueryPagePaginationPreview|PORTAL_GSC_OVERLAP_HTML_LAB|f142-render-gsc-overlap-offline|PORTAL_GSC_OVERLAP_LAB|OfflineGscQueryPageOverlapPreview|PORTAL_GSC_COMPARISON_LAB|PORTAL_GSC_COMPARISON_HTML_LAB|f139-render-gsc-comparison-offline|OfflineGscDailyComparisonPreview|PORTAL_GSC_WORKFLOW_LAB|PORTAL_GSC_HTML_LAB|f137-render-gsc-offline|PORTAL_F79_HTML_LAB|f79-render-seo-review' apps/portal/routes/ apps/portal/bootstrap/ apps/portal/app/Providers/; then
            echo 'F79 SEO review fixture is wired to an operational route' >&2
            exit 1
          fi
      - name: Render only synthetic SEO preview for internal review
        if: matrix.php == '8.4' && matrix.node == '22'
        shell: bash
        env:
          APP_ENV: testing
          PORTAL_SEO_HANDOFF_LAB: '1'
          PORTAL_F79_HTML_LAB: '1'
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .portal-f79-seo-preview
          php apps/portal/tools/f79-render-seo-review.php \
            apps/portal/tests/Fixtures/seo-review-offline-v1.json \
            > .portal-f79-seo-preview/seo-review-DEMO.html
          test -s .portal-f79-seo-preview/seo-review-DEMO.html
          grep -q 'DEMONSTRAÇÃO NÃO HOMOLOGADA' .portal-f79-seo-preview/seo-review-DEMO.html
          trend_json="$(mktemp)"
          trap 'rm -f "$trend_json"' EXIT
          node apps/portal/labs/gsc-f152/emit_node_overlap_trend.mjs > "$trend_json"
          PORTAL_GSC_TRENDS_LAB=1 PORTAL_GSC_TREND_HTML_LAB=1 php \
            apps/portal/tools/f153-render-gsc-overlap-trend-offline.php "$trend_json" \
            > .portal-f79-seo-preview/gsc-overlap-trend-DEMO.html
          grep -q 'DEMONSTRAÇÃO NÃO HOMOLOGADA' .portal-f79-seo-preview/gsc-overlap-trend-DEMO.html
      - name: Preserve review-only static HTML (two days)
        if: matrix.php == '8.4' && matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: portal-f79-seo-review-demo
          path: |
            .portal-f79-seo-preview/seo-review-DEMO.html
            .portal-f79-seo-preview/gsc-overlap-trend-DEMO.html
          if-no-files-found: error
          retention-days: 2
