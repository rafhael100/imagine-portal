name: Portal F22 - PHP Laravel adapter vs disposable PG18
on:
  pull_request:
    paths:
      - 'apps/portal/app/Labs/F22/**'
      - 'apps/portal/app/Domain/ClientOverview/DemoServiceRelationPage.php'
      - 'apps/portal/tests/Integration/F22PgServiceReadIntegrationTest.php'
      - 'apps/portal/labs/service-relations-f22/**'
      - 'apps/portal/labs/service-relations-f24/**'
      - 'apps/portal/labs/service-relations-f25/**'
      - 'apps/portal/app/Labs/F24/**'
      - 'apps/portal/tests/Integration/F24SessionRevocationIntegrationTest.php'
      - 'apps/portal/app/Labs/F26/**'
      - 'apps/portal/app/Labs/F28/**'
      - 'apps/portal/app/Labs/F29/**'
      - 'apps/portal/app/Labs/F30/**'
      - 'apps/portal/app/Labs/F31/**'
      - 'apps/portal/tests/Integration/F32ActualPgRestoreWitnessTest.php'
      - 'apps/portal/labs/service-relations-f32/**'
      - 'apps/portal/tests/Integration/F31IndependentRevocationFloorTest.php'
      - 'apps/portal/labs/service-relations-f31/**'
      - 'apps/portal/tests/Integration/F30ViewSchemaIntegrityTest.php'
      - 'apps/portal/labs/service-relations-f30/**'
      - 'apps/portal/tests/Integration/F29RlsPolicyGrantDriftTest.php'
      - 'apps/portal/labs/service-relations-f29/**'
      - 'apps/portal/tests/Integration/F28RevocationFenceIntegrityTest.php'
      - 'apps/portal/labs/service-relations-f28/**'
      - 'apps/portal/tests/Integration/F26AuthorityReadRehearsalTest.php'
      - '.github/workflows/portal-f22-laravel-pg-readonly.yml'
  push:
    branches:
      - test/portal-f22-laravel-pg-readonly-adapter-2026-11-09
    paths:
      - 'apps/portal/app/Labs/F22/**'
      - 'apps/portal/app/Domain/ClientOverview/DemoServiceRelationPage.php'
      - 'apps/portal/tests/Integration/F22PgServiceReadIntegrationTest.php'
      - 'apps/portal/labs/service-relations-f22/**'
      - 'apps/portal/labs/service-relations-f24/**'
      - 'apps/portal/labs/service-relations-f25/**'
      - 'apps/portal/app/Labs/F24/**'
      - 'apps/portal/tests/Integration/F24SessionRevocationIntegrationTest.php'
      - 'apps/portal/app/Labs/F26/**'
      - 'apps/portal/app/Labs/F28/**'
      - 'apps/portal/app/Labs/F29/**'
      - 'apps/portal/app/Labs/F30/**'
      - 'apps/portal/app/Labs/F31/**'
      - 'apps/portal/tests/Integration/F32ActualPgRestoreWitnessTest.php'
      - 'apps/portal/labs/service-relations-f32/**'
      - 'apps/portal/tests/Integration/F31IndependentRevocationFloorTest.php'
      - 'apps/portal/labs/service-relations-f31/**'
      - 'apps/portal/tests/Integration/F30ViewSchemaIntegrityTest.php'
      - 'apps/portal/labs/service-relations-f30/**'
      - 'apps/portal/tests/Integration/F29RlsPolicyGrantDriftTest.php'
      - 'apps/portal/labs/service-relations-f29/**'
      - 'apps/portal/tests/Integration/F28RevocationFenceIntegrityTest.php'
      - 'apps/portal/labs/service-relations-f28/**'
      - 'apps/portal/tests/Integration/F26AuthorityReadRehearsalTest.php'
      - '.github/workflows/portal-f22-laravel-pg-readonly.yml'

permissions:
  contents: read

concurrency:
  group: portal-f22-read-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-pdo-pgsql-lab:
    name: PHP ${{ matrix.php }} / PG18 / per-role SQL access
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    env:
      F22_PG_CONTAINER: f22-db-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.php }}
      F31_WITNESS_CONTAINER: f31-db-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.php }}
    defaults:
      run:
        working-directory: apps/portal
        shell: bash
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install PHP runtime and pdo_pgsql (runner only)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: mbstring, dom, xml, pdo, pdo_pgsql, curl, fileinfo, intl, bcmath, zip

      - name: Verify PHP and checked-in Composer lockfile
        run: |
          set -euo pipefail
          php -r 'if (!extension_loaded("pdo_pgsql")) exit(2);'
          composer validate --no-check-publish --strict
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          composer dump-autoload --no-interaction --no-scripts --no-plugins
          git diff --exit-code -- composer.lock
          php -l app/Labs/F22/SyntheticPgServiceReadAdapter.php
          php -l tests/Integration/F22PgServiceReadIntegrationTest.php
          php -l app/Labs/F24/F24LabSessionProof.php
          php -l app/Labs/F24/F24SyntheticAuthorizedReader.php
          php -l tests/Integration/F24SessionRevocationIntegrationTest.php
          php -l app/Labs/F26/F26AuthorityReadRehearsal.php
          php -l tests/Integration/F26AuthorityReadRehearsalTest.php
          php -l app/Labs/F28/F28RevocationFenceInspector.php
          php -l tests/Integration/F28RevocationFenceIntegrityTest.php
          php -l app/Labs/F29/F29SyntheticRlsPolicyInspector.php
          php -l tests/Integration/F29RlsPolicyGrantDriftTest.php
          php -l app/Labs/F30/F30SyntheticViewSchemaInspector.php
          php -l tests/Integration/F30ViewSchemaIntegrityTest.php
          php -l app/Labs/F31/F31ExternalFloorSnapshot.php
          php -l app/Labs/F31/F31ExternalWitnessReader.php
          php -l app/Labs/F31/F31RollbackAwareLabReader.php
          php -l tests/Integration/F31IndependentRevocationFloorTest.php
          php -l tests/Integration/F32ActualPgRestoreWitnessTest.php

      - name: Exercise authenticated PDO connections against disposable PG18
        run: |
          set -euo pipefail
          admin_password="$(openssl rand -hex 32)"
          role_a_password="$(openssl rand -hex 32)"
          role_b_password="$(openssl rand -hex 32)"
          witness_admin_password="$(openssl rand -hex 32)"
          witness_reader_password="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$admin_password" "$role_a_password" "$role_b_password" "$witness_admin_password" "$witness_reader_password"
          # Only loopback host binding: 127.0.0.1 random ephemeral port.
          # No domain, no customer account, no durable volumes, no VPS.
          docker run -d --rm --name "$F22_PG_CONTAINER" \
            --publish 127.0.0.1::5432 \
            -e POSTGRES_PASSWORD="$admin_password" \
            -e POSTGRES_INITDB_ARGS="--auth-host=scram-sha-256" \
            postgres:18 >/dev/null
          # Always destroy BOTH independent fixture databases, including
          # anonymous Docker volumes, even on assertion or provisioning failure.
          trap 'docker rm -fv "$F22_PG_CONTAINER" "$F31_WITNESS_CONTAINER" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 50); do
            if docker exec "$F22_PG_CONTAINER" pg_isready -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec "$F22_PG_CONTAINER" pg_isready -U postgres >/dev/null
          docker exec -i "$F22_PG_CONTAINER" \
            psql -X -qAt -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < labs/service-relations-f21/schema.sql >/dev/null
          docker exec -i "$F22_PG_CONTAINER" \
            psql -X -qAt -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < labs/service-relations-f24/schema.sql >/dev/null
          docker exec -i "$F22_PG_CONTAINER" \
            psql -X -qAt -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < labs/service-relations-f25/schema.sql >/dev/null
          # F30: synthetic schema view fingerprint only. No secrets or
          # customer SQL, used to pin expected PG18 deparser output.
          f30_view="$(docker exec "$F22_PG_CONTAINER" psql -X -qAt             -v ON_ERROR_STOP=1 -U postgres -d postgres             -c "SELECT pg_catalog.pg_get_viewdef('f21.service_summary'::regclass, false)")"
          printf 'F30_SYNTHETIC_VIEW_SHA256=%s\n'             "$(printf '%s' "$f30_view" | sha256sum | cut -d' ' -f1)"
          docker exec -i "$F22_PG_CONTAINER" \
            psql -X -qAt -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -v "password_a=$role_a_password" -v "password_b=$role_b_password" <<'SQL'
          ALTER ROLE f21_org_a PASSWORD :'password_a';
          ALTER ROLE f21_org_b PASSWORD :'password_b';
          SQL

          # Parse the ephemeral loopback host port without displaying secrets.
          mapped_port="$(docker port "$F22_PG_CONTAINER" 5432/tcp)"
          port="$(printf '%s\n' "$mapped_port" | awk -F: 'END {print $NF}')"
          if [[ ! "$port" =~ ^[0-9]{4,5}$ ]]; then
            echo "F22 requires a random local PostgreSQL host port." >&2
            exit 1
          fi
          echo "F22 PostgreSQL 18 available exclusively at localhost:ephemeral."
          export F22_ENABLE_LAB=NON_OPERATIONAL_F22
          export F22_PG_HOST=127.0.0.1
          export F22_PG_PORT="$port"
          export F22_PG_PASSWORD_A="$role_a_password"
          export F22_PG_PASSWORD_B="$role_b_password"
          export F22_PG_PASSWORD_ADMIN="$admin_password"

          # F31: entirely separate PostgreSQL 18 instance with its OWN
          # temporary data directory/admin/reader credentials. Both bind
          # only to random localhost ports on this GitHub runner.
          docker run -d --rm --name "$F31_WITNESS_CONTAINER" \
            --publish 127.0.0.1::5432 \
            -e POSTGRES_PASSWORD="$witness_admin_password" \
            -e POSTGRES_INITDB_ARGS="--auth-host=scram-sha-256" \
            postgres:18 >/dev/null

          for attempt in $(seq 1 50); do
            if docker exec "$F31_WITNESS_CONTAINER" pg_isready -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec "$F31_WITNESS_CONTAINER" pg_isready -U postgres >/dev/null
          docker exec -i "$F31_WITNESS_CONTAINER" \
            psql -X -qAt -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < labs/service-relations-f31/witness-schema.sql >/dev/null
          docker exec -i "$F31_WITNESS_CONTAINER" \
            psql -X -qAt -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -v "witness_password=$witness_reader_password" <<'SQL'
          ALTER ROLE f31_witness_reader PASSWORD :'witness_password';
          SQL

          witness_port="$(docker port "$F31_WITNESS_CONTAINER" 5432/tcp | awk -F: 'END {print $NF}')"
          if [[ ! "$witness_port" =~ ^[0-9]{4,5}$ || "$witness_port" == "$port" ]]; then
            echo "F31 must use a different disposable PostgreSQL loopback port." >&2
            exit 1
          fi

          export F31_ENABLE_LAB=INDEPENDENT_DISPOSABLE_WITNESS
          export F31_PG_HOST=127.0.0.1
          export F31_PG_PORT="$witness_port"
          export F31_PG_PASSWORD_READER="$witness_reader_password"
          export F31_PG_PASSWORD_ADMIN="$witness_admin_password"
          echo "F31 synthetic external witness is a SECOND disposable container."
          echo "F31 neither survives this runner nor represents an independently operated trust domain."

          # phpunit.xml does not discover tests/Integration automatically;
          # target this file explicitly, without modifying Laravel routes.
          vendor/bin/phpunit --configuration phpunit.xml \
            tests/Integration

          # F32: ACTUAL LOGICAL BACKUP and RESTORE of the entire primary
          # PostgreSQL 18 *lab* database. Witness stays separate and
          # untouched. Never point this sequence at a real server.
          umask 077
          f32_backup="$(mktemp /tmp/f32-primary-lab-XXXXXXXX.backup)"
          trap 'rm -f "$f32_backup"; docker rm -fv "$F22_PG_CONTAINER" "$F31_WITNESS_CONTAINER" >/dev/null 2>&1 || true' EXIT

          docker exec "$F22_PG_CONTAINER" \
            pg_dump -U postgres -d postgres -Fc > "$f32_backup"
          if [[ ! -s "$f32_backup" ]]; then
            echo "F32 expected non-empty disposable PG dump." >&2
            exit 1
          fi

          docker exec "$F22_PG_CONTAINER" \
            psql -X -qAt -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "UPDATE f24.session_fixture SET mock_state='revoked',session_revision=2
                 WHERE organization_id='org-a' AND session_id='DEMO-SESSION-A'" >/dev/null

          # A separate admin updates only the ephemeral witness. The
          # entire witness instance is deliberately excluded from restore.
          docker exec "$F31_WITNESS_CONTAINER" \
            psql -X -qAt -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "UPDATE f31.revocation_floor
                    SET session_floor=2,sequence_number=2,changed_at=1800000031
                  WHERE organization_id='org-a'" >/dev/null

          # Full primary-DB pg_restore --clean overwrites its fictional
          # database objects/data back to snapshot revision 1.
          docker exec -i "$F22_PG_CONTAINER" \
            pg_restore -U postgres -d postgres --clean --if-exists \
              --exit-on-error < "$f32_backup" >/dev/null
          export F32_AFTER_RESTORE=DUMP_RESTORE_COMPLETED
          vendor/bin/phpunit --configuration phpunit.xml \
            tests/Integration/F32ActualPgRestoreWitnessTest.php
          unset F32_AFTER_RESTORE
          rm -f "$f32_backup"

          echo "F32 ACTUAL SYNTHETIC PG_DUMP/PG_RESTORE: primary restored; independent witness retained newer floor."
          echo "F32 RESTRICTION: no production backup, PITR, physical restore, external trust domain or Z4 certification."
          echo "F22/F24 LAB ONLY: PHP PDO verified local DB identities/RLS and synthetic revocation; no real IAM."
          echo "F22 LAB ONLY: no backend Node.js, DB migration or customer endpoint."
          echo "F22 LAB ONLY: P0, D02/D03, SEC-R03, release still BLOCKED."
          echo "F31 LAB ONLY: rollback simulation is not actual pg_restore or independent audit/witness attestation."
