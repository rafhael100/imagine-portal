name: Performance Phase7 exact Compose authenticated flow
on:
  push:
    branches: ['feat/admin-phase7-exact-compose-flow-2026-11-17']
    paths: ['apps/portal/**', '.github/workflows/performance-phase7-exact-compose.yml']
permissions:
  contents: read
jobs:
  exact-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ADMIN_PHASE7_CI: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-performance-ai
          ref: 3da0ba8552473baf4d4be10d86129259640a29c5
          path: engine
          persist-credentials: false
      - name: Locked browser and CI trust tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnss3-tools
          mkdir -p "$RUNNER_TEMP/phase7-browser"
          cd "$RUNNER_TEMP/phase7-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          echo "NODE_PATH=$RUNNER_TEMP/phase7-browser/node_modules" >> "$GITHUB_ENV"
      - name: Exact six-service package with authenticated synthetic flow
        run: bash apps/portal/tests/Fixtures/phase7/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: performance-phase7-exact-compose-evidence
          path: ${{ runner.temp }}/phase7-evidence
          retention-days: 7
