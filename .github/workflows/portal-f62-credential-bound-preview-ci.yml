name: Portal F62 - credential-bound Performance F100 contract
on:
  push:
    branches:
      - dev/portal-f62-credential-workbench-consumer-2026-11-10
  pull_request:
    paths:
      - 'apps/portal/app/Domain/PerformanceDashboard/CredentialBoundPerformanceWorkbenchPreview.php'
      - 'apps/portal/tests/Unit/CredentialBoundPerformanceWorkbenchPreviewStandalone.php'
      - '.github/workflows/portal-f62-credential-bound-preview-ci.yml'
permissions:
  contents: read
jobs:
  strict-offline-contract:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Verify strict offline preview, hostile payloads and NO-GO
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/portal/app/Domain/PerformanceDashboard/CredentialBoundPerformanceWorkbenchPreview.php
          php -l apps/portal/tests/Unit/CredentialBoundPerformanceWorkbenchPreviewStandalone.php
          php apps/portal/tests/Unit/CredentialBoundPerformanceWorkbenchPreviewStandalone.php
          if grep -R -n -E 'CredentialBoundPerformanceWorkbenchPreview|PORTAL_F62_CREDENTIAL_WORKBENCH_LAB' apps/portal/routes/ apps/portal/bootstrap/; then
            echo 'FAIL F62 offline preview referenced by application routes'
            exit 1
          fi
