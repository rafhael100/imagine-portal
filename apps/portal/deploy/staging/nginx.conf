server {
    listen 8443 ssl default_server;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Imagine private staging";
    auth_basic_user_file /run/secrets/access_passwords;
    server_name _;
    root /var/www/html/public;
    index index.php;
    autoindex off;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # The only executable PHP file is Laravel's public/index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # TLS terminates in this private ingress; do not trust browser headers.
        fastcgi_param HTTPS on;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 30s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}

