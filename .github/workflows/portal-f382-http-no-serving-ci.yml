name: Portal F382 - Laravel HTTP witness NO SERVING boundary
on:
  pull_request:
    paths:
      - 'apps/portal/app/Http/Middleware/PortalWitnessNoServingHttpGuard.php'
      - 'apps/portal/app/Infrastructure/Recovery/PortalWitnessOnlyIdentityRead.php'
      - 'apps/portal/app/Infrastructure/Recovery/NonceBoundPortalIdentityReadCandidate.php'
      - 'apps/portal/tests/Feature/PortalWitnessHttpNoServingGateTest.php'
      - '.github/workflows/portal-f382-http-no-serving-ci.yml'
permissions:
  contents: read
jobs:
  http-deny-when-witness-unavailable-or-valid:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom,xml,pdo,pdo_pgsql,curl,fileinfo,intl,bcmath,zip,sodium
          tools: composer:v2
          coverage: none
      - name: All witness candidates remain unbound and public routes stay closed
        run: |
          set -Eeuo pipefail
          php -l app/Infrastructure/Recovery/PortalWitnessOnlyIdentityRead.php
          php -l app/Infrastructure/Recovery/NonceBoundPortalIdentityReadCandidate.php
          php -l app/Http/Middleware/PortalWitnessNoServingHttpGuard.php
          php -l tests/Feature/PortalWitnessHttpNoServingGateTest.php
          if grep -R -E '(PortalWitnessNoServingHttpGuard|PortalWitnessOnlyIdentityRead)' \
              routes bootstrap app/Providers; then
            echo 'F382 witness HTTP candidate MUST NOT be bound or exposed publicly'
            exit 1
          fi
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php artisan test tests/Feature/PortalWitnessHttpNoServingGateTest.php --no-ansi
          php artisan test tests/Feature/PortalDefaultDenyAuthorityBindingsTest.php --no-ansi
          php artisan test tests/Feature/PortalAuthenticationRoutesClosedTest.php --no-ansi
