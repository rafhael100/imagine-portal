name: Portal F384 - Revocation-only HTTP without witness availability
on:
  pull_request:
    paths:
      - 'apps/portal/app/Http/Middleware/PortalRevocationOnlyNoServingGuard.php'
      - 'apps/portal/tests/Feature/PortalRevocationOnlyNoServingHttpTest.php'
      - '.github/workflows/portal-f384-revocation-only-ci.yml'
permissions:
  contents: read
jobs:
  csrf-logout-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom,xml,pdo,pdo_pgsql,curl,fileinfo,intl,bcmath,zip,sodium
          tools: composer:v2
          coverage: none
      - name: Verify that revocation exception is test-only, CSRF-protected, and no serving
        run: |
          set -Eeuo pipefail
          php -l app/Http/Middleware/PortalRevocationOnlyNoServingGuard.php
          php -l tests/Feature/PortalRevocationOnlyNoServingHttpTest.php
          if grep -R -E 'PortalRevocationOnlyNoServingGuard|portal.f384.revocation-only' \
              routes bootstrap app/Providers; then
            echo 'Revocation-only candidate MUST NOT bind to a public route'
            exit 1
          fi
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php artisan test tests/Feature/PortalRevocationOnlyNoServingHttpTest.php --no-ansi
          php artisan test tests/Feature/PortalWitnessAuthenticatedTransportNoServingTest.php --no-ansi
          php artisan test tests/Feature/PortalWitnessHttpNoServingGateTest.php --no-ansi
          php artisan test tests/Feature/PortalAuthenticationRoutesClosedTest.php --no-ansi
