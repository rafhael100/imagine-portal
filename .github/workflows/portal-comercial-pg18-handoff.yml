name: Portal P0 - Comercial Astro to Laravel PostgreSQL18 HTTP handoff (CI only)
on:
  pull_request:
    paths:
      - 'apps/portal/app/Http/Controllers/PurchaseRehearsalController.php'
      - 'apps/portal/resources/views/portal/rehearsal/purchase.blade.php'
      - 'apps/portal/tests/Feature/PurchaseRehearsalHttpTest.php'
      - 'apps/portal/tools/prepare_comercial_php_handoff_lab.py'
      - 'apps/portal/tools/test_comercial_php_handoff_browser.py'
      - 'apps/portal/tools/test_portal_sites_after_purchase_pg18.php'
      - '.github/workflows/portal-comercial-pg18-handoff.yml'
  push:
    branches:
      - review/portal-commercial-php-purchase-handoff-2026-11-13
permissions:
  contents: read
jobs:
  commercial-portal-real-lab:
    name: Locked Comercial Astro / real Laravel + PG18 / Chromium 4 flows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: portal_purchase_rehearsal
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_purchase_rehearsal"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout exact Portal candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout immutable reviewed Comercial offer card source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-comercial
          ref: b0aefbd01f55cbcdb1653a798f05a83b866e3d33
          path: _comercial_candidate
          persist-credentials: false
      - name: Verify immutable Comercial source pin and isolated scripts
        run: |
          set -euo pipefail
          test "$(git -C _comercial_candidate rev-parse HEAD)" = "b0aefbd01f55cbcdb1653a798f05a83b866e3d33"
          test -f _comercial_candidate/package-lock.json
          test -f apps/portal/tools/purchase_http_ci_router.php
          test -f apps/portal/tools/prepare_comercial_php_handoff_lab.py
      - name: Setup pinned PHP 8.4 and PG PDO
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, dom, xml
          coverage: none
          tools: composer:v2
      - name: Setup pinned Node 22 for exact Astro build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Build exact reviewed Astro and prepare only four loopback handoff links
        run: |
          set -euo pipefail
          cd _comercial_candidate
          npm ci --no-audit --no-fund
          npm run build
          node scripts/verify-dist.mjs
          cd ..
          python3 apps/portal/tools/prepare_comercial_php_handoff_lab.py _comercial_candidate/dist "$RUNNER_TEMP/comercial-php-handoff-lab"
          (cd _comercial_candidate && node scripts/verify-dist.mjs)
          test -f "$RUNNER_TEMP/comercial-php-handoff-lab/index.html"
      - name: Setup real Laravel and isolated PostgreSQL role-bound purchase
        working-directory: apps/portal
        run: |
          set -euo pipefail
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          composer dump-autoload --no-interaction --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php -l app/Http/Controllers/PurchaseRehearsalController.php
          php -l tools/purchase_http_ci_router.php
          php tools/test_persisted_purchase.php
      - name: Recheck Laravel access enforcement for commercial offer hint
        working-directory: apps/portal
        env:
          PORTAL_PURCHASE_HTTP_CI: '1'
        run: |
          set -euo pipefail
          php artisan test --filter=PurchaseRehearsalHttpTest --no-ansi
      - name: Execute REAL Astro CTA to Laravel HTTP and PG18, no public endpoint
        working-directory: apps/portal
        env:
          PORTAL_PURCHASE_HTTP_CI: '1'
          APP_ENV: staging
          APP_DEBUG: 'false'
          COMERCIAL_P0_HANDOFF_ROOT: ${{ runner.temp }}/comercial-php-handoff-lab
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/portal-comercial-playwright"
          "$RUNNER_TEMP/portal-comercial-playwright/bin/python" -m pip install --disable-pip-version-check --no-cache-dir playwright==1.56.0
          php -S 127.0.0.1:18776 tools/purchase_http_ci_router.php > "$RUNNER_TEMP/comercial-portal-php-http.log" 2>&1 &
          PORTAL_PID=$!
          trap 'kill "$PORTAL_PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time,urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18776/_rehearsal/purchase?offer=onepage',timeout=2) as response:
                      assert response.status==200
                  break
              except Exception:
                  time.sleep(.5)
          else: raise SystemExit('Private Laravel loopback refused readiness')
          PY
          "$RUNNER_TEMP/portal-comercial-playwright/bin/python" tools/test_comercial_php_handoff_browser.py
          echo 'NO-GO: GitHub temporary loopback only; no VPS, deployment, customer IAM or real payments.'
      - name: Checkout exact Sites PG18 atomic outbox candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-sites
          ref: 3d20d83d544577a70c091ca1725c084ab6824d2a
          path: _sites_pg_candidate
          persist-credentials: false
      - name: Checkout exact synthetic Sites signed authority verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-sites
          ref: 21732e9558b730e38a6845adb593d29f309ff6a9
          path: _sites_signed_candidate
          persist-credentials: false
      - name: Checkout exact synthetic Portal Sites signer, never an IAM release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-portal
          ref: bf1b2794de4d6000f120ffa2b1e6dd557f34c35e
          path: _portal_sites_signer_candidate
          persist-credentials: false
      - name: Check exact Portal/Sites signing and storage candidate pins
        run: |
          set -euo pipefail
          test "$(git -C _sites_pg_candidate rev-parse HEAD)" = 3d20d83d544577a70c091ca1725c084ab6824d2a
          test "$(git -C _sites_signed_candidate rev-parse HEAD)" = 21732e9558b730e38a6845adb593d29f309ff6a9
          test "$(git -C _portal_sites_signer_candidate rev-parse HEAD)" = bf1b2794de4d6000f120ffa2b1e6dd557f34c35e
          php -l apps/portal/tools/test_portal_sites_after_purchase_pg18.php
      - name: Create SECOND disposable Sites PG18 database, after Portal UI checks
        run: |
          set -euo pipefail
          php -r '
          $db=new PDO("pgsql:host=127.0.0.1;port=5432;dbname=postgres","postgres","synthetic-ci-only",[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
          if($db->query("SELECT current_database()")->fetchColumn()!=="postgres")exit(2);
          $db->exec("CREATE DATABASE sites_f360_lab");
          $db->exec("ALTER ROLE postgres PASSWORD '\''f360-fictional-admin-disposable-only'\''");
          '
      - name: Run pinned Sites admission, worker, signed source and durable nonce fixtures
        env:
          APP_ENV: testing
          GITHUB_ACTIONS: 'true'
          SITES_F360_PG_LAB: '1'
          SITES_F361_OUTBOX_LAB: '1'
          SITES_F362_CROSS_STACK_LAB: '1'
          SITES_F363_NONCE_LAB: '1'
          SITES_F364_BRIDGE_LAB: '1'
          SITES_P0_AFTER_PURCHASE_LAB: '1'
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: sites_f360_lab
          DB_USERNAME: postgres
          DB_PASSWORD: f360-fictional-admin-disposable-only
          SITES_F362_PORTAL_PATH: ${{ github.workspace }}/_portal_sites_signer_candidate
          SITES_F362_SITES_PATH: ${{ github.workspace }}/_sites_signed_candidate
        run: |
          set -euo pipefail
          php _sites_pg_candidate/tests/f360-pg-durable-admission-outbox.php
          php _sites_pg_candidate/tests/f361-pg-outbox-worker.php
          php _sites_pg_candidate/tests/f362-pinned-portal-to-pg-outbox.php
          php _sites_pg_candidate/tests/f363-pg-durable-nonce.php
          php _sites_pg_candidate/tests/f364-transactional-signed-ingress-adapter.php
          php apps/portal/tools/test_portal_sites_after_purchase_pg18.php
          echo 'NO-GO: two disposable PG18 databases, fake grants/keys, no real authorization, Sites publishing or VPS.'
