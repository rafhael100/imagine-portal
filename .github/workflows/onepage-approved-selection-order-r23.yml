name: OnePage Portal approved selector typed order R23 (CI-only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['fix/onepage-strict-current-proofs-r22-20261123']
    paths:
      - '.github/workflows/onepage-approved-selection-order-r23.yml'
      - 'apps/portal/app/Domain/SitesIntegration/OnepageApprovedBriefExportGate.php'
      - 'tests/onepage-approved-selector-order-r23.php'
      - 'docs/PORTAL-ONEPAGE-SELECTION-ORDER-R23.md'
permissions:
  contents: read
concurrency:
  group: portal-onepage-selection-r23-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  selector-order:
    if: >-
      github.repository == 'rafhael100/imagine-portal' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/onepage-approved-selection-order-r23-20261123' &&
      github.event.pull_request.base.ref == 'fix/onepage-strict-current-proofs-r22-20261123' &&
      github.event.pull_request.base.sha == 'b7a4510f544010f72e83ca27e0c7dafa2c388b27'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
          tools: none
      - name: Verify exact SHA, lint and selector regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          php -l apps/portal/app/Domain/SitesIntegration/OnepageApprovedBriefExportGate.php
          php -l tests/onepage-approved-brief-export-gate-offline.php
          php -l tests/onepage-approved-selector-order-r23.php
          php tests/onepage-approved-selector-order-r23.php | tee "$RUNNER_TEMP/r23.txt"
          grep -Eq '^ONEPAGE APPROVED BRIEF SOURCE BOUNDARY PASS: [1-9][0-9]* checks; default-deny, no official approval or transport[.]$' "$RUNNER_TEMP/r23.txt"
          grep -Eq '^ONEPAGE PORTAL SELECTION R23 PASS: [1-9][0-9]* new synthetic checks; NO-GO[.]$' "$RUNNER_TEMP/r23.txt"
      - name: Confirm no operational environment or secret material
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .env.production
          test ! -f .env.local
          test ! -d .pinned-portal
