name: Portal initial account - invited-only private preparation
on:
  pull_request:
    paths:
      - 'infra/development/portal-enrollment/**'
      - '.github/workflows/portal-initial-account-preparation.yml'
permissions:
  contents: read
concurrency:
  group: portal-initial-account-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  disposable-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Create only disposable runner database
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          sudo python3 infra/development/portal-db/prepare-secrets.py "$GITHUB_WORKSPACE/infra/development/portal-db/.private"
          sudo docker compose -p imagine-portal-enrollment-ci -f infra/development/portal-db/compose.yaml build provision
          sudo docker compose -p imagine-portal-enrollment-ci -f infra/development/portal-db/compose.yaml up -d --wait postgres
          sudo docker compose -p imagine-portal-enrollment-ci -f infra/development/portal-db/compose.yaml run --rm -T --interactive=false provision php provision.php install
      - name: Refuse unattended enrollment and prove atomic invited-only preparation
        run: |
          set -euo pipefail
          tool() {
            sudo docker compose -p imagine-portal-enrollment-ci -f infra/development/portal-db/compose.yaml run --rm -T --interactive=false \
              -e GITHUB_ACTIONS=true -e PORTAL_ENROLLMENT_CI=DISPOSABLE_ONLY \
              -e PORTAL_INITIAL_ACCOUNT=PREPARE_INVITED_ONLY \
              -v "$GITHUB_WORKSPACE/infra/development/portal-enrollment:/opt/portal-enrollment:ro" \
              provision "$@"
          }
          tool php -l /opt/portal-enrollment/InitialAccount.php
          tool php -l /opt/portal-enrollment/enroll.php
          tool php -l /opt/portal-enrollment/test.php
          if tool php /opt/portal-enrollment/enroll.php < /dev/null; then exit 1; fi
          tool php /opt/portal-enrollment/test.php < /dev/null
      - name: Always remove only the disposable enrollment project
        if: always()
        run: |
          test "$GITHUB_ACTIONS" = true
          sudo docker compose -p imagine-portal-enrollment-ci -f infra/development/portal-db/compose.yaml down --volumes --remove-orphans
