name: Portal F380 - Fresh nonce HTTPS v2 pre/post witness (NO SERVING)
on:
  pull_request:
    paths:
      - 'apps/portal/app/Infrastructure/Recovery/NonceBoundHttpsWitnessReadCandidate.php'
      - 'apps/portal/app/Infrastructure/Recovery/PortalLiveRecoveryEpochSourceCandidate.php'
      - 'apps/portal/app/Infrastructure/Recovery/PostgresPortalRecoveryEpochCandidateReader.php'
      - 'infra/development/portal-recovery/f380-challenge-https-fixture.mjs'
      - 'infra/development/portal-recovery/test-f380-https.php'
      - '.github/workflows/portal-f380-nonce-https-ci.yml'
permissions:
  contents: read
jobs:
  independent-signed-challenge-over-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    env:
      PORTAL_F380_CI: DISPOSABLE_ONLY
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium,curl
          tools: none
          coverage: none
      - name: Exercise 2 independent signed nonces over localhost TLS, NO SERVING
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$PORTAL_F380_CI" = DISPOSABLE_ONLY
          node --check infra/development/portal-recovery/f380-challenge-https-fixture.mjs
          php -l apps/portal/app/Infrastructure/Recovery/PortalLiveRecoveryEpochSourceCandidate.php
          php -l apps/portal/app/Infrastructure/Recovery/ChallengeBoundWitnessCandidateVerifier.php
          php -l apps/portal/app/Infrastructure/Recovery/NonceBoundHttpsWitnessReadCandidate.php
          php -l infra/development/portal-recovery/test-f380-https.php
          if php infra/development/portal-recovery/test-f380-https.php; then
            echo 'F380 must refuse missing CLI args.'
            exit 1
          fi
          scratch="$(mktemp -d)"
          chmod 700 "$scratch"
          server_pid=''
          cleanup() {
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf -- "$scratch"
          }
          trap cleanup EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=witness.f380.test.invalid' \
            -addext 'subjectAltName=DNS:witness.f380.test.invalid' \
            -keyout "$scratch/leaf.key" -out "$scratch/leaf.crt" >/dev/null 2>&1
          printf 'ok\n' > "$scratch/scenario"
          chmod 600 "$scratch/leaf.key" "$scratch/leaf.crt" "$scratch/scenario"
          tls_pin="sha256//$(openssl x509 -in "$scratch/leaf.crt" -noout -pubkey |
            openssl pkey -pubin -outform DER |
            openssl dgst -sha256 -binary | openssl base64 -A)"
          test "${#tls_pin}" -eq 52
          node infra/development/portal-recovery/f380-challenge-https-fixture.mjs \
            "$scratch" "$scratch/leaf.crt" "$scratch/leaf.key" > "$scratch/server.log" 2>&1 &
          server_pid=$!
          ready=0
          for i in $(seq 1 35); do
            if curl --silent --show-error --max-time 2 \
                --noproxy '*' --cacert "$scratch/leaf.crt" \
                --resolve witness.f380.test.invalid:18446:127.0.0.1 \
                --pinnedpubkey "$tls_pin" \
                'https://witness.f380.test.invalid:18446/no-serving-health' \
                -o /dev/null 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'F380 disposable HTTPS server exited during startup.'
              exit 1
            fi
            sleep 0.2
          done
          test "$ready" = 1
          test -s "$scratch/ed-public.hex"
          php infra/development/portal-recovery/test-f380-https.php \
            "$scratch" "$tls_pin" "$scratch/leaf.crt"
