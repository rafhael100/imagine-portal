name: Portal private database backup and restore rehearsal
on:
  pull_request:
    paths:
      - 'infra/operations/portal-db-*.sh'
      - 'infra/operations/PORTAL-DATABASE-BACKUP.md'
      - '.github/workflows/portal-private-backup-rehearsal.yml'
permissions:
  contents: read
concurrency:
  group: portal-backup-rehearsal-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  backup-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: imagine-portal-backup-ci
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Obtain the exact deployed foundation as disposable fixture
        uses: actions/checkout@v5
        with:
          ref: f342703ff8440e53bade5575703813df398bacbe
          path: foundation
          persist-credentials: false
      - name: Install disposable fixture and validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n infra/operations/portal-db-backup.sh
          bash -n infra/operations/portal-db-restore-probe.sh
          sudo install -d -m 0700 /srv/imagine/portal-development
          sudo cp -a foundation/. /srv/imagine/portal-development/
          sudo chown -R root:root /srv/imagine/portal-development
          sudo -E python3 /srv/imagine/portal-development/infra/development/portal-db/prepare-secrets.py /srv/imagine/portal-development/infra/development/portal-db/.private
          sudo install -m 0700 infra/operations/portal-db-backup.sh /usr/local/sbin/imagine-portal-db-backup
          sudo install -m 0700 infra/operations/portal-db-restore-probe.sh /usr/local/sbin/imagine-portal-db-restore-probe
      - name: Provision a private disposable database
        shell: bash
        run: |
          set -euo pipefail
          cd /srv/imagine/portal-development/infra/development/portal-db
          sudo -E docker compose build provision
          sudo -E docker compose up -d --wait postgres
          sudo -E docker compose run --rm -T provision php provision.php install < /dev/null
          sudo -E docker compose run --rm -T provision php provision.php verify < /dev/null > "$GITHUB_WORKSPACE/before.out"
      - name: Prove backup and isolated restore without interactive input
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          timeout --kill-after=5s 90s sudo -E /usr/local/sbin/imagine-portal-db-backup < /dev/null
          backup="$(sudo find /srv/imagine/backups/portal-db -maxdepth 2 -name COMPLETE -printf '%h\n')"
          test -n "$backup"
          test "$(sudo stat -c %a "$backup")" = 700
          test "$(sudo stat -c %a "$backup/database.dump")" = 600
          timeout --kill-after=5s 90s sudo -E /usr/local/sbin/imagine-portal-db-restore-probe "$backup" < /dev/null
          sudo cp -a "$backup" "$backup-corrupt"
          printf 'corrupt-fixture' | sudo tee -a "$backup-corrupt/database.dump" >/dev/null
          if sudo -E /usr/local/sbin/imagine-portal-db-restore-probe "$backup-corrupt" < /dev/null; then exit 1; fi
          sudo rm -rf -- "$backup-corrupt"
      - name: Refuse existing targets and populated source without deleting either
        shell: bash
        run: |
          set -euo pipefail
          cd /srv/imagine/portal-development/infra/development/portal-db
          pg() {
            sudo -E docker compose exec -T --interactive=false --user 82:82 postgres sh -ec 'export PGCONNECT_TIMEOUT=5 PGPASSWORD="$(cat /run/secrets/database-admin)"; exec "$@"' sh "$@"
          }
          sql() { pg psql -X -h 127.0.0.1 -U postgres -d portal_identity_dev -tA -v ON_ERROR_STOP=1 -c "$1"; }
          backup="$(sudo find /srv/imagine/backups/portal-db -maxdepth 2 -name COMPLETE -printf '%h\n')"
          test "$(sql "SELECT count(*) FROM pg_database WHERE datname='portal_identity_restore_probe'")" = 0
          pg createdb -h 127.0.0.1 -U postgres portal_identity_restore_probe
          if sudo -E /usr/local/sbin/imagine-portal-db-restore-probe "$backup" < /dev/null; then exit 1; fi
          test "$(sql "SELECT count(*) FROM pg_database WHERE datname='portal_identity_restore_probe'")" = 1
          pg dropdb -h 127.0.0.1 -U postgres portal_identity_restore_probe
          sql "INSERT INTO public.portal_identities(id,email_normalized) VALUES('11111111-1111-4111-8111-111111111111','restore-fixture@example.invalid')" >/dev/null
          if sudo -E /usr/local/sbin/imagine-portal-db-restore-probe "$backup" < /dev/null; then exit 1; fi
          test "$(sql 'SELECT count(*) FROM public.portal_identities')" = 1
          test "$(sql "SELECT count(*) FROM pg_database WHERE datname='portal_identity_restore_probe'")" = 0
          sql "DELETE FROM public.portal_identities WHERE id='11111111-1111-4111-8111-111111111111'" >/dev/null
          sudo -E docker compose run --rm -T provision php provision.php verify < /dev/null > "$GITHUB_WORKSPACE/after.out"
          cmp "$GITHUB_WORKSPACE/before.out" "$GITHUB_WORKSPACE/after.out"
          timeout --kill-after=5s 90s sudo -E /usr/local/sbin/imagine-portal-db-backup < /dev/null
          test "$(sudo find /srv/imagine/backups/portal-db -maxdepth 2 -name COMPLETE | wc -l)" -eq 2
      - name: Remove only disposable CI database and private fixture artifacts
        if: always()
        shell: bash
        run: |
          if test -d /srv/imagine/portal-development/infra/development/portal-db; then
            cd /srv/imagine/portal-development/infra/development/portal-db
            sudo -E docker compose down --volumes --remove-orphans
          fi
          sudo rm -rf -- /srv/imagine/portal-development /srv/imagine/backups/portal-db
