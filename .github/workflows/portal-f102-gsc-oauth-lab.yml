name: Portal GSC F102/F105/F107 — synthetic OAuth security contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# F224: keep latest validation per review PR or branch; older jobs are
# superseded by a newer SHA, preventing a large queue of stale candidates.
concurrency:
  group: portal-oauth-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  offline-oauth-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - name: Checkout read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
          extensions: sodium
      - name: Offline PKCE/state and tenant-binding contract
        run: php apps/portal/labs/gsc-f102/test_oauth_pkce.php
      - name: Offline token response scope and confidentiality contract
        run: php apps/portal/labs/gsc-f105/test_token_review.php
      - name: Offline encrypted PKCE verifier context and integrity
        run: php apps/portal/labs/gsc-f107/test_verifier_envelope.php
