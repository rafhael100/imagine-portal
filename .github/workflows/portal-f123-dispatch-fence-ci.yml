name: Portal F123 - Pre-send fence and no automatic retry after HTTP may begin
on:
  push:
    branches:
      - review/portal-f123-dispatch-fence-before-http-2026-11-10
  pull_request:
    paths:
      - 'apps/portal/labs/commercial-intake-f117/**'
      - 'apps/portal/labs/commercial-intake-f118/**'
      - 'apps/portal/labs/commercial-intake-f119/**'
      - 'apps/portal/labs/commercial-intake-f122/**'
      - 'apps/portal/labs/commercial-intake-f123/**'
      - '.github/workflows/portal-f123-dispatch-fence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-send-fence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f123-disposable-fixture-only
          POSTGRES_DB: portal_commercial_lab
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_commercial_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PORTAL_F118_PG_LAB: '1'
      PORTAL_F119_PG_LAB: '1'
      PORTAL_F122_GATE_LAB: '1'
      PORTAL_F123_DISPATCH_LAB: '1'
      DB_HOST: '127.0.0.1'
      DB_DATABASE: portal_commercial_lab
      DB_PASSWORD: f123-disposable-fixture-only
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo,pdo_pgsql
          coverage: none
          tools: none
      - name: Prevent CI-only delivery fence from entering Laravel runtime
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'commercial-intake-f123|begin_dispatch_lab_a|portal_f123_' \
            apps/portal/routes apps/portal/bootstrap apps/portal/app 2>/dev/null; then
            echo 'F123 synthetic delivery gate referenced in Laravel runtime' >&2
            exit 1
          fi
      - name: Exercise source PostgreSQL 18 state machine with PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/portal/labs/commercial-intake-f123/test_dispatch_fence_pg18.php
          php apps/portal/labs/commercial-intake-f117/test_commercial_metadata.php
          php apps/portal/labs/commercial-intake-f118/test_pg18_metadata_atomicity.php
          php apps/portal/labs/commercial-intake-f119/test_pg18_service_mac_nonce.php
          php apps/portal/labs/commercial-intake-f122/test_unknown_hold_pg18.php
          php apps/portal/labs/commercial-intake-f123/test_dispatch_fence_pg18.php
