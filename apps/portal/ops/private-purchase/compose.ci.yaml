services:
  application:
    environment:
      GITHUB_ACTIONS: 'true'
      PORTAL_PREVIEW_LOOPBACK_TEST: '1'
      APP_URL: http://127.0.0.1:18083
    volumes:
      - ./.private/performance-app-key:/run/secrets/f423-performance-key:ro
  # Entirely separate PHP process/container, no SQL credentials, no browser
  # session, no external Ads or PSP network. Uses pinned Performance #458.
  performance-lab:
    profiles: [on-demand]
    image: php:8.3-cli-alpine
    entrypoint: [php]
    user: '70:70'
    environment:
      GITHUB_ACTIONS: 'true'
      PORTAL_PREVIEW_LOOPBACK_TEST: '1'
    volumes:
      - ./f423-performance-lab-worker.php:/lab/worker.php:ro
      - ./f423-google-internal-draft-worker.php:/lab/draft-worker.php:ro
      - ./f423-google-monitoring-worker.php:/lab/monitor-worker.php:ro
      - ./f423-google-improvement-proposal-worker.php:/lab/proposal-worker.php:ro
      - ./f423-google-offline-application-worker.php:/lab/application-worker.php:ro
      - ./f423-mock-apply-worker.php:/lab/mock-apply-worker.php:ro
      - ./f423-mock-stage-worker.php:/lab/mock-stage-worker.php:ro
      - ./f423-google-only-readiness.php:/lab/f423-google-only-readiness.php:ro
      - ./.private/performance-worker-key:/run/secrets/f423-performance-key:ro
      - ../../../../perf-f423/tests/fixtures/SyntheticTwoChannelOrderReadiness.php:/lab/SyntheticTwoChannelOrderReadiness.php:ro
      - ../../../../perf-f423/src/Domain/Administration/AdministrativeAdsAccountMandateGate.php:/lab/AdministrativeAdsAccountMandateGate.php:ro
    networks: [private]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,nosuid,nodev,size=4m']
    restart: 'no'
    mem_limit: 64m
    cpus: 0.25

  # NOT an advertising provider: isolated and unexposed CI HTTP state machine.
  # Deliberately separate from the Portal PostgreSQL result/ledger.
  f423-mock-ads:
    profiles: [on-demand]
    image: php:8.3-cli-alpine
    entrypoint: [php, -S, '0.0.0.0:8099', /lab/f423-mock-ads-router.php]
    user: '70:70'
    environment:
      GITHUB_ACTIONS: 'true'
      PORTAL_PREVIEW_LOOPBACK_TEST: '1'
    volumes:
      - ./f423-mock-ads-router.php:/lab/f423-mock-ads-router.php:ro
      - ./.private/performance-worker-key:/run/secrets/f423-performance-key:ro
    networks: [private]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,nosuid,nodev,size=4m']
    restart: 'no'
    mem_limit: 64m
    cpus: 0.25

  # Dedicated ephemeral PAUSED handoff sink, never operational activation.
  f423-mock-stage:
    profiles: [on-demand]
    image: php:8.3-cli-alpine
    entrypoint: [php, -S, '0.0.0.0:8100', /lab/f423-mock-stage-router.php]
    user: '70:70'
    environment:
      GITHUB_ACTIONS: 'true'
      PORTAL_PREVIEW_LOOPBACK_TEST: '1'
    volumes:
      - ./f423-mock-stage-router.php:/lab/f423-mock-stage-router.php:ro
      - ./.private/performance-worker-key:/run/secrets/f423-performance-key:ro
    networks: [private]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,nosuid,nodev,size=4m']
    restart: 'no'
    mem_limit: 64m
    cpus: 0.25
