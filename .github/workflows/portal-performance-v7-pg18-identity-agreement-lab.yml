name: Portal V7 PG18 identity MFA services.manage and agreement approval lab

on:
  pull_request:
    paths:
      - 'apps/portal/labs/performance-v7-pg18/**'
      - 'apps/portal/app/Labs/PerformanceV7Pg18/**'
      - '.github/workflows/portal-performance-v7-pg18-identity-agreement-lab.yml'
      - 'docs/PORTAL-PERFORMANCE-V7-PG18-IDENTITY-AGREEMENT-NOGO-2026-11-14.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg18-v7-identity-agreement:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-f827-disposable-only
          POSTGRES_DB: portal_identity_lab
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_identity_lab"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      PORTAL_PERF_V7_PG18_IDENTITY_LAB: '1'
      PORTAL_PERF_V7_PLAN_AGREEMENT_LAB: '1'
      PORTAL_PERF_V7_AUTHORITY_PREFLIGHT_LAB: '1'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: portal_identity_lab
      DB_USERNAME: postgres
      DB_PASSWORD: ci-f827-disposable-only
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: portal_identity_lab
      PGUSER: postgres
      PGPASSWORD: ci-f827-disposable-only
      F66_PG_ADMIN_PASSWORD: ci-f827-disposable-only
      PORTAL_V7_PG_READER_PASSWORD: ci-f827-reader-only
      PORTAL_V7_PG_UNPRIV_PASSWORD: ci-f827-unpriv-only
      LOG_CHANNEL: stderr
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    defaults:
      run:
        shell: bash
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: pdo,pdo_pgsql,mbstring,dom,xml,curl,fileinfo,intl,bcmath,zip,sodium
      - name: Syntax and pinned Composer install
        run: |
          set -euo pipefail
          php -l app/Labs/PerformanceV7Pg18/PortalV7SqlAgreementAuthorityLab.php
          php -l app/Labs/PerformanceV7Pg18/PortalV7SqlGatedSignedPlanReviewLab.php
          php -l labs/performance-v7-pg18/test_portal_v7_pg18_identity_agreement.php
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
      - name: Migrate only F66 F76 F113 identity foundation in disposable PostgreSQL18
        run: |
          set -euo pipefail
          php artisan migrate --path=database/migrations/2026_11_09_000002_create_portal_identity_foundation.php --force --no-interaction
          php artisan migrate --path=database/migrations/2026_11_10_000004_add_org_revision_to_portal_sessions.php --force --no-interaction
          php artisan migrate --path=database/migrations/2026_11_10_000008_add_session_purpose_to_portal_auth_sessions.php --force --no-interaction
      - name: Set up separate SQL logins, read-only authority owner and closed F76 predicate
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE portal_f76_reader LOGIN PASSWORD 'ci-f76-unused-reader' NOSUPERUSER NOCREATEROLE NOCREATEDB NOINHERIT NOBYPASSRLS"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE portal_v7_lab_reader LOGIN PASSWORD 'ci-f827-reader-only' NOSUPERUSER NOCREATEROLE NOCREATEDB NOINHERIT NOBYPASSRLS"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE portal_v7_lab_unpriv LOGIN PASSWORD 'ci-f827-unpriv-only' NOSUPERUSER NOCREATEROLE NOCREATEDB NOINHERIT NOBYPASSRLS"
          psql -X -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE portal_identity_lab TO portal_f76_reader,portal_v7_lab_reader,portal_v7_lab_unpriv"
          psql -X -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO portal_f76_reader,portal_v7_lab_reader,portal_v7_lab_unpriv"
          psql -X -v ON_ERROR_STOP=1 -f labs/identity-f76/permission_gate.sql
          psql -X -v ON_ERROR_STOP=1 -f labs/performance-v7-pg18/portal_v7_agreement_preflight.sql
      - name: Verify latest Portal PG18 stored MFA identity role tenant and independent contract ownership
        run: php labs/performance-v7-pg18/test_portal_v7_pg18_identity_agreement.php
      - name: Keep prior F826 synthetic authority and Portal F419 V7 signer parity
        run: |
          php tools/test_performance_v7_authority_preflight_offline.php
          php tools/test_performance_v7_signed_plan_offline.php
      - name: Verify no source/worktree mutation and no deployment
        run: |
          git diff --exit-code -- composer.lock routes/ bootstrap/ .github/
          test "$(php artisan route:list --json | jq length)" -eq 1
          ! grep -R -E 'portal_v7_agreement_preflight_lab|PORTAL_PERF_V7_PG18_IDENTITY_LAB' routes/ bootstrap/ app/Providers/
