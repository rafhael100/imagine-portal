name: Portal isolated persistent private preview
on:
  pull_request:
    paths:
      - 'apps/portal/ops/private-purchase/**'
      - 'apps/portal/app/Homologation/**'
      - 'apps/portal/app/Http/Controllers/PurchaseRehearsalController.php'
      - 'apps/portal/app/Providers/PurchaseRehearsalServiceProvider.php'
      - 'apps/portal/app/Providers/FullPortalPreviewServiceProvider.php'
      - 'apps/portal/app/Http/Controllers/FullPortalPreviewController.php'
      - 'apps/portal/resources/views/portal/preview/**'
      - 'apps/portal/resources/views/portal/rehearsal/**'
      - 'apps/portal/tools/test_purchase_browser.py'
      - '.github/workflows/portal-private-purchase-preview.yml'
permissions:
  contents: read
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout exact read-only Performance #458 fixture (not official authority)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-performance-ai
          ref: 33f3e86cdf5d7378ed17f9877addc407fe41db17
          path: perf-f423
          persist-credentials: false
      - name: Check pinned Performance fixture HEAD and no external operations
        run: |
          test "$(git -C perf-f423 rev-parse HEAD)" = "33f3e86cdf5d7378ed17f9877addc407fe41db17"
          test -f perf-f423/tests/fixtures/SyntheticTwoChannelOrderReadiness.php
      - name: Build existing locked runtime from official base images
        run: docker build -f infra/development/portal-auth/Dockerfile -t imagine-portal-private-auth:local .
      - name: Build isolated purchase application before generating private files
        working-directory: apps/portal/ops/private-purchase
        run: docker compose build application
      - name: Start new disposable isolated database and loopback gateway
        working-directory: apps/portal/ops/private-purchase
        run: |
          sudo --preserve-env=GITHUB_ACTIONS python3 prepare.py
          docker compose -f compose.yaml -f compose.ci.yaml config --quiet
          docker compose -f compose.yaml -f compose.ci.yaml up -d --wait database
          # Abort before any additional schema migration unless the effective
          # Laravel bootstrap and actual SQL role/database attest disposable CI.
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T --no-deps \
            --entrypoint php application f423-approval-preflight.php
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < customer-schema.sql
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < customer-work-schema.sql
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < customer-offer-schema.sql
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < sandbox-payment-schema.sql
          # Reviewed synthetic buyer briefing record only; NOT Ads/financial authority.
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < f423-briefing-review-schema.sql
          # Second pre-DDL fence: effective Laravel + SQL PG18 must attest the
          # disposable destination AFTER the buyer review schema exists.
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T --no-deps \
            --entrypoint php application f423-performance-bridge-preflight.php
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < f423-performance-decisions-schema.sql
          # Distinct read-only effective Laravel/TCP SQL preflight BEFORE plan DDL.
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T --no-deps \
            --entrypoint php application f423-google-plan-preflight.php
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < f423-google-plan-schema.sql
          # Plan buyer approval is a distinct immutable ledger, gated by another
          # read-only actual Laravel and TCP SQL disposable PG18 preflight.
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T --no-deps \
            --entrypoint php application f423-google-plan-approval-preflight.php
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < f423-google-plan-approval-schema.sql
          # Strictly AFTER a fresh effective Laravel and TCP PG18 disposable
          # destination attestation, create ONLY an immutable internal draft.
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T --no-deps \
            --entrypoint php application f423-google-internal-draft-preflight.php
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < f423-google-internal-draft-schema.sql
          # Separate OFFLINE fixture sample table, only after effective
          # Laravel+SQL PG18 preflight attests the fresh disposable database.
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T --no-deps \
            --entrypoint php application f423-google-monitoring-preflight.php
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < f423-google-monitoring-schema.sql
          # Proposal only after effective Laravel + actual disposable SQL PG18
          # attestation. Never legal consent or provider authorization.
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T --no-deps \
            --entrypoint php application f423-google-improvement-proposal-preflight.php
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < f423-google-improvement-proposal-schema.sql
          # A SEPARATE approval ledger needs its own Laravel/PG18 disposable
          # preflight BEFORE DDL. No operation or consent is issued.
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T --no-deps \
            --entrypoint php application f423-google-improvement-approval-preflight.php
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < f423-google-improvement-approval-schema.sql
          # Final OFFLINE-only result ledger, only AFTER effective Laravel and
          # unprivileged TCP PG18 attest disposable database before DDL.
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T --no-deps \
            --entrypoint php application f423-google-offline-application-preflight.php
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < f423-google-offline-application-schema.sql
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < sandbox-future-schema.sql
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < sandbox-webhook-schema.sql
          # Webhook ingress proves a real non-privileged LOGIN over private
          # PostgreSQL TCP. No postgres/SET ROLE in the ingress process.
          docker compose run --rm -T --no-deps webhook-broker -X -q -tA \
            -v ON_ERROR_STOP=1 -h database -U purchase_rehearsal_hook \
            -d portal_purchase_rehearsal \
            -c 'SELECT current_user,rolsuper,rolbypassrls FROM pg_roles WHERE rolname=current_user' \
            | grep -Fx 'purchase_rehearsal_hook|f|f'
          if docker compose run --rm -T --no-deps webhook-broker -X -q -tA \
            -v ON_ERROR_STOP=1 -h database -U purchase_rehearsal_hook \
            -d portal_purchase_rehearsal \
            -c 'SELECT customer_id FROM purchase_rehearsal.customer_orders LIMIT 1' >/dev/null 2>&1; then
            echo 'CRITICAL: webhook ingress can read customer identity' >&2
            exit 1
          fi
          if docker compose run --rm -T --no-deps webhook-broker -X -q -tA \
            -v ON_ERROR_STOP=1 -h database -U purchase_rehearsal_hook \
            -d portal_purchase_rehearsal \
            -c 'SELECT count(*) FROM purchase_rehearsal.sandbox_payment_intents' >/dev/null 2>&1; then
            echo 'CRITICAL: webhook ingress can inspect payment-intent ledger' >&2
            exit 1
          fi
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < performance-settlement-schema.sql
          # Install all HMAC/FORCE RLS policies and independent broker roles
          # before Laravel or gateway receive their first request.
          docker compose run --rm -T --no-deps broker -X -q -tA \
            -v ON_ERROR_STOP=1 -h database -U purchase_rehearsal_psp \
            -d portal_purchase_rehearsal \
            -c 'SELECT current_user,rolsuper,rolbypassrls FROM pg_roles WHERE rolname=current_user' \
            | grep -Fx 'purchase_rehearsal_psp|f|f'
          docker compose -f compose.yaml -f compose.ci.yaml up -d application gateway
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  assert urllib.request.urlopen('http://127.0.0.1:18083/_rehearsal/purchase').status==200
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Private preview readiness failed')
          PY
          test "$(docker inspect imagine-purchase-preview-database-1 --format '{{len .HostConfig.PortBindings}}')" = 0
          test "$(docker inspect imagine-purchase-preview-application-1 --format '{{len .HostConfig.PortBindings}}')" = 0
          test "$(docker network inspect imagine-purchase-preview_private --format '{{.Internal}}')" = true
          test "$(docker inspect imagine-purchase-preview-gateway-1 --format '{{(index (index .HostConfig.PortBindings "8080/tcp") 0).HostIp}}')" = 127.0.0.1
      - name: Reject legacy shared synthetic checkout on VPS while retaining CI-only tests
        working-directory: apps/portal/ops/private-purchase
        run: |
          set -euo pipefail
          docker compose exec -T application php private-preview-route-gate.test.php
          echo 'PASS private route gate: CI legacy only, VPS customer/admin routes only' >> "$GITHUB_STEP_SUMMARY"
      - name: Compile and PHP-lint every Portal Blade page before browser tests
        working-directory: apps/portal/ops/private-purchase
        run: |
          docker compose exec -T application sh -ec '
            set -eu
            php artisan view:cache
            files=$(find storage/framework/views -type f -name "*.php")
            test -n "$files"
            for file in $files; do
              php -l "$file" >/dev/null || {
                echo "Invalid compiled Blade PHP in $file" >&2
                exit 1
              }
            done
            echo "PASS all compiled Blade templates PHP syntax"
          '
      - name: Approved commercial catalog and sandbox adapter checks
        working-directory: apps/portal/ops/private-purchase
        run: |
          docker compose exec -T application php tools/test_commerce.php
          docker compose exec -T application php tools/test_billing_schedule.php
          docker compose exec -T application php tools/test_performance_settlement.php
          python3 test_asaas_sandbox_worker.py
          python3 test_future_billing.py
          python3 test_sandbox_webhook.py
      - name: Real Chromium and persistent restart
        env:
          PURCHASE_PREVIEW_BASE: http://127.0.0.1:18083/_rehearsal/purchase
          PORTAL_OWNED_PREVIEW_SHOTS_DIR: ${{ runner.temp }}/portal-customer-review-shots
        run: |
          python3 -m venv /tmp/private-purchase-browser
          /tmp/private-purchase-browser/bin/pip install playwright==1.56.0
          /tmp/private-purchase-browser/bin/python apps/portal/tools/test_purchase_browser.py
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_full_portal.py
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_customer_flow.py
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_customer_work.py
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_commercial_quotes.py
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_sandbox_checkout.py
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_performance_settlement_flow.py
          # Run the new channel activation LAST to preserve existing account
          # and report-throttle tests. It respects Retry-After itself.
          # Distinct single-Google-only order, not a re-label of the
          # Google+Meta case. Actual registration/checkout, provider mock,
          # buyer briefing approval, SQL quote and HTTP readback. No new DDL.
          F423_GOOGLE_ONLY=1 /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_sandbox_performance_activation.py
          cd apps/portal/ops/private-purchase
          single=$(docker compose exec -T database psql -X -q -t -A -v ON_ERROR_STOP=1 \
            -U postgres -d portal_purchase_rehearsal -c \
            "SELECT b.customer_id||'|'||b.order_id FROM purchase_rehearsal.f423_briefing_reviews b
               JOIN purchase_rehearsal.customer_orders o ON o.id=b.order_id AND o.customer_id=b.customer_id
               WHERE (o.offer_snapshot::jsonb->'media_by_channel_cents') ? 'google_ads'
                 AND NOT ((o.offer_snapshot::jsonb->'media_by_channel_cents') ? 'meta_ads')
               ORDER BY b.approved_at DESC LIMIT 1")
          [[ "$single" =~ ^demo-[a-f0-9]{32}\|TEST-[a-f0-9]{32}$ ]] || exit 1
          single_owner=${single%%|*}; single_order=${single#*|}
          # Strict CI-only Google-selected policy adapter consumes the very
          # same buyer-approved Google-only order via authenticated S2S.
          # The Performance #458 two-channel fixture is left unchanged.
          # Separate disposable PHP containers prove SQL idempotence.
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T performance-lab /lab/worker.php "$single_owner" "$single_order"
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T performance-lab /lab/worker.php "$single_owner" "$single_order"
          single_rows=$(docker compose exec -T database psql -X -q -t -A -v ON_ERROR_STOP=1 \
             -U postgres -d portal_purchase_rehearsal -c \
             "SELECT count(*) FROM purchase_rehearsal.f423_performance_decisions
               WHERE customer_id='$single_owner' AND order_id='$single_order'
                 AND provider='google_ads' AND decision_state='internal_review_only'")
          test "$single_rows" = 1
          other_rows=$(docker compose exec -T database psql -X -q -t -A -v ON_ERROR_STOP=1 \
             -U postgres -d portal_purchase_rehearsal -c \
             "SELECT count(*) FROM purchase_rehearsal.f423_performance_decisions
               WHERE customer_id='$single_owner' AND order_id='$single_order'
                 AND provider<>'google_ads'")
          test "$other_rows" = 0
          echo 'PASS F423 GOOGLE-ONLY: exact buyer-approved SQL order consumed S2S, one Google-only internal-review decision stored, second process replay idempotent, no Meta or campaign draft' >> "$GITHUB_STEP_SUMMARY"
          cd ../../../..
          F423_GOOGLE_ONLY=1 /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_f423_performance_readback.py
          # Buyer has just approved the precise v1 plan in the real PG18
          # browser path. A DIFFERENT signed, stateless Performance PHP worker
          # may now create an UNPUBLISHED internal draft for that exact order.
          cd apps/portal/ops/private-purchase
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T performance-lab /lab/draft-worker.php "$single_owner" "$single_order"
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T performance-lab /lab/draft-worker.php "$single_owner" "$single_order"
          draft_rows=$(docker compose exec -T database psql -X -q -t -A -v ON_ERROR_STOP=1 \
            -U postgres -d portal_purchase_rehearsal -c \
            "SELECT count(*) FROM purchase_rehearsal.f423_google_internal_drafts
              WHERE customer_id='$single_owner' AND order_id='$single_order'
                AND provider='google_ads' AND draft_state='ci_internal_unpublished'")
          test "$draft_rows" = 1
          wrong_draft_rows=$(docker compose exec -T database psql -X -q -t -A -v ON_ERROR_STOP=1 \
            -U postgres -d portal_purchase_rehearsal -c \
            "SELECT count(*) FROM purchase_rehearsal.f423_google_internal_drafts
              WHERE customer_id<>'$single_owner' OR order_id<>'$single_order'
                OR provider<>'google_ads'")
          test "$wrong_draft_rows" = 0
          echo 'PASS F423 INTERNAL DRAFT: same Google-only order, approved plan, two signed PHP processes, exactly one UNPUBLISHED PG18 row, no Ads/provider/publication' >> "$GITHUB_STEP_SUMMARY"
          # Two dated metrics from an OFFLINE provider fixture, NOT a Google API.
          # Same confirmed buyer/plan/draft; two independent PHP containers
          # re-send, SQL must retain exactly two immutable rows.
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T performance-lab /lab/monitor-worker.php "$single_owner" "$single_order"
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T performance-lab /lab/monitor-worker.php "$single_owner" "$single_order"
          monitoring_rows=$(docker compose exec -T database psql -X -q -t -A -v ON_ERROR_STOP=1 \
            -U postgres -d portal_purchase_rehearsal -c \
            "SELECT count(*) FROM purchase_rehearsal.f423_google_monitoring_samples
               WHERE customer_id='$single_owner' AND order_id='$single_order'
                 AND provider='google_ads' AND source='ci_offline_google_ads_provider_fixture'")
          test "$monitoring_rows" = 2
          unrelated_monitoring=$(docker compose exec -T database psql -X -q -t -A -v ON_ERROR_STOP=1 \
            -U postgres -d portal_purchase_rehearsal -c \
            "SELECT count(*) FROM purchase_rehearsal.f423_google_monitoring_samples
               WHERE customer_id<>'$single_owner' OR order_id<>'$single_order'
                 OR provider<>'google_ads'")
          test "$unrelated_monitoring" = 0
          echo 'PASS F423 OFFLINE MONITOR: same Google draft, 2 dated fixture-only samples, independent process replay, exact SQL RLS, no Ads API or revenue claim' >> "$GITHUB_STEP_SUMMARY"
          # Same exact buyer order/draft/revision, two immutable OFFLINE metrics:
          # one UNAPPROVED versioned improvement proposal, no operational effect.
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T performance-lab /lab/proposal-worker.php "$single_owner" "$single_order"
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T performance-lab /lab/proposal-worker.php "$single_owner" "$single_order"
          proposal_rows=$(docker compose exec -T database psql -X -q -t -A -v ON_ERROR_STOP=1 \
            -U postgres -d portal_purchase_rehearsal -c \
            "SELECT count(*) FROM purchase_rehearsal.f423_google_offline_improvements
               WHERE customer_id='$single_owner' AND order_id='$single_order'
                 AND provider='google_ads' AND proposal_state='awaiting_separate_approval'")
          test "$proposal_rows" = 1
          wrong_proposal_rows=$(docker compose exec -T database psql -X -q -t -A -v ON_ERROR_STOP=1 \
            -U postgres -d portal_purchase_rehearsal -c \
            "SELECT count(*) FROM purchase_rehearsal.f423_google_offline_improvements
               WHERE customer_id<>'$single_owner' OR order_id<>'$single_order'
                 OR provider<>'google_ads'")
          test "$wrong_proposal_rows" = 0
          echo 'PASS F423 IMPROVEMENT PROPOSAL: same draft and 2 offline samples, 1 versioned awaiting-approval PG18 row, no Ads action' >> "$GITHUB_STEP_SUMMARY"
          cd ../../../..
          # Extra negative gate: BEFORE buyer approval, require the actual
          # same-order authenticated S2S snapshot to say not approved.
          # This cannot pass due to a failed HTTP read or a missing fixture.
          cd apps/portal/ops/private-purchase
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T performance-lab /lab/mock-apply-worker.php "$single_owner" "$single_order" --expect-no-approval
          cd ../../../..
          # The buyer sees the exact recommendation in Chromium and explicitly
          # approves it on a separate route, with a new immutable PG18 event.
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_f423_improvement_approval.py
          echo 'PASS F423 IMPROVEMENT APPROVAL: same buyer, exact proposal fingerprint, 1 SQL event, no application' >> "$GITHUB_STEP_SUMMARY"
          cd apps/portal/ops/private-purchase
          # Only after the browser's explicit separate approval, two distinct
          # sandbox workers persist ONE OFFLINE comparison; no real Ads network.
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T performance-lab /lab/application-worker.php "$single_owner" "$single_order"
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T performance-lab /lab/application-worker.php "$single_owner" "$single_order"
          offline_rows=$(docker compose exec -T database psql -X -q -t -A -v ON_ERROR_STOP=1 \
            -U postgres -d portal_purchase_rehearsal -c \
            "SELECT count(*) FROM purchase_rehearsal.f423_google_offline_applied_results
              WHERE customer_id='$single_owner' AND order_id='$single_order'
                AND provider='google_ads' AND application_state='ci_offline_fixture_applied'")
          test "$offline_rows" = 1
          wrong_offline_rows=$(docker compose exec -T database psql -X -q -t -A -v ON_ERROR_STOP=1 \
            -U postgres -d portal_purchase_rehearsal -c \
            "SELECT count(*) FROM purchase_rehearsal.f423_google_offline_applied_results
              WHERE customer_id<>'$single_owner' OR order_id<>'$single_order'
                OR provider<>'google_ads'")
          test "$wrong_offline_rows" = 0
          echo 'PASS F423 OFFLINE APPLICATION: same approved Google-only proposal, 1 PG18 result, 2 processes replay, no real Ads' >> "$GITHUB_STEP_SUMMARY"
          # Exercise the proposal action in an ISOLATED HTTP FAKE provider, not
          # merely in the Portal's result ledger. Only private CI Docker network,
          # no published ports, no account/credential or provider integration.
          docker compose -f compose.yaml -f compose.ci.yaml up -d f423-mock-ads
          test "$(docker inspect imagine-purchase-preview-f423-mock-ads-1 --format '{{len .HostConfig.PortBindings}}')" = 0
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T performance-lab /lab/mock-apply-worker.php "$single_owner" "$single_order"
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T performance-lab /lab/mock-apply-worker.php "$single_owner" "$single_order"
          docker compose -f compose.yaml -f compose.ci.yaml stop f423-mock-ads
          echo 'PASS F423 MOCK PROVIDER: 1 action applied in private CI-only HTTP simulator, 2 independent PHP workers, strict negative cases, 0 Ads calls' >> "$GITHUB_STEP_SUMMARY"
          cd ../../../..
          cd apps/portal/ops/private-purchase
          cd ../../../..
          # Preserve existing distinct two-channel S2S/SQL/browser/restart
          # regression on its own later, buyer-approved order.
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_sandbox_performance_activation.py
          # The buyer actually approved the briefing in PG18. Fetch its exact
          # synthetic owner/order from SQL; never mint an independent signal.
          cd apps/portal/ops/private-purchase
          row=$(docker compose exec -T database psql -X -q -t -A -v ON_ERROR_STOP=1 \
            -U postgres -d portal_purchase_rehearsal -c \
            "SELECT customer_id||'|'||order_id FROM purchase_rehearsal.f423_briefing_reviews ORDER BY approved_at DESC LIMIT 1")
          [[ "$row" =~ ^demo-[a-f0-9]{32}\|TEST-[a-f0-9]{32}$ ]] || exit 1
          owner=${row%%|*}; order=${row#*|}
          # Two genuinely separate Performance PHP workers: SQL INSERT must be
          # durable/idempotent and isolated from the worker (no DB credentials).
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T performance-lab /lab/worker.php "$owner" "$order"
          docker compose -f compose.yaml -f compose.ci.yaml run --rm -T performance-lab /lab/worker.php "$owner" "$order"
          rows=$(docker compose exec -T database psql -X -q -t -A -v ON_ERROR_STOP=1 \
             -U postgres -d portal_purchase_rehearsal -c \
             "SELECT count(*) FROM purchase_rehearsal.f423_performance_decisions WHERE customer_id='$owner' AND order_id='$order'")
          test "$rows" = 2
          cd ../../../..
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_f423_performance_readback.py
          cd apps/portal/ops/private-purchase
          # Prove the shared application SQL login cannot enumerate another
          # customer's identity, orders, events, invoices or financial reports.
          for sql in test_customer_scope.sql test_customer_work_scope.sql test_sandbox_scope.sql test_signed_financial_scope.sql; do
            docker compose exec -T database psql -X -v ON_ERROR_STOP=1 \
              -U postgres -d portal_purchase_rehearsal < "$sql"
          done
          docker compose exec -T database psql -U postgres -d portal_purchase_rehearsal -Atc 'SELECT count(*) FROM purchase_rehearsal.orders' > /tmp/purchase-count-before
          docker compose restart database application
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  assert urllib.request.urlopen('http://127.0.0.1:18083/_rehearsal/purchase').status==200
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Private preview restart failed')
          PY
          docker compose exec -T database psql -U postgres -d portal_purchase_rehearsal -Atc 'SELECT count(*) FROM purchase_rehearsal.orders' > /tmp/purchase-count-after
          cmp /tmp/purchase-count-before /tmp/purchase-count-after
          cd ../../../..
          F423_RESTARTED=1 /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_f423_performance_readback.py
          F423_GOOGLE_ONLY=1 F423_RESTARTED=1 /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_f423_performance_readback.py
          cd apps/portal/ops/private-purchase
      - name: Verify client and admin can reopen persisted orders after PostgreSQL restart
