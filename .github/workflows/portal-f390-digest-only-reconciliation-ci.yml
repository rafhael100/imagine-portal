name: Portal F390 - Digest-only Worker intent and real PG18 reconciliation (NO SERVING)
on:
  pull_request:
    paths:
      - 'infra/development/portal-recovery/f390-*
      - 'apps/portal/app/Infrastructure/Identity/PostgresPortalBrowserAuthentication.php'
      - 'apps/portal/app/Infrastructure/Recovery/PortalHashedSessionRevocationCandidate.php'
      - 'apps/portal/app/Infrastructure/Recovery/SignedRevocationDigestPgReconcileCandidate.php''
      - '.github/workflows/portal-f390-worker-pg18-ci.yml'
permissions:
  contents: read
jobs:
  actual-worker-to-pg18-with-signed-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    env:
      PORTAL_F390_CI: DISPOSABLE_ONLY
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare disposable PostgreSQL18 and identity foundation only
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo python3 infra/development/portal-db/prepare-secrets.py "$GITHUB_WORKSPACE/infra/development/portal-db/.private"
          sudo docker compose -p imagine-portal-f390-ci -f infra/development/portal-db/compose.yaml build provision
          sudo docker compose -p imagine-portal-f390-ci -f infra/development/portal-db/compose.yaml up -d --wait postgres
          sudo docker compose -p imagine-portal-f390-ci -f infra/development/portal-db/compose.yaml run --rm -T --interactive=false provision php provision.php install
      - name: Prove no raw session reference survives into Worker or PG18 retry
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$PORTAL_F390_CI" = DISPOSABLE_ONLY
          scratch="$(mktemp -d)"
          sudo chown 82:82 "$scratch"
          sudo chmod 700 "$scratch"
          trap 'sudo rm -rf -- "$scratch"' EXIT
          tool(){
            sudo docker compose -p imagine-portal-f390-ci -f infra/development/portal-db/compose.yaml \
              run --rm -T --interactive=false \
              -e GITHUB_ACTIONS=true -e RUNNER_ENVIRONMENT=github-hosted \
              -e PORTAL_ENROLLMENT_CI=DISPOSABLE_ONLY \
              -e PORTAL_RESTORE_QUARANTINE_CI=DISPOSABLE_ONLY \
              -e PORTAL_F390_CI=DISPOSABLE_ONLY \
              -v "$GITHUB_WORKSPACE/infra/development/portal-enrollment:/opt/portal-enrollment:ro" \
              -v "$GITHUB_WORKSPACE/infra/development/portal-mail:/opt/portal-mail:ro" \
              -v "$GITHUB_WORKSPACE/infra/development/portal-activation:/opt/portal-activation:ro" \
              -v "$GITHUB_WORKSPACE/infra/development/portal-recovery:/opt/portal-recovery:ro" \
              -v "$scratch:/opt/f390:rw" provision "$@"
          }
          tool php -l /opt/portal-recovery/f390-seed-hash-only-pg18.php
          tool php -l /opt/portal-recovery/test-f390-worker-to-pg18-digest-only.php
          if tool php /opt/portal-recovery/f390-seed-real-pg.php bad-args; then
            echo 'F390 seed must refuse command arguments'
            exit 1
          fi
          tool php /opt/portal-recovery/f390-seed-real-pg.php
          sudo test -s "$scratch/seed.json"

          # A separate, networkless Node process runs the ACTUAL F376/F386/F387
          # Worker module in SQLite. The 256-bit PG session reference never
          # enters the host process, command line, logs or public network.
          sudo docker run --rm --network none --user 82:82 \
            --memory 320m --cpus 1 \
            -e GITHUB_ACTIONS=true -e RUNNER_ENVIRONMENT=github-hosted \
            -e PORTAL_F390_CI=DISPOSABLE_ONLY \
            -v "$GITHUB_WORKSPACE/infra/development/portal-recovery:/repo/infra/development/portal-recovery:ro" \
            -v "$scratch:/opt/f390:rw" \
            node:24-alpine node \
            /repo/infra/development/portal-recovery/f390-worker-digest-intent.mjs /opt/f390
          sudo test -s "$scratch/receipt.json"
          sudo test -s "$scratch/expected.json"
          sudo test -s "$scratch/public.json"
          tool php /opt/portal-recovery/test-f390-worker-to-pg18.php
          if grep -R -E 'SignedRevocationIntentPgReconcileCandidate|SignedRevocationIntentReadbackCandidateVerifier' \
              apps/portal/routes apps/portal/bootstrap apps/portal/app/Providers; then
            echo 'F390 candidates MUST NOT be exposed on Laravel HTTP'
            exit 1
          fi
      - name: Destroy only F390 disposable cluster and all volumes
        if: always()
        run: |
          test "$GITHUB_ACTIONS" = true
          sudo docker compose -p imagine-portal-f390-ci -f infra/development/portal-db/compose.yaml down --volumes --remove-orphans
