# Explicit optional overlay, only after Access approval; not needed to render/start the base.
services:
  access-connector:
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: 'no'
    logging: {driver: json-file, options: {max-size: 5m, max-file: '3'}}
    image: '${P6_CLOUDFLARED_IMAGE:?reviewed immutable connector required if enabled}'
    user: '65532:65532'
    command: ['tunnel','--no-autoupdate','--config','/run/access/config.yml','run']
    volumes: ['${P6_ACCESS_DIR:?approved access config and own credentials required}:/run/access:ro']
    tmpfs: ['/tmp:mode=1777']
    networks: [ingress, portal_front]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
