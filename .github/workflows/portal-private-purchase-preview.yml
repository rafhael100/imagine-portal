name: Portal isolated persistent private preview
on:
  pull_request:
    paths:
      - 'apps/portal/ops/private-purchase/**'
      - 'apps/portal/app/Homologation/**'
      - 'apps/portal/app/Domain/SitesIntegration/**'
      - 'apps/portal/ops/psp/**'
      - 'docs/PORTAL-P0-ASAAS-CHECKOUT-COMBINED-REVIEW.md'
      - 'apps/portal/app/Http/Controllers/PurchaseRehearsalController.php'
      - 'apps/portal/app/Providers/PurchaseRehearsalServiceProvider.php'
      - 'apps/portal/app/Providers/FullPortalPreviewServiceProvider.php'
      - 'apps/portal/app/Http/Controllers/FullPortalPreviewController.php'
      - 'apps/portal/resources/views/portal/preview/**'
      - 'apps/portal/resources/views/portal/rehearsal/**'
      - 'apps/portal/tools/test_purchase_browser.py'
      - '.github/workflows/portal-private-purchase-preview.yml'
permissions:
  contents: read
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify signed SQL schema and offline VPS preflight on disposable CI
        run: |
          set -euo pipefail
          bash apps/portal/ops/private-purchase/check_customer_schema_ci.sh
          python3 apps/portal/ops/private-purchase/preflight_private_runtime.py --self-test
      - name: Build existing locked runtime from official base images
        run: docker build -f infra/development/portal-auth/Dockerfile -t imagine-portal-private-auth:local .
      - name: Build isolated purchase application before generating private files
        working-directory: apps/portal/ops/private-purchase
        run: docker compose build application
      - name: Start new disposable isolated database and loopback gateway
        working-directory: apps/portal/ops/private-purchase
        run: |
          sudo --preserve-env=GITHUB_ACTIONS python3 prepare.py
          docker compose -f compose.yaml -f compose.ci.yaml config --quiet
          docker compose -f compose.yaml -f compose.ci.yaml up -d --wait database
          # Signed customer policy must exist BEFORE Laravel's fail-closed
          # constructor initializes on the first readiness request.
          docker compose exec -T database psql -X -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < customer-schema.sql
          docker compose exec -T database psql -X -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < customer-work-schema.sql
          docker compose exec -T database psql -X -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < customer-offer-schema.sql
          docker compose exec -T database psql -X -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < sandbox-payment-schema.sql
          # Exercise the real broker SQL login with a private SCRAM credential,
          # not postgres followed by SET ROLE, before opening the web gateway.
          docker compose run --rm -T --no-deps broker -X -q -tA -v ON_ERROR_STOP=1 \
            -h database -U purchase_rehearsal_psp -d portal_purchase_rehearsal \
            -c 'SELECT current_user,rolsuper,rolbypassrls FROM pg_roles WHERE rolname=current_user' \
            | grep -Fx 'purchase_rehearsal_psp|f|f'
          docker compose run --rm -T --no-deps broker -X -q -tA -v ON_ERROR_STOP=1 \
            -h database -U purchase_rehearsal_psp -d portal_purchase_rehearsal \
            -c 'SELECT count(*) FROM purchase_rehearsal.sandbox_payment_intents'

          docker compose -f compose.yaml -f compose.ci.yaml up -d application gateway
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  assert urllib.request.urlopen('http://127.0.0.1:18083/_rehearsal/purchase').status==200
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Private preview readiness failed')
          PY
          test "$(docker inspect imagine-purchase-preview-database-1 --format '{{len .HostConfig.PortBindings}}')" = 0
          test "$(docker inspect imagine-purchase-preview-application-1 --format '{{len .HostConfig.PortBindings}}')" = 0
          test "$(docker network inspect imagine-purchase-preview_private --format '{{.Internal}}')" = true
          test "$(docker inspect imagine-purchase-preview-gateway-1 --format '{{(index (index .HostConfig.PortBindings "8080/tcp") 0).HostIp}}')" = 127.0.0.1
      - name: Verify shared checkout CI-only boundary and deny traversal on VPS
        working-directory: apps/portal/ops/private-purchase
        run: |
          set -euo pipefail
          docker compose exec -T application php private-preview-route-gate.test.php
          # Broker psql runs with its own password on an internal Docker network.
          docker compose run --rm -T --no-deps broker -X -q -tA -v ON_ERROR_STOP=1 \
            -h database -U purchase_rehearsal_psp -d portal_purchase_rehearsal \
            -c 'SELECT count(*) FROM purchase_rehearsal.sandbox_payment_intents' >/dev/null
          echo 'PASS CI-only shared checkout and private VPS customer/admin route allowlist' >> "$GITHUB_STEP_SUMMARY"
      - name: Compile and PHP-lint every Portal Blade page before browser tests
        working-directory: apps/portal/ops/private-purchase
        run: |
          docker compose exec -T application sh -ec '
            set -eu
            php artisan view:cache
            files=$(find storage/framework/views -type f -name "*.php")
            test -n "$files"
            for file in $files; do
              php -l "$file" >/dev/null || {
                echo "Invalid compiled Blade PHP in $file" >&2
                exit 1
              }
            done
            echo "PASS all compiled Blade templates PHP syntax"
          '
      - name: Approved commercial catalog and sandbox adapter checks
        working-directory: apps/portal/ops/private-purchase
        run: |
          docker compose exec -T application php tools/test_commerce.php
          python3 test_asaas_sandbox_worker.py
      - name: Real Chromium and persistent restart
        env:
          PURCHASE_PREVIEW_BASE: http://127.0.0.1:18083/_rehearsal/purchase
          PORTAL_OWNED_PREVIEW_SHOTS_DIR: ${{ runner.temp }}/portal-customer-review-shots
        run: |
          python3 -m venv /tmp/private-purchase-browser
          /tmp/private-purchase-browser/bin/pip install playwright==1.56.0
          /tmp/private-purchase-browser/bin/python apps/portal/tools/test_purchase_browser.py
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_full_portal.py
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_customer_flow.py
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_customer_work.py
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_sandbox_checkout.py
          # All browser suites reuse the SAME disposable CI identity by design.
          # Reset only the ephemeral test cache that carries rate-limit counters,
          # not server sessions, DB, security policies or real application quotas.
          (cd apps/portal/ops/private-purchase && docker compose exec -T application sh -ec 'find storage/framework/cache/data -type f -delete')
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_commercial_quotes.py
          cd apps/portal/ops/private-purchase
          docker compose exec -T database psql -U postgres -d portal_purchase_rehearsal -Atc 'SELECT count(*) FROM purchase_rehearsal.orders' > /tmp/purchase-count-before
          docker compose restart database application
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  assert urllib.request.urlopen('http://127.0.0.1:18083/_rehearsal/purchase').status==200
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Private preview restart failed')
          PY
          docker compose exec -T database psql -U postgres -d portal_purchase_rehearsal -Atc 'SELECT count(*) FROM purchase_rehearsal.orders' > /tmp/purchase-count-after
          cmp /tmp/purchase-count-before /tmp/purchase-count-after
      - name: Deny raw SQL enumeration and forged admin/customer claims under signed FORCE RLS
        working-directory: apps/portal/ops/private-purchase
        run: |
          set -euo pipefail
          docker compose exec -T database psql -X -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < test_customer_scope.sql
          docker compose exec -T database psql -X -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < test_customer_work_scope.sql
          docker compose exec -T database psql -X -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < test_sandbox_scope.sql
          echo 'PASS signed owner and admin claims protect orders, identities and delivery events at SQL layer' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify client and admin can reopen persisted orders after PostgreSQL restart
        env:
          PURCHASE_PREVIEW_BASE: http://127.0.0.1:18083/_rehearsal/purchase
        run: |
          set -euo pipefail
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_full_portal.py
          CUSTOMER_REOPEN=1 /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_customer_flow.py
          CUSTOMER_WORK_REOPEN=1 /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_customer_work.py
          echo 'PASS preview reload after database/app restart, synthetic clients only'
      - name: Restore NEW synthetic PG18 database and verify signed client policies and offers
        working-directory: apps/portal/ops/private-purchase
        env:
          P0_PG_RESTORE_CI: '1'
        run: |
          set -euo pipefail
          bash ./verify_pg_restore_ci.sh
          echo 'PASS real disposable PG18 streamed backup/restore and signed RLS; Leaseweb remains NO-GO' >> "$GITHUB_STEP_SUMMARY"
      - name: Audit five individual-customer screenshots and SHA256
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'portal-customer-review-shots'
          manifest=json.loads((folder/'manifest.json').read_text())
          expected=[
            '01-registration-blank.png','02-selected-onepage-offer.png',
            '03-owned-purchase-complete.png','04-customer-service-list.png',
            '05-admin-owned-order.png',
          ]
          assert manifest['no_real_customer_data'] is True
          assert manifest['no_public_deploy'] is True
          assert manifest['credentials_captured'] is False
          assert [item['name'] for item in manifest['files']]==expected
          assert {p.name for p in folder.iterdir()}==set(expected+['manifest.json'])
          for item in manifest['files']:
              data=(folder/item['name']).read_bytes()
              assert data[:8]==bytes.fromhex('89504e470d0a1a0a')
              assert len(data)>2048
              assert hashlib.sha256(data).hexdigest()==item['sha256']
          print('PASS 5 synthetic customer/admin screenshots with SHA256 checks')
          PY
      - name: Preserve synthetic individual-customer flow screenshots (7 days)
        uses: actions/upload-artifact@v5
        with:
          name: imagine-portal-individual-customer-flow
          path: ${{ runner.temp }}/portal-customer-review-shots/
          if-no-files-found: error
          retention-days: 7
      - name: Diagnose failed synthetic browser flow
        if: failure()
        working-directory: apps/portal/ops/private-purchase
        run: docker compose logs --tail 100 application gateway
      - name: Stop only disposable CI stack
        if: always()
        working-directory: apps/portal/ops/private-purchase
        run: docker compose down --volumes
