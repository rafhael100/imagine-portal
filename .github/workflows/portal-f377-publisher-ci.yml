name: Portal F377 - Real pinned HTTPS publisher to witness Worker (NO SERVING)
on:
  pull_request:
    paths:
      - 'apps/portal/app/Infrastructure/Recovery/PinnedHttpsWitnessPublisherCandidate.php'
      - 'infra/development/portal-recovery/f376-worker/test/f377-https-worker-fixture.mjs'
      - 'infra/development/portal-recovery/f376-worker/test/test-f377-publisher.php'
      - '.github/workflows/portal-f377-publisher-ci.yml'
permissions:
  contents: read
jobs:
  independent-hmac-publisher-and-ed25519-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    env:
      PORTAL_F377_CI: DISPOSABLE_ONLY
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium,curl
          tools: none
          coverage: none
      - name: Actual local HTTPS between PHP HMAC publisher and Worker + SQLite
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$PORTAL_F377_CI" = DISPOSABLE_ONLY
          node --check infra/development/portal-recovery/f376-worker/test/f377-https-worker-fixture.mjs
          php -l apps/portal/app/Infrastructure/Recovery/PinnedHttpsWitnessPublisherCandidate.php
          php -l infra/development/portal-recovery/f376-worker/test/test-f377-publisher.php
          scratch="$(mktemp -d)"
          chmod 700 "$scratch"
          fixture_pid=''
          cleanup() {
            if [[ -n "$fixture_pid" ]]; then
              kill "$fixture_pid" 2>/dev/null || true
              wait "$fixture_pid" 2>/dev/null || true
            fi
            rm -rf -- "$scratch"
          }
          trap cleanup EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=witness.f377.test.invalid' \
            -addext 'subjectAltName=DNS:witness.f377.test.invalid' \
            -keyout "$scratch/leaf.key" -out "$scratch/leaf.crt" >/dev/null 2>&1
          chmod 600 "$scratch/leaf.key" "$scratch/leaf.crt"
          pin="sha256//$(openssl x509 -in "$scratch/leaf.crt" -noout -pubkey |
            openssl pkey -pubin -outform DER |
            openssl dgst -sha256 -binary | openssl base64 -A)"
          test "${#pin}" -eq 52
          node infra/development/portal-recovery/f376-worker/test/f377-https-worker-fixture.mjs \
            "$scratch" "$scratch/leaf.crt" "$scratch/leaf.key" > "$scratch/fixture.log" 2>&1 &
          fixture_pid=$!
          ready=0
          for i in $(seq 1 40); do
            if curl --silent --show-error --fail --max-time 2 \
                --noproxy '*' --cacert "$scratch/leaf.crt" \
                --resolve witness.f377.test.invalid:18444:127.0.0.1 \
                --pinnedpubkey "$pin" \
                'https://witness.f377.test.invalid:18444/v1/portal/recovery-witness' \
                -o /dev/null 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" = 1
          php infra/development/portal-recovery/f376-worker/test/test-f377-publisher.php \
            "$scratch" "$pin" "$scratch/leaf.crt"
