name: Portal AUTH-PERF-08 - PostgreSQL authority-shaped sessions, memberships and service revocation

on:
  push:
    branches:
      - feat/portal-auth-perf-08-pg-authority-lab-2026-11-09

permissions:
  contents: read

concurrency:
  group: portal-f08-synthetic-pg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg-authority-only:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-f08-db-only
          POSTGRES_DB: portal_perf_auth_lab
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_perf_auth_lab"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      PORTAL_PERF_PG_AUTH_LAB: '1'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: portal_perf_auth_lab
      DB_USERNAME: postgres
      DB_PASSWORD: ci-f08-db-only
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: portal_perf_auth_lab
      PGUSER: postgres
      PGPASSWORD: ci-f08-db-only
      LOG_CHANNEL: stderr
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
    steps:
      - name: Checkout only test authority branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install PHP 8.4 / locked Composer, no scripts/plugins
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: pdo,pdo_pgsql,mbstring,dom,xml,curl,fileinfo,intl,bcmath,zip,sodium
      - name: Syntax, isolated DB and no operational route wiring
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/portal/database/migrations/2026_11_09_000001_create_portal_perf_authority_lab.php
          php -l apps/portal/app/Domain/PerformanceBridge/PortalPerfAuthorityFacts.php
          php -l apps/portal/app/Domain/PerformanceBridge/PortalPerfSqlAuthorityResolver.php
          php -l apps/portal/preview/tests/test_pg_perf_authority.php
          pg_isready -h 127.0.0.1 -p 5432 -U postgres -d portal_perf_auth_lab
          if grep -R -E 'PortalPerfSqlAuthorityResolver|PORTAL_PERF_PG_AUTH_LAB' apps/portal/routes/ apps/portal/app/Providers/ apps/portal/bootstrap/; then
            echo 'FAIL: untrusted authority fixture wired into production entrypoint'
            exit 1
          fi
      - name: Install only locked Portal PHP dependencies and migrate disposable PG
        shell: bash
        run: |
          set -euo pipefail
          cd apps/portal
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          composer dump-autoload --no-interaction --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          test "$DB_DATABASE" = portal_perf_auth_lab
          php artisan migrate --force --no-interaction
          cd ../..
          git diff --exit-code -- apps/portal/composer.lock
      - name: Create only one read-only Portal authority role
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "CREATE ROLE portal_f08_reader LOGIN PASSWORD 'ci-f08-read-only' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "GRANT CONNECT ON DATABASE portal_perf_auth_lab TO portal_f08_reader"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "GRANT USAGE ON SCHEMA public TO portal_f08_reader"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "GRANT SELECT ON portal_perf_authority_sessions,portal_perf_authority_memberships,portal_perf_authority_services TO portal_f08_reader"
      - name: Verify 60 revocation and tenant isolation cases on real PG16
        shell: bash
        run: |
          set -euo pipefail
          php apps/portal/preview/tests/test_pg_perf_authority.php
          echo 'PASS Portal authority queries use server-side session hash, not client org claims'
      - name: Preserve non-operational auth routes and Ed25519 signer regression
        shell: bash
        env:
          PORTAL_PERF_SIGNED_LAB: '1'
        run: |
          set -euo pipefail
          cd apps/portal
          ./vendor/bin/phpunit tests/Feature/PortalAuthenticationRoutesClosedTest.php
          ./vendor/bin/phpunit tests/Feature/SyntheticCapabilityIssuerTest.php
          cd ../..
          git diff --exit-code -- apps/portal/bootstrap/ apps/portal/routes/ apps/portal/app/Providers/ apps/portal/composer.lock
