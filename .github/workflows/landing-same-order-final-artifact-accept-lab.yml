name: Portal Landing exact final preview buyer click (synthetic NO-GO)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['test/portal-landing-render-sites-same-order-2026-11-21-r23']
    paths:
      - '.github/workflows/landing-same-order-final-artifact-accept-lab.yml'
      - 'apps/portal/labs/landing-contract-click/**'
permissions:
  contents: read
concurrency:
  group: landing-final-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  landing-final-exact-html:
    if: >-
      github.repository == 'rafhael100/imagine-portal' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/portal-landing-final-accept-same-artifact-2026-11-21-r24' &&
      github.event.pull_request.base.ref == 'test/portal-landing-render-sites-same-order-2026-11-21-r23' &&
      github.event.pull_request.base.sha == 'cf7dd729e2cc5282be4fef7bf06cb2dfdea0ba50'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      pg18:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      APP_ENV: testing
      LANDING_EXACT_CLICK_LAB: '1'
      LANDING_PREVIEW_GET_LAB: '1'
      LANDING_SITES_RENDER_LAB: '1'
      LANDING_FINAL_ACCEPT_LAB: '1'
    steps:
      - name: Checkout Portal exact PR HEAD without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout immutable public Sites production renderer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-sites
          ref: 8172e5cc14e97951e529c843059c214e05c33db5
          path: sites-snapshot
          sparse-checkout: |
            src/Production
          persist-credentials: false
      - name: Verify both exact SHAs, file syntax and test-only guards
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C sites-snapshot rev-parse HEAD)" = '8172e5cc14e97951e529c843059c214e05c33db5'
          test -f sites-snapshot/src/Production/StaticSiteRenderer.php
          test -f sites-snapshot/src/Production/StructuredCopyCandidate.php
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring
          coverage: none
      - name: Check PHP 8.4 and Python 3
        run: |
          set -euo pipefail
          php -l apps/portal/labs/landing-contract-click/final_preview_acceptance_lab.php
          php -l apps/portal/labs/landing-contract-click/sites_renderer_same_order_lab.php
          php -m | grep -x pdo_pgsql
          python3 -m py_compile apps/portal/labs/landing-contract-click/final_preview_acceptance_browser.py
      - name: Install isolated browser tooling (test only)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/landing-final-venv"
          source "$RUNNER_TEMP/landing-final-venv/bin/activate"
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Render same clicked order, final browser click, immutable readback and generation revocation
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/landing-final-venv/bin/activate"
          php -S 127.0.0.1:8765 apps/portal/labs/landing-contract-click/router.php > "$RUNNER_TEMP/contract-server.log" 2>&1 &
          CONTRACT_PID=$!
          php -S 127.0.0.1:8766 apps/portal/labs/landing-contract-click/private_preview_router.php > "$RUNNER_TEMP/preview-server.log" 2>&1 &
          PREVIEW_PID=$!
          php -S 127.0.0.1:8767 apps/portal/labs/landing-contract-click/final_preview_acceptance_lab.php > "$RUNNER_TEMP/final-server.log" 2>&1 &
          FINAL_PID=$!
          trap 'kill "$CONTRACT_PID" "$PREVIEW_PID" "$FINAL_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/lab/login >/dev/null; then break; fi
            sleep 1
          done
          python apps/portal/labs/landing-contract-click/browser_test.py > "$RUNNER_TEMP/prereq-click.log"
          grep -F 'LANDING EXACT CLICK BROWSER PASS:' "$RUNNER_TEMP/prereq-click.log"
          LANDING_PREVIEW_HOLD=1 php apps/portal/labs/landing-contract-click/same_order_approved_brief_bridge.php > "$RUNNER_TEMP/prereq-head.log"
          grep -F 'LANDING BRIDGE HELD FOR HTTP TEST:' "$RUNNER_TEMP/prereq-head.log"
          php apps/portal/labs/landing-contract-click/private_preview_fixture.php seed > "$RUNNER_TEMP/prereq-fixture.log"
          php apps/portal/labs/landing-contract-click/sites_renderer_same_order_lab.php render > "$RUNNER_TEMP/prereq-render.log"
          grep -F 'LANDING SITES REAL RENDER LAB PASS:' "$RUNNER_TEMP/prereq-render.log"
          php apps/portal/labs/landing-contract-click/final_preview_acceptance_lab.php init
          python apps/portal/labs/landing-contract-click/final_preview_acceptance_browser.py | tee "$RUNNER_TEMP/final-browser-proof.log"
          grep -F 'LANDING SAME-ORDER FINAL BUYER ARTIFACT ACCEPT LAB PASS:' "$RUNNER_TEMP/final-browser-proof.log"
          grep -F 'FINAL_ACCEPTANCE=SYNTHETIC_ONLY; PSP=NOT_CALLED; PUBLISH=NO_GO;' "$RUNNER_TEMP/final-browser-proof.log"
