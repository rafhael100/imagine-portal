name: Portal F87 - Performance F100 typed contract (private/public)
on:
  pull_request:
    paths:
      - 'apps/portal/app/Domain/PerformanceDashboard/CredentialBoundPerformanceWorkbenchPreview.php'
      - 'apps/portal/app/Domain/PerformanceDashboard/PerformanceCampaignObservationState.php'
      - 'apps/portal/app/Domain/PerformanceDashboard/PerformanceReviewObservationState.php'
      - 'apps/portal/app/Domain/Catalog/PerformanceChannel.php'
      - 'apps/portal/tests/Unit/CredentialBoundPerformanceWorkbenchPreviewStandalone.php'
      - 'apps/portal/tests/Fixtures/performance-f100-credential-demo.json'
      - '.github/workflows/portal-f62-credential-bound-preview-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-f87-typed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  strict-offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Validate strict offline payload, hostile input and NO-GO
        run: |
          set -euo pipefail
          php -l apps/portal/app/Domain/PerformanceDashboard/CredentialBoundPerformanceWorkbenchPreview.php
          php -l apps/portal/tests/Unit/CredentialBoundPerformanceWorkbenchPreviewStandalone.php
          php apps/portal/tests/Unit/CredentialBoundPerformanceWorkbenchPreviewStandalone.php \
            apps/portal/tests/Fixtures/performance-f100-credential-demo.json
          if grep -R -n -E 'CredentialBoundPerformanceWorkbenchPreview|PORTAL_F62_CREDENTIAL_WORKBENCH_LAB' apps/portal/routes/ apps/portal/bootstrap/ apps/portal/app/Providers/; then
            echo 'FAIL: Performance test-only consumer reached an application entrypoint' >&2
            exit 1
          fi
