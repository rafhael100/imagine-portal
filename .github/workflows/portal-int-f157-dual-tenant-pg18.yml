name: Portal INT-F157 - Two tenant joint revision regression PostgreSQL18 (NO-GO)
on:
  push:
    branches:
      - review/portal-int-f157-dual-tenant-revocation-pg18-2026-11-11
  pull_request:
    branches:
      - review/portal-int-f156-org-revision-pg18-fence-2026-11-11
    paths:
      - 'apps/portal/labs/identity-f157/**'
      - '.github/workflows/portal-int-f157-dual-tenant-pg18.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-tenant-revision-pg18:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f157-review-admin-only
          POSTGRES_DB: portal_f157_lab
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_f157_lab"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      PORTAL_F157_PG_LAB: NON_OPERATIONAL_F157
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: portal_f157_lab
      DB_USERNAME: postgres
      DB_PASSWORD: f157-review-admin-only
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: portal_f157_lab
      PGUSER: postgres
      PGPASSWORD: f157-review-admin-only
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    defaults:
      run:
        shell: bash
        working-directory: apps/portal
    steps:
      - name: Checkout exact draft candidate, never persist credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: PHP disposable test dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: pdo,pdo_pgsql,mbstring,dom,xml,curl,fileinfo,intl,bcmath,zip
      - name: Check contract and install locked package versions
        run: |
          set -euo pipefail
          php -l labs/identity-f157/test_pg_dual_tenant_revision.php
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          composer dump-autoload --no-interaction --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
      - name: Apply both security revision fences together, disposable PG18 only
        run: |
          set -euo pipefail
          php artisan migrate --path=database/migrations/2026_11_09_000002_create_portal_identity_foundation.php --force --no-interaction
          php artisan migrate --path=database/migrations/2026_11_10_000004_add_org_revision_to_portal_sessions.php --force --no-interaction
          php artisan migrate --path=database/migrations/2026_11_10_000007_allow_seo_gsc_connect_grant.php --force --no-interaction
          php artisan migrate --path=database/migrations/2026_11_11_000012_fence_portal_membership_revision.php --force --no-interaction
          php artisan migrate --path=database/migrations/2026_11_11_000013_fence_portal_organization_revision.php --force --no-interaction
          psql -X -A -t -c "SELECT count(*) FROM pg_trigger WHERE tgname IN ('portal_f154_membership_revision_guard','portal_f154_grant_immutable_guard','portal_f154_grant_revision_guard','portal_f156_org_revision_guard') AND NOT tgisinternal" | grep -xq 4
          psql -X -A -t -c "SELECT count(*) FROM pg_policies WHERE schemaname='public' AND tablename LIKE 'portal_%'" | grep -xq 0
      - name: Confirm strict cross-tenant revision separation for same actor
        run: |
          set -euo pipefail
          php labs/identity-f157/test_pg_dual_tenant_revision.php
      - name: Explicit fixture teardown and rollback of all F154/F156 constraints
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          DELETE FROM public.portal_auth_sessions WHERE id IN (
            '55555555-5555-4555-8555-555555555551',
            '55555555-5555-4555-8555-555555555552');
          DELETE FROM public.portal_membership_grants WHERE membership_id='33333333-3333-4333-8333-333333333331';
          DELETE FROM public.portal_memberships WHERE id IN (
            '33333333-3333-4333-8333-333333333331',
            '33333333-3333-4333-8333-333333333332');
          DELETE FROM public.portal_identities WHERE id='11111111-1111-4111-8111-111111111111';
          DELETE FROM public.portal_organizations WHERE id IN (
            '22222222-2222-4222-8222-222222222221',
            '22222222-2222-4222-8222-222222222222');
          COMMIT;
          SQL
          php artisan migrate:rollback --path=database/migrations/2026_11_11_000013_fence_portal_organization_revision.php --force --no-interaction
          php artisan migrate:rollback --path=database/migrations/2026_11_11_000012_fence_portal_membership_revision.php --force --no-interaction
          php artisan migrate:rollback --path=database/migrations/2026_11_10_000007_allow_seo_gsc_connect_grant.php --force --no-interaction
          php artisan migrate:rollback --path=database/migrations/2026_11_10_000004_add_org_revision_to_portal_sessions.php --force --no-interaction
          php artisan migrate:rollback --path=database/migrations/2026_11_09_000002_create_portal_identity_foundation.php --force --no-interaction
          test "$(psql -X -A -t -c "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'portal_%'")" = 0
          git diff --exit-code -- composer.lock routes/ bootstrap/
