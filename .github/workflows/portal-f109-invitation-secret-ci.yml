name: Portal F109 - Invite secret diagnostic/export protection
on:
  push:
    branches:
      - review/portal-f109-invitation-secret-debug-hardening-2026-11-10
  pull_request:
    paths:
      - 'apps/portal/app/Domain/Identity/Invitations/PortalInvitationSecret.php'
      - 'apps/portal/tests/Unit/PortalInvitationSecretTest.php'
      - '.github/workflows/portal-f109-invitation-secret-ci.yml'
permissions:
  contents: read
jobs:
  hide-secret-material:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    defaults:
      run:
        working-directory: apps/portal
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: mbstring, dom, xml, curl, fileinfo, intl, bcmath, zip
      - name: Verify no secrets surface through object inspection
        run: |
          set -euo pipefail
          php -l app/Domain/Identity/Invitations/PortalInvitationSecret.php
          php -l tests/Unit/PortalInvitationSecretTest.php
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php artisan test --no-ansi --filter=PortalInvitationSecretTest
          test "$(php artisan route:list --json | php -r '$r=json_decode(stream_get_contents(STDIN),true); echo count($r);')" -eq 1
          ! grep -R -E 'PortalInvitationSecret|PORTAL_F109' routes/ bootstrap/ app/Providers/ public/
