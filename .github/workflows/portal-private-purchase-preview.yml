name: Portal isolated persistent private preview
on:
  pull_request:
    paths:
      - 'apps/portal/ops/private-purchase/**'
      - 'apps/portal/app/Homologation/**'
      - 'apps/portal/app/Http/Controllers/PurchaseRehearsalController.php'
      - 'apps/portal/app/Providers/PurchaseRehearsalServiceProvider.php'
      - 'apps/portal/app/Providers/FullPortalPreviewServiceProvider.php'
      - 'apps/portal/app/Http/Controllers/FullPortalPreviewController.php'
      - 'apps/portal/resources/views/portal/preview/**'
      - 'apps/portal/resources/views/portal/rehearsal/**'
      - 'apps/portal/tools/test_purchase_browser.py'
      - '.github/workflows/portal-private-purchase-preview.yml'
  push:
    branches:
      - review/portal-owned-four-project-crm-pg18-2026-11-14
permissions:
  contents: read
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fast SQL preflight before app build — PostgreSQL 18 and signed RLS
        run: |
          set -euo pipefail
          bash -n apps/portal/ops/private-purchase/check_customer_schema_ci.sh
          bash apps/portal/ops/private-purchase/check_customer_schema_ci.sh
          python3 -B apps/portal/ops/private-purchase/check_public_boundary.py --self-test
      - name: Build existing locked runtime from official base images
        run: docker build -f infra/development/portal-auth/Dockerfile -t imagine-portal-private-auth:local .
      - name: Build isolated purchase application before generating private files
        working-directory: apps/portal/ops/private-purchase
        run: docker compose build application
      - name: Start new disposable isolated database and loopback gateway
        working-directory: apps/portal/ops/private-purchase
        run: |
          sudo --preserve-env=GITHUB_ACTIONS python3 prepare.py
          docker compose -f compose.yaml -f compose.ci.yaml config --quiet
          # The customer policy must exist before the fail-closed Portal app starts.
          docker compose -f compose.yaml -f compose.ci.yaml up -d --wait database
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < customer-schema.sql
          docker compose -f compose.yaml -f compose.ci.yaml up -d application gateway
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  assert urllib.request.urlopen('http://127.0.0.1:18083/_rehearsal/purchase').status==200
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Private preview readiness failed')
          PY
          test "$(docker inspect imagine-purchase-preview-database-1 --format '{{len .HostConfig.PortBindings}}')" = 0
          test "$(docker inspect imagine-purchase-preview-application-1 --format '{{len .HostConfig.PortBindings}}')" = 0
          test "$(docker network inspect imagine-purchase-preview_private --format '{{.Internal}}')" = true
          test "$(docker inspect imagine-purchase-preview-gateway-1 --format '{{(index (index .HostConfig.PortBindings "8080/tcp") 0).HostIp}}')" = 127.0.0.1
      - name: Compile and PHP-lint every Portal Blade page before browser tests
        working-directory: apps/portal/ops/private-purchase
        run: |
          docker compose exec -T application sh -ec '
            set -eu
            php artisan view:cache
            files=$(find storage/framework/views -type f -name "*.php")
            test -n "$files"
            for file in $files; do
              php -l "$file" >/dev/null || {
                echo "Invalid compiled Blade PHP in $file" >&2
                exit 1
              }
            done
            echo "PASS all compiled Blade templates PHP syntax"
          '
      - name: Real Chromium and persistent restart
        env:
          PURCHASE_PREVIEW_BASE: http://127.0.0.1:18083/_rehearsal/purchase
        run: |
          python3 -m venv /tmp/private-purchase-browser
          /tmp/private-purchase-browser/bin/pip install playwright==1.56.0
          /tmp/private-purchase-browser/bin/python apps/portal/tools/test_purchase_browser.py
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_full_portal.py
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_customer_flow.py
          cd apps/portal/ops/private-purchase
          docker compose exec -T database psql -U postgres -d portal_purchase_rehearsal -Atc 'SELECT count(*) FROM purchase_rehearsal.orders' > /tmp/purchase-count-before
          docker compose restart database application
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  assert urllib.request.urlopen('http://127.0.0.1:18083/_rehearsal/purchase').status==200
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Private preview restart failed')
          PY
          docker compose exec -T database psql -U postgres -d portal_purchase_rehearsal -Atc 'SELECT count(*) FROM purchase_rehearsal.orders' > /tmp/purchase-count-after
          cmp /tmp/purchase-count-before /tmp/purchase-count-after
      - name: Verify client and admin can reopen persisted orders after PostgreSQL restart
        env:
          PURCHASE_PREVIEW_BASE: http://127.0.0.1:18083/_rehearsal/purchase
        run: |
          set -euo pipefail
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_full_portal.py
          CUSTOMER_REOPEN=1 /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_customer_flow.py
          echo 'PASS preview reload after database/app restart, synthetic clients only'
      - name: Checkout exact approved Comercial CTA candidate (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-comercial
          ref: a4d71ae43aa3208f1e61aaaaf0b6619416a87533
          path: external/comercial
          persist-credentials: false
      - name: Set up pinned Node 22 for Astro build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Prepare isolated four-CTA Comercial build, no deploy
        working-directory: external/comercial
        env:
          IMAGINE_PORTAL_CUSTOMER_PREVIEW: '1'
          PUBLIC_PORTAL_LOGIN_URL: 'https://portal.imaginecomunicacao.com.br/login'
          GITHUB_ACTIONS: 'true'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          node scripts/verify-dist.mjs
          node ops/review/purchase/prepare-customer-portal.mjs dist "$RUNNER_TEMP/comercial-customer-prepared"
          node scripts/verify-dist.mjs
      - name: Click built Comercial CTAs into real private Laravel customer checkout
        env:
          GITHUB_ACTIONS: 'true'
          PORTAL_CUSTOMER_COMMERCIAL_E2E: '1'
          IMAGINE_COMERCIAL_CUSTOMER_PREVIEW_ROOT: ${{ runner.temp }}/comercial-customer-prepared
          IMAGINE_CUSTOMER_VISUAL_REVIEW: ${{ runner.temp }}/p0-customer-visual-review
          IMAGINE_CUSTOMER_REOPEN_EVIDENCE: ${{ runner.temp }}/p0-customer-reopen.json
        run: |
          set -euo pipefail
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_comercial_customer_handoff.py
          echo 'PASS Comercial-built links to Laravel demo account, Postgres order and fake briefing; CI ONLY' >> "$GITHUB_STEP_SUMMARY"
      - name: Click Portal do Cliente desktop and mobile from compiled Comercial into Laravel login
        env:
          GITHUB_ACTIONS: 'true'
          PORTAL_CUSTOMER_COMMERCIAL_E2E: '1'
          PORTAL_COMERCIAL_MENU_E2E: '1'
          IMAGINE_COMERCIAL_CUSTOMER_PREVIEW_ROOT: ${{ runner.temp }}/comercial-customer-prepared
        run: |
          set -euo pipefail
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_comercial_portal_menu.py
          echo 'PASS Portal do Cliente desktop/mobile -> Laravel customer/admin real synthetic login and role boundaries' >> "$GITHUB_STEP_SUMMARY"
      - name: Prove forced per-customer SQL isolation under raw company login
        working-directory: apps/portal/ops/private-purchase
        run: |
          set -euo pipefail
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U postgres -d portal_purchase_rehearsal < test_customer_scope.sql
          echo 'PASS: direct database login cannot read any order without a valid signed claim' >> "$GITHUB_STEP_SUMMARY"
      - name: Restart both private services and re-login to all four owned Comercial purchases
        env:
          GITHUB_ACTIONS: 'true'
          PORTAL_CUSTOMER_COMMERCIAL_E2E: '1'
          IMAGINE_CUSTOMER_REOPEN_EVIDENCE: ${{ runner.temp }}/p0-customer-reopen.json
        run: |
          set -euo pipefail
          cd apps/portal/ops/private-purchase
          docker compose restart database application
          python3 - <<'PY'
          import time,urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18083/_preview/portal',timeout=2) as r:
                      assert r.status==200
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Synthetic Portal did not recover after PG18/application restart')
          PY
          cd ../../../..
          /tmp/private-purchase-browser/bin/python apps/portal/ops/private-purchase/test_comercial_customer_reopen.py
          echo 'PASS four owned customer Portal orders/briefings after PG18/app restart; cross-customer denial' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify seven browser screenshots and strict NO-GO manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json,os
          root=Path(os.environ['RUNNER_TEMP'])/'p0-customer-visual-review'
          expected=['01-comercial-desktop.png','02-comercial-mobile.png',
                    '03-portal-login.png','04-customer-offer.png',
                    '05-customer-order-pending.png','06-customer-briefing-durable.png',
                    '07-customer-my-services.png']
          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert m['schema']=='imagine.portal-p0.customer-auth-browser.visual-only.v1'
          assert m['release_gate']=='NO_GO' and m['production_release'] is False
          assert m['customer_data_included'] is False
          assert m['real_payment'] is False
          assert m['customer_credentials_exported'] is False
          assert [r['name'] for r in m['screenshots']]==expected
          assert sorted(p.name for p in root.iterdir())==sorted(expected+['manifest.json'])
          for entry in m['screenshots']:
              file=root/entry['name']
              assert not file.is_symlink()
              content=file.read_bytes()
              assert content.startswith(bytes.fromhex('89504e470d0a1a0a'))
              assert 2000<=len(content)<=2500000
              assert len(content)==entry['bytes']
              assert sha256(content).hexdigest()==entry['sha256']
          assert (root/'manifest.json').stat().st_size<4000
          print('PASS: 7 customer Portal Chromium captures, hashes and NO-GO flags.')
          PY
      - name: Retain private synthetic customer-review images for seven days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: imagine-portal-auth-customer-commerce-visual-review
          path: ${{ runner.temp }}/p0-customer-visual-review
          if-no-files-found: error
          retention-days: 7
      - name: Checkout exact Sites SQL admission and outbox candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-sites
          ref: 3d20d83d544577a70c091ca1725c084ab6824d2a
          path: _sites_pg_candidate
          persist-credentials: false
      - name: Checkout exact Sites signed authority verifier candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-sites
          ref: 21732e9558b730e38a6845adb593d29f309ff6a9
          path: _sites_signed_candidate
          persist-credentials: false
      - name: Checkout exact original Portal Sites signer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-portal
          ref: bf1b2794de4d6000f120ffa2b1e6dd557f34c35e
          path: _portal_sites_signer_candidate
          persist-credentials: false
      - name: Checkout independently verified CRM fake consent PG18 fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-crm
          ref: 50c1eb574aa0ed81055dc256e77302acd1781d71
          path: _crm_fake_consent_candidate
          persist-credentials: false
      - name: Use PHP8.4 with PostgreSQL PDO for isolated second database
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring
          coverage: none
          tools: none
      - name: Four individually owned Portal orders to Sites PG18 and outbox worker
        env:
          P0_OWNED_TO_SITES_CI: '1'
          P0_OWNED_TO_CRM_CI: '1'
        run: |
          set -euo pipefail
          bash -n apps/portal/ops/private-purchase/run_owned_to_sites_ci.sh
          bash apps/portal/ops/private-purchase/run_owned_to_sites_ci.sh
      - name: Retain redacted individually owned Portal to Sites PG18 evidence for 7 days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: imagine-owned-customer-to-sites-pg18-no-go
          path: ${{ runner.temp }}/p0-owned-customer-to-sites-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain four-project individually owned fake-consent PostgreSQL proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: imagine-owned-customers-sites-fake-consented-crm-pg18-no-go
          path: ${{ runner.temp }}/p0-individual-portal-sites-crm-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Diagnose failed synthetic browser flow
        if: failure()
        working-directory: apps/portal/ops/private-purchase
        run: docker compose logs --tail 100 application gateway
      - name: Stop only disposable CI stack
        if: always()
        working-directory: apps/portal/ops/private-purchase
        run: docker compose down --volumes
