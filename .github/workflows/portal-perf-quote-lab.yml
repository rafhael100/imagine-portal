name: Portal Performance signed quote lab

on:
  pull_request:
    paths:
      - 'apps/portal/app/Homologation/Commerce/PortalPerformanceQuoteLabIssuer.php'
      - 'apps/portal/tools/test_performance_quote_lab_issuer.php'
      - '.github/workflows/portal-perf-quote-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-quote-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_ENV: testing
      PORTAL_PERF_SIGN_LAB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          coverage: none
      - name: Syntax
        run: |
          php -l apps/portal/app/Homologation/Commerce/ApprovedOfferCatalog.php
          php -l apps/portal/app/Homologation/Commerce/PortalPerformanceQuoteLabIssuer.php
          php -l apps/portal/tools/test_performance_quote_lab_issuer.php
      - name: Synthetic commercial quote signature checks
        run: php apps/portal/tools/test_performance_quote_lab_issuer.php
