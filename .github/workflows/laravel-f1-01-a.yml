name: Validacao isolada Laravel F1-01-A

# Pipeline somente de leitura/validacao com lockfile versionado. Nao faz merge, deploy, migrations ou escrita em repositorios.
on:
  push:
    branches:
      - dev/fast-track-portal-2026-11-05
    paths:
      - 'apps/portal/**'
      - '.github/workflows/laravel-f1-01-a.yml'
  pull_request:
    paths:
      - 'apps/portal/**'
      - '.github/workflows/laravel-f1-01-a.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-f1-01-a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Laravel / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    defaults:
      run:
        working-directory: apps/portal
        shell: bash
    steps:
      - name: Checkout isolado
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: PHP e extensoes para teste
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: mbstring, dom, xml, pdo, pdo_pgsql, curl, fileinfo, intl, bcmath, zip

      - name: Versoes de PHP e Composer
        run: |
          php --version
          composer --version
          php -m

      - name: Validar composer.json e lockfile versionado
        run: |
          test -s composer.lock
          composer validate --no-check-publish --strict

      - name: Instalar exclusivamente dependencias fixadas no lockfile
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          composer dump-autoload --no-interaction --no-scripts --no-plugins
          git diff --exit-code -- composer.lock

      - name: Auditar dependencias versionadas
        run: composer audit --locked --no-interaction --format=summary

      - name: Sintaxe dos arquivos PHP
        run: |
          php -l artisan
          find app bootstrap config routes tests public -type f -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Gerar chave descartavel somente no runner
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction

      - name: Confirmar apenas rota de saude
        run: php artisan route:list --path=up --no-ansi

      - name: Testes Laravel sem banco ou servicos externos
        run: php artisan test --no-ansi

      - name: Validar sintaxe do QA responsivo reproduzível
        if: matrix.php == '8.3'
        run: python -m py_compile tools/qa_portable_preview.py

      - name: Gerar prévia visual offline e fictícia da identidade Imagine
        if: matrix.php == '8.3'
        run: |
          set -euo pipefail
          php bin/export-portable-preview.php
          test -s storage/app/portal-demo-static/index.html
          test -s storage/app/portal-demo-static/manifest.json
          test "$(find storage/app/portal-demo-static -maxdepth 1 -type f | wc -l)" -eq 11

      - name: Executar QA real offline no Chromium (10 páginas × 7 larguras)
        if: matrix.php == '8.3'
        run: |
          set -euo pipefail
          # Reuse the browser already present in the hosted Ubuntu runner.
          # No additional cloud services, production domain or credentials.
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          python3 -m venv "$RUNNER_TEMP/portal-browser-qa"
          "$RUNNER_TEMP/portal-browser-qa/bin/python" -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.56.0"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("storage/app/portal-demo-static")
          target = Path("storage/app/portal-browser-qa.zip")
          with ZipFile(target, "w", ZIP_DEFLATED) as archive:
              for path in sorted(root.iterdir()):
                  if not path.is_file() or path.is_symlink():
                      raise SystemExit("Refusing unexpected preview entry")
                  archive.write(path, path.name)
          PY
          "$RUNNER_TEMP/portal-browser-qa/bin/python" tools/qa_portable_preview.py \
            storage/app/portal-browser-qa.zip --chromium "$BROWSER" \
            | tee "$RUNNER_TEMP/portal-browser-qa-report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                               "portal-browser-qa-report.json").read_text())
          assert report["passed"] is True
          assert report["manifest_integrity_verified"] is True
          assert report["screens"] == 77 and report["pages"] == 11
          assert report["mobile_menu_checks"] == 10
          assert report["offline_navigation_checks"] == 11
          assert report["keyboard_table_checks"] == 8
          assert report["authorizes_production"] is False
          PY

      - name: Arquivar prévia HTML navegável para revisão visual (sem publicação)
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v5
        with:
          name: imagine-portal-original-brand-offline-preview
          path: apps/portal/storage/app/portal-demo-static/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Arquivar copia de evidencia do lock versionado
        if: matrix.php == '8.3' && always()
        uses: actions/upload-artifact@v5
        with:
          name: composer-lock-f1-01-a-php83
          path: apps/portal/composer.lock
          if-no-files-found: ignore
          retention-days: 7
