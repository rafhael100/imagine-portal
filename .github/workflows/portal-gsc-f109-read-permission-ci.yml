name: Portal GSC F109 - explicit metrics read grant and revocation fence

on:
  pull_request:
    branches:
      - review/portal-gsc-f108-atomic-session-gsc-rls-2026-11-14
    paths:
      - '.github/workflows/portal-gsc-f109-read-permission-ci.yml'
      - 'apps/portal/app/Domain/SeoReview/OfflinePortalGscMetricsGrantReview.php'
      - 'apps/portal/labs/gsc-f109-metrics-grant/**'

permissions:
  contents: read

jobs:
  read-grant-rls-atomic-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: imagine_gsc_ci_test
          POSTGRES_USER: imagine_ci
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imagine_ci -d imagine_gsc_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout immutable review HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable SEO F104 Node fixture generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-seo-engine
          ref: ec1739621b20860f729c59d9863ba1b341da43e8
          path: .qa/seo-f104
          persist-credentials: false
      - name: Setup pinned PHP 8.4 and PDO PostgreSQL
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none
          tools: composer
      - name: Setup pinned Node22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Enforce exact F109 review scope and sources
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C .qa/seo-f104 rev-parse HEAD)" = ec1739621b20860f729c59d9863ba1b341da43e8
          test -z "$(git -C .qa/seo-f104 status --porcelain --untracked-files=no)"
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/f109-review-paths"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const paths=readFileSync(process.env.RUNNER_TEMP+"/f109-review-paths","utf8").split("\0").filter(Boolean);
            const exact=new Set([
              ".github/workflows/portal-gsc-f109-read-permission-ci.yml",
              "apps/portal/app/Domain/SeoReview/OfflinePortalGscMetricsGrantReview.php",
              "apps/portal/labs/gsc-f109-metrics-grant/locked-view-grant.sql",
              "apps/portal/labs/gsc-f109-metrics-grant/test-postgres.php",
              "apps/portal/labs/gsc-f109-metrics-grant/README.md"
            ]);
            if(paths.length!==exact.size||paths.some(p=>!exact.has(p)))
              throw Error("F109: unauthorized path, migration or production route");
            console.log("F109: 5 exact review paths, no migration or HTTP");
          '
      - name: Syntax and locked PHP dependencies
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/portal/app/Domain/SeoReview/OfflinePortalGscMetricsGrantReview.php
          php -l apps/portal/labs/gsc-f109-metrics-grant/test-postgres.php
          node --check apps/portal/labs/gsc-f104-bridge/emit-node.mjs
          composer --working-dir=apps/portal install --no-interaction --prefer-dist --no-progress
      - name: Install original synthetic identity schema and F108 locked GSC
        shell: bash
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: '127.0.0.1'
          DB_PORT: '5432'
          DB_DATABASE: imagine_gsc_ci_test
          DB_USERNAME: imagine_ci
          DB_PASSWORD: local_test_only
          PGHOST: '127.0.0.1'
          PGPORT: '5432'
          PGDATABASE: imagine_gsc_ci_test
          PGUSER: imagine_ci
          PGPASSWORD: local_test_only
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f apps/portal/labs/gsc-f107-session-bridge/portal-identity-fixture.sql
          pushd apps/portal
          for file in \
            2026_11_12_000001_create_portal_gsc_oauth_states.php \
            2026_11_12_000002_create_portal_gsc_property_grants.php \
            2026_11_12_000003_create_portal_gsc_security_events.php \
            2026_11_12_000004_create_portal_gsc_oauth_token_candidates.php \
            2026_11_12_000005_enable_portal_gsc_tenant_rls.php \
            2026_11_14_000006_create_portal_gsc_identity_scope_links.php; do
            php artisan migrate --force --path="database/migrations/$file"
          done
          popd
          psql -X -v ON_ERROR_STOP=1 -f apps/portal/labs/gsc-f108-atomic-fence/locked-session-gsc.sql
          psql -X -v ON_ERROR_STOP=1 -f apps/portal/labs/gsc-f109-metrics-grant/locked-view-grant.sql
      - name: Verify connect-only denial, view grant locking and revocation
        shell: bash
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          DB_CONNECTION: pgsql
          DB_HOST: '127.0.0.1'
          DB_PORT: '5432'
          DB_DATABASE: imagine_gsc_ci_test
          DB_USERNAME: imagine_ci
          DB_PASSWORD: local_test_only
          PORTAL_OPENSEO_DAILY_LAB: '1'
          PORTAL_GSC_F108_ATOMIC_LAB: '1'
          PORTAL_GSC_F109_VIEW_LAB: '1'
          PORTAL_GSC_LEDGER_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=imagine_gsc_ci_test'
          PORTAL_GSC_LEDGER_USER: imagine_ci
          PORTAL_GSC_LEDGER_PASSWORD: local_test_only
        run: |
          set -euo pipefail
          umask 077
          fixture="$(mktemp)"
          trap 'rm -f "$fixture"' EXIT
          for scenario in complete partial empty; do
            node apps/portal/labs/gsc-f104-bridge/emit-node.mjs "$scenario" > "$fixture"
            php apps/portal/labs/gsc-f109-metrics-grant/test-postgres.php "$fixture"
          done
          pushd apps/portal
          for file in \
            2026_11_14_000006_create_portal_gsc_identity_scope_links.php \
            2026_11_12_000005_enable_portal_gsc_tenant_rls.php \
            2026_11_12_000004_create_portal_gsc_oauth_token_candidates.php \
            2026_11_12_000003_create_portal_gsc_security_events.php \
            2026_11_12_000002_create_portal_gsc_property_grants.php \
            2026_11_12_000001_create_portal_gsc_oauth_states.php; do
            php artisan migrate:rollback --force --path="database/migrations/$file"
          done
          popd
      - name: Verify no repository source mutation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C .qa/seo-f104 status --porcelain --untracked-files=no)"
