name: Portal F1-392 Asaas webhook reconciliation lease PG18 (synthetic)
on:
  pull_request:
    paths:
      - 'apps/portal/app/Homologation/Commerce/CustomerPreviewHandoff.php'
      - 'apps/portal/app/Http/Controllers/CustomerPreviewController.php'
      - 'apps/portal/app/Homologation/Commerce/ApprovedOfferCatalog.php'
      - 'apps/portal/app/Domain/SitesIntegration/AsaasWebhookReconciliationWorker.php'
      - 'apps/portal/app/Domain/SitesIntegration/AsaasTrustedEventPaymentSource.php'
      - 'apps/portal/app/Domain/SitesIntegration/DenyingAsaasEventPaymentSource.php'
      - 'apps/portal/ops/psp/asaas-reconciliation-lease-ci.sql'
      - 'tests/f392-asaas-reconciler-lease-pg18.php'
      - '.github/workflows/portal-f1-392-asaas-reconciliation.yml'
      - 'docs/PORTAL-P0-ASAAS-RECONCILER-GATES.md'
permissions:
  contents: read
jobs:
  asaas-independent-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    env:
      GITHUB_ACTIONS: 'true'
      PORTAL_F392_ASAAS_WORKER_CI: '1'
      DB_HOST: '127.0.0.1'
      DB_DATABASE: 'portal_asaas_ci'
    steps:
      - name: Checkout exact reviewed head with no persisted GitHub credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: PHP with native PG18 PDO
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          extensions: pdo_pgsql,sodium
          coverage: none
      - name: Syntax and exact privileged SQL boundary inspection
        run: |
          set -euo pipefail
          php -l tests/f392-asaas-reconciler-lease-pg18.php
          for file in apps/portal/app/Domain/SitesIntegration/*Asaas*php; do php -l "$file"; done
          grep -q 'FOR UPDATE SKIP LOCKED' apps/portal/app/Domain/SitesIntegration/AsaasWebhookReconciliationWorker.php
          grep -q 'FORCE ROW LEVEL SECURITY' apps/portal/ops/psp/asaas-webhook-inbox-ci.sql
          grep -q 'FOR UPDATE TO asaas_reconcile_worker' apps/portal/ops/psp/asaas-reconciliation-lease-ci.sql
      - name: Create SECOND disposable PG18 with two distinct restricted login roles
        run: |
          set -euo pipefail
          docker run --rm -d --name asaas-f392-pg18 \
            -p 127.0.0.1:5432:5432 \
            -e POSTGRES_DB=portal_asaas_ci \
            -e POSTGRES_PASSWORD=CI-ASaaS-ADMIN-SYNTHETIC \
            postgres:18-alpine >/dev/null
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec asaas-f392-pg18 psql -X -At -v ON_ERROR_STOP=1 \
              -U postgres -d portal_asaas_ci -c 'SELECT 1' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker exec -i asaas-f392-pg18 psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d portal_asaas_ci < apps/portal/ops/psp/asaas-webhook-inbox-ci.sql
          docker exec -i asaas-f392-pg18 psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d portal_asaas_ci < apps/portal/ops/psp/asaas-reconciliation-lease-ci.sql
      - name: Prove lease expiry, retries, correct account and independent current PSP check
        run: |
          set -euo pipefail
          if PORTAL_F392_ASAAS_WORKER_CI=0 php tests/f392-asaas-reconciler-lease-pg18.php; then
            echo 'Unsafe: worker tests ran without disposable CI opt-in' >&2
            exit 1
          fi
          php tests/f392-asaas-reconciler-lease-pg18.php
          echo 'PASS limited-scope PG18 lease/ACK, replay, refund and official PSP source mock; still NO-GO for real billing or Site.' >> "$GITHUB_STEP_SUMMARY"
      - name: Drop disposable database unconditionally
        if: always()
        run: docker rm -f asaas-f392-pg18 >/dev/null 2>&1 || true
