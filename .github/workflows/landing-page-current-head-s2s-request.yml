name: Portal Landing Page canonical S2S request parity (draft only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['integration/portal-onepage-head-dispatch-2026-11-19-r10']
    paths:
      - '.github/workflows/landing-page-current-head-s2s-request.yml'
      - 'apps/portal/app/Domain/SitesIntegration/LandingPageCurrentHeadS2sRequestCandidate.php'
      - 'tests/landing-page-head-s2s-request-offline.php'
      - 'docs/PORTAL-LANDING-PAGE-CURRENT-HEAD-REQUEST.md'

permissions:
  contents: read

concurrency:
  group: portal-landing-head-request-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  product-isolation:
    if: >-
      github.repository == 'rafhael100/imagine-portal' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/portal-landing-head-request-2026-11-19-r11' &&
      github.event.pull_request.base.ref == 'integration/portal-onepage-head-dispatch-2026-11-19-r10' &&
      github.event.pull_request.base.sha == '3ddd391d47317ce4e181ec9edca3a3427f2e8261'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-sites
          ref: 26c64e4046a7e6e286676d1620c9af8a20d721aa
          path: .pinned-sites
          fetch-depth: 1
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl
          coverage: none
      - name: Pin immutable Sites and validate syntax
        run: |
          set -euo pipefail
          test "$(git -C .pinned-sites rev-parse HEAD)" = 26c64e4046a7e6e286676d1620c9af8a20d721aa
          php -l apps/portal/app/Domain/SitesIntegration/LandingPageCurrentHeadS2sRequestCandidate.php
          php -l tests/landing-page-head-s2s-request-offline.php
          php -l .pinned-sites/apps/sites/app/Integration/PortalLandingPageHeadRequestCandidate.php
      - name: Verify cross-repo Landing protocol and preserve Onepage
        run: |
          set -euo pipefail
          php tests/landing-page-head-s2s-request-offline.php | tee landing.log
          grep -Eq '^PORTAL LANDING HEAD REQUEST PASS: [0-9]+ checks;' landing.log
          php tests/onepage-current-head-s2s-dispatch-offline.php | tee onepage.log
          grep -Eq '^PORTAL ONEPAGE HEAD DISPATCH PASS: [0-9]+ checks;' onepage.log
