name: Portal F369 - Signed independent witness Ed25519 (NO SERVING)
on:
  pull_request:
    paths:
      - 'apps/portal/app/Infrastructure/Recovery/IndependentWitnessCandidateVerifier.php'
      - 'infra/development/portal-recovery/test-f369.php'
      - '.github/workflows/portal-f369-signed-witness-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signature-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          tools: none
          coverage: none
      - name: Verify Ed25519 attestation integrity without a serving decision
        run: |
          set -euo pipefail
          php -l apps/portal/app/Infrastructure/Recovery/IndependentWitnessCandidateVerifier.php
          php -l infra/development/portal-recovery/test-f369.php
          php infra/development/portal-recovery/test-f369.php
