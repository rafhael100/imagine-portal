name: Portal Onepage S2S current-head candidate (default deny)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['feature/portal-onepage-approved-brief-export-boundary-2026-11-19']
    paths:
      - '.github/workflows/onepage-current-head-s2s-contract.yml'
      - 'apps/portal/app/Domain/SitesIntegration/ApprovedOnepageBriefSnapshot.php'
      - 'apps/portal/app/Domain/SitesIntegration/ApprovedOnepageBriefSnapshotSource.php'
      - 'apps/portal/app/Domain/SitesIntegration/DenyingApprovedOnepageBriefSnapshotSource.php'
      - 'apps/portal/app/Domain/SitesIntegration/CurrentOnepageBriefApprovalWitness.php'
      - 'apps/portal/app/Domain/SitesIntegration/DenyingCurrentOnepageBriefApprovalWitness.php'
      - 'apps/portal/app/Domain/SitesIntegration/OnepageApprovedBriefExportGate.php'
      - 'tests/onepage-approved-brief-export-gate-offline.php'
      - 'docs/PORTAL-ONEPAGE-APPROVED-BRIEF-BOUNDARY.md'

permissions:
  contents: read

concurrency:
  group: portal-onepage-current-head-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  default-deny:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'integration/portal-onepage-current-head-response-2026-11-19-r8' &&
      github.event.pull_request.base.sha == '89e309b497137cec4960b87f90a49d00bbf92843'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fetch immutable Sites current-head response parser (no credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-sites
          ref: 49e6f0a8da848ebf50b6f507d2d3cec6ae65dc97
          path: .pinned-sites
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
          tools: none
      - name: Check code boundaries and execute synthetic refusing adapters
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            apps/portal/app/Domain/SitesIntegration/ApprovedOnepageBriefSnapshot.php \
            apps/portal/app/Domain/SitesIntegration/ApprovedOnepageBriefSnapshotSource.php \
            apps/portal/app/Domain/SitesIntegration/DenyingApprovedOnepageBriefSnapshotSource.php \
            apps/portal/app/Domain/SitesIntegration/CurrentOnepageBriefApprovalWitness.php \
            apps/portal/app/Domain/SitesIntegration/DenyingCurrentOnepageBriefApprovalWitness.php \
            apps/portal/app/Domain/SitesIntegration/OnepageApprovedBriefExportGate.php \
            apps/portal/app/Domain/SitesIntegration/CurrentApprovedOnepageHeadSource.php \
            apps/portal/app/Domain/SitesIntegration/DenyingCurrentApprovedOnepageHeadSource.php \
            apps/portal/app/Domain/SitesIntegration/PortalOnepageHeadServiceWitness.php \
            apps/portal/app/Domain/SitesIntegration/DenyingPortalOnepageHeadServiceWitness.php \
            apps/portal/app/Domain/SitesIntegration/OnepageCurrentHeadS2sResponseCandidate.php \
            tests/onepage-current-head-s2s-contract-offline.php \
            tests/onepage-approved-brief-export-gate-offline.php; do
            php -l "$file"
          done
          php tests/onepage-brief-export-candidate-offline.php
          php tests/onepage-render-plan-candidate-offline.php
          php tests/onepage-approved-brief-export-gate-offline.php | tee "$RUNNER_TEMP/onepage-boundary.txt"
          grep -Eq '^ONEPAGE APPROVED BRIEF SOURCE BOUNDARY PASS: [1-9][0-9]* checks; default-deny, no official approval or transport[.]$' "$RUNNER_TEMP/onepage-boundary.txt"
          test "$(git -C .pinned-sites rev-parse HEAD)" = 49e6f0a8da848ebf50b6f507d2d3cec6ae65dc97
          php -l .pinned-sites/src/Production/BriefCandidateJson.php
          php -l .pinned-sites/apps/sites/app/Integration/PortalOnepageHeadMtlsHttpSource.php
          php tests/onepage-current-head-s2s-contract-offline.php | tee "$RUNNER_TEMP/onepage-current-head-s2s.txt"
          grep -Eq '^PORTAL ONEPAGE CURRENT HEAD CONTRACT PASS: [1-9][0-9]* checks; synthetic sources, pinned Sites parser, no official head, HTTP or authority[.]$' "$RUNNER_TEMP/onepage-current-head-s2s.txt"
