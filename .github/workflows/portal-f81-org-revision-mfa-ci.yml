name: Portal F81 - Organization Revision MFA Authorization Integration

on:
  pull_request:
    paths:
      - 'apps/portal/database/migrations/2026_11_09_000002_create_portal_identity_foundation.php'
      - 'apps/portal/database/migrations/2026_11_09_000003_add_mfa_replay_counter_to_portal_identities.php'
      - 'apps/portal/app/Domain/Identity/Security/PortalTotpVerifier.php'
      - 'apps/portal/app/Labs/IdentityF70/**'
      - 'apps/portal/labs/identity-f66/**'
      - 'apps/portal/labs/identity-f70/**'
      - 'apps/portal/app/Labs/IdentityF75/**'
      - 'apps/portal/labs/identity-f75/**'
      - 'apps/portal/app/Labs/IdentityF81/**'
      - 'apps/portal/labs/identity-f81/**'
      - 'apps/portal/labs/identity-f76/**'
      - 'apps/portal/database/migrations/2026_11_10_000004_add_org_revision_to_portal_sessions.php'
      - '.github/workflows/portal-f81-org-revision-mfa-ci.yml'
      - 'apps/portal/app/Domain/Identity/Security/PortalTotpSecretCipher.php'
      - '.github/workflows/portal-f75-enrolled-totp-pg-ci.yml'
      - '.github/workflows/portal-f70-totp-pg-cas-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-f81-org-mfa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  f81-disposable-pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-f66-db-only
          POSTGRES_DB: portal_identity_lab
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_identity_lab"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      PORTAL_F66_PG_LAB: '1'
      PORTAL_F75_PG_LAB: '1'
      PORTAL_F81_PG_LAB: '1'
      PORTAL_F76_PG_LAB: '1'
      PORTAL_F70_PG_LAB: '1'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: portal_identity_lab
      DB_USERNAME: postgres
      DB_PASSWORD: ci-f66-db-only
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: portal_identity_lab
      PGUSER: postgres
      PGPASSWORD: ci-f66-db-only
      F66_PG_ADMIN_PASSWORD: ci-f66-db-only
      F66_PG_READER_PASSWORD: ci-f66-read-only
      F76_PG_READER_PASSWORD: ci-f76-reader-only
      LOG_CHANNEL: stderr
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    defaults:
      run:
        working-directory: apps/portal
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: pdo,pdo_pgsql,mbstring,dom,xml,curl,fileinfo,intl,bcmath,zip,sodium
      - name: Lint PHP and install locked dependencies without scripts or plugins
        run: |
          set -euo pipefail
          php -l database/migrations/2026_11_09_000002_create_portal_identity_foundation.php
          php -l database/migrations/2026_11_09_000003_add_mfa_replay_counter_to_portal_identities.php
          php -l app/Labs/IdentityF70/PortalMfaReplayFence.php
          php -l labs/identity-f66/test_pg_identity_foundation.php
          php -l labs/identity-f70/test_pg_mfa_replay.php
          php -l app/Labs/IdentityF75/PortalEnrolledMfaSessionCompleter.php
          php -l labs/identity-f75/test_pg_enrolled_mfa.php
          php -l app/Labs/IdentityF81/PortalOrgRevisionMfaCompleter.php
          php -l labs/identity-f81/test_pg_org_revision_mfa.php
          php -l database/migrations/2026_11_10_000004_add_org_revision_to_portal_sessions.php
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          composer dump-autoload --no-interaction --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          test "$APP_ENV" = testing
          test "$DB_DATABASE" = portal_identity_lab
      - name: Apply only F66/F70 identity migrations on disposable PG18
        run: |
          set -euo pipefail
          php artisan migrate --path=database/migrations/2026_11_09_000002_create_portal_identity_foundation.php --force --no-interaction
          php artisan migrate --path=database/migrations/2026_11_09_000003_add_mfa_replay_counter_to_portal_identities.php --force --no-interaction
          php artisan migrate --path=database/migrations/2026_11_10_000004_add_org_revision_to_portal_sessions.php --force --no-interaction
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "CREATE ROLE portal_f66_reader LOGIN PASSWORD 'ci-f66-read-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "GRANT CONNECT ON DATABASE portal_identity_lab TO portal_f66_reader"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "GRANT USAGE ON SCHEMA public TO portal_f66_reader"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "GRANT SELECT,INSERT,UPDATE,DELETE ON portal_identities,portal_organizations,portal_memberships,portal_membership_grants,portal_auth_sessions TO portal_f66_reader"
      - name: Register F76 authorization predicate with EXECUTE-only role
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "CREATE ROLE portal_f76_reader LOGIN PASSWORD 'ci-f76-reader-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "GRANT CONNECT ON DATABASE portal_identity_lab TO portal_f76_reader"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "GRANT USAGE ON SCHEMA public TO portal_f76_reader"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -f labs/identity-f76/permission_gate.sql
          test "$(psql -X -A -t -d "$PGDATABASE" -c "SELECT count(*) FROM pg_policies WHERE tablename LIKE 'portal_%'")" -eq 0
      - name: Run tenant/RLS fixture then prove MFA and organization permission converge
        run: |
          set -euo pipefail
          php labs/identity-f66/test_pg_identity_foundation.php
          php labs/identity-f70/test_pg_mfa_replay.php
          php labs/identity-f81/test_pg_org_revision_mfa.php
          test "$(php artisan route:list --json | jq length)" -eq 1
          ! grep -R -E 'PortalMfaReplayFence|PORTAL_F70_PG_LAB|PortalEnrolledMfaSessionCompleter|PORTAL_F75_PG_LAB|PortalOrgRevisionMfaCompleter|PORTAL_F81_PG_LAB' routes bootstrap app/Providers
          git diff --exit-code -- composer.lock bootstrap routes
      - name: Verify counter rollback then F66 schema rollback on isolated PG
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "DROP FUNCTION public.portal_f76_permission_check(text,uuid,text)"
          php artisan migrate:rollback --path=database/migrations/2026_11_10_000004_add_org_revision_to_portal_sessions.php --force --no-interaction
          test "$(psql -X -A -t -d "$PGDATABASE" -c "SELECT count(*) FROM information_schema.columns WHERE table_name='portal_auth_sessions' AND column_name='organization_revision'")" -eq 0
          php artisan migrate:rollback --path=database/migrations/2026_11_09_000003_add_mfa_replay_counter_to_portal_identities.php --force --no-interaction
          test "$(psql -X -A -t -d "$PGDATABASE" -c "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='portal_identities' AND column_name='mfa_last_used_counter'")" -eq 0
          php artisan migrate:rollback --path=database/migrations/2026_11_09_000002_create_portal_identity_foundation.php --force --no-interaction
          test "$(psql -X -A -t -d "$PGDATABASE" -c "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'portal_%'")" -eq 0
