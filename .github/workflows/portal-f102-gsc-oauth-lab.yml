name: Portal F102 — synthetic GSC OAuth PKCE contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-oauth-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - name: Checkout read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Offline PKCE/state and tenant-binding contract
        run: php apps/portal/labs/gsc-f102/test_oauth_pkce.php
