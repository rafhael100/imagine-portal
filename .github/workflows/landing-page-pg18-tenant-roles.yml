name: Portal Landing PG18 tenant role isolation (draft only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['test/portal-landing-pg18-terminal-revocation-2026-11-20-r16']
    paths:
      - '.github/workflows/landing-page-pg18-tenant-roles.yml'
      - 'apps/portal/labs/landing-pg-head/tenant-role-probe.php'
      - 'apps/portal/labs/landing-pg-head/TENANT-ROLE-PROOF.md'
permissions:
  contents: read
concurrency:
  group: portal-landing-role-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  scoped-role-pg18:
    if: >-
      github.repository == 'rafhael100/imagine-portal' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/portal-landing-pg18-tenant-roles-2026-11-20-r19' &&
      github.event.pull_request.base.ref == 'test/portal-landing-pg18-terminal-revocation-2026-11-20-r16' &&
      github.event.pull_request.base.sha == '30f10691c6710e7b5effb220d0f4788c7f91914e'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      pg18:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql
          coverage: none
      - name: Lint candidate and verify pgsql driver
        run: |
          set -euo pipefail
          php -l apps/portal/labs/landing-pg-head/tenant-role-probe.php
          php -l apps/portal/app/Domain/SitesIntegration/Pg18LandingPageApprovedBriefHeadSourceCandidate.php
          php -m | grep -x pdo_pgsql
      - name: PG18 nonowner tenant isolation and existing reader regressions
        run: |
          set -euo pipefail
          php apps/portal/labs/landing-pg-head/tenant-role-probe.php | tee tenant-role.log
          grep -Eq '^PORTAL LANDING PG18 RLS ROLE PASS: [0-9]+ checks;' tenant-role.log
          php apps/portal/labs/landing-pg-head/terminal-event-probe.php | tee terminal-regression.log
          grep -Eq '^PORTAL LANDING PG18 TERMINAL FENCE PASS: [0-9]+ checks;' terminal-regression.log
          php apps/portal/labs/landing-pg-head/probe.php | tee original-regression.log
          grep -Eq '^PORTAL LANDING PG18 ATOMIC HEAD PASS: [0-9]+ checks;' original-regression.log
