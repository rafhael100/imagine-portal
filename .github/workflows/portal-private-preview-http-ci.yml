name: Portal P0 - private synthetic preview loopback only

on:
  pull_request:
    paths:
      - 'apps/portal/tools/serve_private_preview.py'
      - 'apps/portal/tools/iniciar_previa_imagine_windows.cmd'
      - 'apps/portal/tests/test_private_preview_http.py'
      - 'docs/PORTAL-P0-PRIVATE-LOOPBACK-REVIEW.md'
      - '.github/workflows/portal-private-preview-http-ci.yml'
  push:
    branches:
      - review/portal-p0-private-loopback-bundle-viewer-2026-11-13

permissions:
  contents: read

jobs:
  no-deploy-private-http:
    name: Python stdlib / ZIP integrity / local-only HTTP
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Compile read-only preview viewer and test harness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile apps/portal/tools/serve_private_preview.py
          python3 -m py_compile apps/portal/tests/test_private_preview_http.py
      - name: Run negative and HTTP security tests on isolated runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s apps/portal/tests -p 'test_private_preview_http.py' -v
      - name: Enforce runtime isolation from Laravel, public deploy and credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('apps/portal/tools/serve_private_preview.py').read_text()
          assert '127.0.0.1' in source
          assert 'ThreadingHTTPServer(("127.0.0.1", port), Handler)' in source
          assert '--serve' in source and '--check' in source
          import ast
          parsed=ast.parse(source)
          imported=set()
          for node in ast.walk(parsed):
              if isinstance(node, ast.Import):
                  imported.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imported.add(node.module.split('.')[0])
          assert not imported.intersection({
              'subprocess', 'requests', 'paramiko', 'socket',
              'urllib', 'ftplib', 'smtplib', 'dotenv'
          }), imported
          assert 'ThreadingHTTPServer(("127.0.0.1", port), Handler)' in source
          assert '0.0.0.0' not in source
          assert 'docker run' not in source
          print('NO-GO: no deployment, no public hosting, no runtime or customer authorization.')
          PY

  real-imagine-ui-bundle-readonly:
    name: PHP 8.4 synthetic original-logo UI ZIP / strict private HTTP
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout private viewer under test
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout verified exact Imagine original UI candidate, NO-GO
        uses: actions/checkout@v5
        with:
          repository: rafhael100/imagine-portal
          ref: 47e443c204c4085eb5ca899703b9a985e19821cc
          path: _original_imagine_ui_candidate
          persist-credentials: false
      - name: Verify immutable original-logo UI revision and local-only workflow scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _original_imagine_ui_candidate rev-parse HEAD)" = "47e443c204c4085eb5ca899703b9a985e19821cc"
          test -f _original_imagine_ui_candidate/apps/portal/bin/export-portable-preview.php
          test -f _original_imagine_ui_candidate/apps/portal/public/assets/logo-imagine.png
          test -f apps/portal/tools/serve_private_preview.py
      - name: Prepare disposable PHP 8.4 with exact original Portal candidate dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: dom, mbstring, xml, pdo, pdo_sqlite, intl, bcmath, curl, zip
      - name: Export real synthetic Imagine HTML package in ephemeral runner
        shell: bash
        working-directory: _original_imagine_ui_candidate/apps/portal
        env:
          APP_ENV: testing
          PORTAL_ALLOW_LOCAL_STATIC_PREVIEW: '1'
        run: |
          set -euo pipefail
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          composer dump-autoload --no-interaction --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php bin/export-portable-preview.php
          test "$(find storage/app/portal-demo-static -maxdepth 1 -type f | wc -l)" -eq 12
      - name: Verify exact real UI ZIP and HTTP read-only access using viewer under test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import os
          root=Path("_original_imagine_ui_candidate/apps/portal/storage/app/portal-demo-static")
          target=Path(os.environ["RUNNER_TEMP"])/"imagine-original-ui-synthetic.zip"
          assert root.is_dir() and not root.is_symlink()
          with ZipFile(target,"w",ZIP_DEFLATED) as archive:
              for file in sorted(root.iterdir()):
                  assert file.is_file() and not file.is_symlink()
                  archive.write(file,file.name)
          print("Private synthetic UI package created inside disposable CI runner only.")
          PY
          python3 apps/portal/tools/serve_private_preview.py \
            --zip "$RUNNER_TEMP/imagine-original-ui-synthetic.zip" --check
          python3 - <<'PY'
          from contextlib import closing
          from http.client import HTTPConnection
          import importlib.util, os
          from pathlib import Path
          from threading import Thread
          path=Path('apps/portal/tools/serve_private_preview.py')
          spec=importlib.util.spec_from_file_location('real_imagine_preview',path)
          assert spec and spec.loader
          viewer=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(viewer)
          pages=viewer.load_verified_bundle(
              Path(os.environ['RUNNER_TEMP'])/'imagine-original-ui-synthetic.zip')
          assert len(pages)==11 and b'data-guide-start' in pages['index.html']
          assert b'data-guided-flow' in pages['overview.html']
          with viewer.create_local_server(pages,0) as server:
              assert server.server_address[0]=='127.0.0.1'
              worker=Thread(target=server.serve_forever, daemon=True)
              worker.start()
              try:
                  for page in ('index.html','overview.html','available.html',
                               'requests.html','preparation.html','journey.html','services.html'):
                      with closing(HTTPConnection('127.0.0.1',server.server_port,timeout=5)) as c:
                          c.request('GET','/'+page)
                          response=c.getresponse()
                          assert response.status==200, page
                          assert response.read()==pages[page]
                          assert response.getheader('Cache-Control')=='no-store, max-age=0'
                  with closing(HTTPConnection('127.0.0.1',server.server_port,timeout=5)) as c:
                      c.request('GET','/manifest.json')
                      response=c.getresponse()
                      assert response.status==404
                      assert response.read()==b''
              finally:
                  server.shutdown()
                  worker.join(timeout=5)
          print('PASS: real original Imagine UI artifact served only via isolated loopback; NO-GO production.')
          PY
      - name: Package exact reviewed HTML, viewer, Windows launcher and runbook
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/imagine-p0-private-review"
          mkdir -p "$package"
          cp "$RUNNER_TEMP/imagine-original-ui-synthetic.zip" "$package/"
          cp apps/portal/tools/serve_private_preview.py "$package/"
          cp apps/portal/tools/iniciar_previa_imagine_windows.cmd "$package/"
          cp docs/PORTAL-P0-PRIVATE-LOOPBACK-REVIEW.md "$package/"
          test "$(find "$package" -maxdepth 1 -type f | wc -l)" -eq 4
      - name: Archive verified ZIP and Windows-compatible viewer
        uses: actions/upload-artifact@v5
        with:
          name: imagine-p0-private-html-review-only
          path: ${{ runner.temp }}/imagine-p0-private-review/
          if-no-files-found: error
          retention-days: 7

  windows-11-private-review-smoke:
    name: Windows / Python 3.12 / verified ZIP / localhost only
    needs: real-imagine-ui-bundle-readonly
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout Python security regression suite
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run ZIP/Host/HTTP negative tests on Windows
        shell: pwsh
        run: |
          python -B -m unittest discover -s apps/portal/tests -p test_private_preview_http.py -v
          if ($LASTEXITCODE -ne 0) { throw "Windows private HTTP tests failed" }
      - name: Fetch the same PHP-generated synthetic review artifact
        uses: actions/download-artifact@v5
        with:
          name: imagine-p0-private-html-review-only
          path: private-preview
      - name: Audit Windows package and verify all eleven original pages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $PWD 'private-preview'
          $expected = @('imagine-original-ui-synthetic.zip', 'serve_private_preview.py', 'iniciar_previa_imagine_windows.cmd', 'PORTAL-P0-PRIVATE-LOOPBACK-REVIEW.md')
          $actual = @(Get-ChildItem -LiteralPath $folder -File | ForEach-Object { $_.Name })
          $diff = @(Compare-Object -ReferenceObject $expected -DifferenceObject $actual)
          if ($diff.Count -ne 0) { throw 'Unexpected Windows package files' }
          $launcher = Get-Content -Raw (Join-Path $folder 'iniciar_previa_imagine_windows.cmd')
          if (-not $launcher.Contains('choice /C SN') -or -not $launcher.Contains('--check') -or -not $launcher.Contains('--serve') -or -not $launcher.Contains('127.0.0.1')) {
            throw 'Launcher must verify, ask consent and be local-only'
          }
          python (Join-Path $folder 'serve_private_preview.py') --zip (Join-Path $folder 'imagine-original-ui-synthetic.zip') --check
          if ($LASTEXITCODE -ne 0) { throw 'Windows real UI bundle integrity failed' }
          Write-Output 'Windows test validated the real 11-page Imagine review package; no server started.'
