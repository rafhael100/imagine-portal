name: Portal OWN-02 — synthetic customer ownership on PG18
on:
  pull_request:
    paths:
      - 'apps/portal/tools/test_owned_purchase_pg18.php'
      - 'apps/portal/app/Homologation/SyntheticPurchaseOwnership.php'
      - 'apps/portal/app/Homologation/RoleBoundTestPurchase.php'
      - 'apps/portal/app/Homologation/PersistedTestPurchase.php'
      - '.github/workflows/portal-owned-purchase-pg18.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-purchase-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3','8.4']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: portal_purchase_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_purchase_rehearsal"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: PHP and restricted PostgreSQL role driver
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_pgsql
          coverage: none
      - name: Syntax, ownership-only pure unit tests, isolated PostgreSQL fixture
        run: |
          set -euo pipefail
          php -l apps/portal/tools/test_owned_purchase_pg18.php
          php -l apps/portal/app/Homologation/SyntheticPurchaseOwnership.php
          php apps/portal/tools/test_synthetic_purchase_ownership.php
          php apps/portal/tools/test_persisted_purchase.php
      - name: Verify atomic ownership and fail-closed legacy rows
        env:
          PORTAL_OWNED_PURCHASE_PG18_CI: '1'
        run: |
          set -euo pipefail
          php apps/portal/tools/test_owned_purchase_pg18.php
      - name: Explicit review limitations
        run: |
          echo "PASS: disposable PG18 roles and atomic synthetic customer ownership only" >> "$GITHUB_STEP_SUMMARY"
          echo "NO-GO: shared tenant login does not enforce per-customer RLS at raw SQL level" >> "$GITHUB_STEP_SUMMARY"
          echo "NO DEPLOY, no public HTTP, real identity, payment, migration, IAM or production." >> "$GITHUB_STEP_SUMMARY"
