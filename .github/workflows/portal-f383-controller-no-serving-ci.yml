name: Portal F383 - Actual password MFA session logout endpoints deny before controller
on:
  pull_request:
    paths:
      - 'apps/portal/tests/Feature/PortalWitnessAuthenticatedTransportNoServingTest.php'
      - '.github/workflows/portal-f383-controller-no-serving-ci.yml'
permissions:
  contents: read
jobs:
  protected-real-laravel-controllers:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom,xml,pdo,pdo_pgsql,curl,fileinfo,intl,bcmath,zip,sodium
          tools: composer:v2
          coverage: none
      - name: Real Laravel controller tests, witness-no-serving and HTTPS CSRF boundaries
        run: |
          set -Eeuo pipefail
          php -l tests/Feature/PortalWitnessAuthenticatedTransportNoServingTest.php
          if grep -R -E '(PortalWitnessNoServingHttpGuard|PortalWitnessOnlyIdentityRead)' \
              routes bootstrap app/Providers; then
            echo 'F383 candidate may never appear in public routes or service providers'
            exit 1
          fi
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php artisan test tests/Feature/PortalWitnessHttpNoServingGateTest.php --no-ansi
          php artisan test tests/Feature/PortalWitnessAuthenticatedTransportNoServingTest.php --no-ansi
          php artisan test tests/Feature/PortalBrowserAuthTransportTest.php --no-ansi
          php artisan test tests/Feature/PortalAuthenticationRoutesClosedTest.php --no-ansi
