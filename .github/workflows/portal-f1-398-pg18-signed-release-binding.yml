name: Portal F1-398 signed tenant release binding PG18 (synthetic, no deploy)
on:
  pull_request:
    paths:
      - 'apps/portal/app/Domain/SitesIntegration/PortalPg18SiteReleaseAssignmentSource.php'
      - 'apps/portal/ops/sites-integration/release-binding-pg18-ci.sql'
      - 'tests/f398-pg18-release-binding-source.php'
      - '.github/workflows/portal-f1-398-pg18-signed-release-binding.yml'
      - 'docs/PORTAL-P0-F398-TRUSTED-RELEASE-BINDING-GATES.md'
permissions:
  contents: read
jobs:
  signed-release-pg18:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    env:
      GITHUB_ACTIONS: 'true'
      PORTAL_F398_BINDING_CI: '1'
      DB_HOST: '127.0.0.1'
      DB_DATABASE: 'portal_release_ci'
    steps:
      - name: Checkout exact Portal review HEAD, without persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Native PHP with PDO PostgreSQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql,sodium
          tools: none
          coverage: none
      - name: Lint standalone production-shaped source and test
        run: |
          set -euo pipefail
          php -l apps/portal/app/Domain/SitesIntegration/PortalSitesReleaseAssignment.php
          php -l apps/portal/app/Domain/SitesIntegration/PortalPg18SiteReleaseAssignmentSource.php
          php -l tests/f398-pg18-release-binding-source.php
      - name: Start disposable PostgreSQL18 and prepare HMAC/FORCE RLS append-only ledger
        run: |
          set -euo pipefail
          docker run -d --rm --name portal-f398-pg18 \
            -p 127.0.0.1:5432:5432 \
            -e POSTGRES_DB=portal_release_ci \
            -e POSTGRES_PASSWORD=CI-ONLY-RELEASE-POSTGRES \
            postgres:18-alpine >/dev/null
          ready=0
          for i in $(seq 1 60); do
            if docker exec portal-f398-pg18 psql -X -A -t -v ON_ERROR_STOP=1 \
              -U postgres -d portal_release_ci -c 'SELECT 1' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker exec -i portal-f398-pg18 psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d portal_release_ci < apps/portal/ops/sites-integration/release-binding-pg18-ci.sql
      - name: Prove actual restricted login, tenant HMAC, append-only supersession and RLS
        run: |
          set -euo pipefail
          if PORTAL_F398_BINDING_CI=0 php tests/f398-pg18-release-binding-source.php; then
            echo 'Unsafe: F398 ran without explicit CI guard' >&2
            exit 1
          fi
          php tests/f398-pg18-release-binding-source.php
          echo 'PASS PG18 trusted release association: HMAC signed tenant, FORCE RLS, revocation/supersession; no Sites publish.' >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce no route or release publisher registration
        run: |
          set -euo pipefail
          if grep -R -n 'PortalPg18SiteReleaseAssignmentSource' apps/portal/app/Providers apps/portal/routes 2>/dev/null; then
            echo 'NO-GO: trusted release binding source unexpectedly operational' >&2
            exit 1
          fi
      - name: Always destroy disposable database
        if: always()
        run: docker rm -f portal-f398-pg18 >/dev/null 2>&1 || true
