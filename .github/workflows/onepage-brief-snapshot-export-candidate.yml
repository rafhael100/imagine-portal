name: Portal Onepage rich brief candidate export to Sites (isolated)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - test/onepage-d0-atomic-ingress-pg-v2
    paths:
      - '.github/workflows/onepage-brief-snapshot-export-candidate.yml'
      - 'apps/portal/app/Domain/SitesIntegration/OnepageBriefSnapshotCandidateEncoder.php'
      - 'tests/onepage-brief-export-candidate-offline.php'
      - 'tests/onepage-brief-sites-candidate-parity.php'
      - 'docs/PORTAL-ONEPAGE-BRIEF-SNAPSHOT-EXPORT-CANDIDATE.md'

permissions:
  contents: read

concurrency:
  group: portal-sites-brief-export-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  candidate-parity:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/portal-onepage-brief-snapshot-export-candidate-2026-11-19' &&
      github.event.pull_request.base.sha == '3ad87dceb6c57ff0e5e63ec15aaf0486bbbc201c'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - name: Checkout exact Portal candidate, without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout immutable public Sites consumer at pinned review commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-sites
          ref: 3ac4e9c7d3106b57096b6eb7143a057d0267de35
          path: .pinned-sites
          persist-credentials: false
          fetch-depth: 1
      - name: Verify both exact sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .pinned-sites rev-parse HEAD)" = '3ac4e9c7d3106b57096b6eb7143a057d0267de35'
          test -s .pinned-sites/src/Production/BriefSnapshotInput.php
          test -s .pinned-sites/src/Production/BriefCandidateJson.php
          test -s .pinned-sites/contracts/portal-sites/candidates/brief-production-v1/examples/onepage-brief.synthetic.json
          git diff --exit-code -- .pinned-sites
      - name: Isolated PHP without application, Portal credentials or database
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring
          tools: none
      - name: Run complete offline candidate and pinned consumer tests
        shell: bash
        env:
          SITES_PINNED_CANDIDATE_CI: '1'
        run: |
          set -euo pipefail
          php -l apps/portal/app/Domain/SitesIntegration/OnepageBriefSnapshotCandidateEncoder.php
          php -l tests/onepage-brief-export-candidate-offline.php
          php -l tests/onepage-brief-sites-candidate-parity.php
          php -l .pinned-sites/src/Production/BriefSnapshotInput.php
          php tests/onepage-brief-export-candidate-offline.php | tee "$RUNNER_TEMP/portal-export-offline.txt"
          php tests/onepage-brief-sites-candidate-parity.php | tee "$RUNNER_TEMP/portal-sites-parity.txt"
          grep -Eq '^PORTAL ONEPAGE BRIEF CANDIDATE OFFLINE PASS: [1-9][0-9]* checks; no authenticated export or transport[.]$' "$RUNNER_TEMP/portal-export-offline.txt"
          grep -Eq '^PORTAL-SITES PINNED BRIEF CANDIDATE PARITY PASS: [1-9][0-9]* checks; no authority or transport[.]$' "$RUNNER_TEMP/portal-sites-parity.txt"
