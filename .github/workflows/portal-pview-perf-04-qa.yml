name: Portal PVIEW-PERF-04 - Performance AI offline presentation QA

on:
  push:
    branches:
      - feat/portal-pview-performance-detail-2026-11-08

permissions:
  contents: read

concurrency:
  group: portal-perf-pview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-offline:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: PHP 8.4 & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: mbstring, dom, xml, pdo, pdo_pgsql, curl, fileinfo, intl, bcmath, zip
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locked dependencies, no migrations, deploy or external providers
        shell: bash
        run: |
          set -euo pipefail
          cd apps/portal
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          composer dump-autoload --no-interaction --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          git diff --exit-code -- composer.lock
      - name: PHPUnit presentation and security assertions
        shell: bash
        run: |
          set -euo pipefail
          cd apps/portal
          ./vendor/bin/phpunit tests/Feature/PviewNavigationPresentationTest.php tests/Feature/PviewPerformanceDetailTest.php
      - name: Export Blade HTML only into runner temp
        shell: bash
        env:
          PVIEW_RENDER_FILE: ${{ runner.temp }}/pview-perf-preview.html
        run: |
          php -l apps/portal/preview/tests/render_blade_preview.php
          php apps/portal/preview/tests/render_blade_preview.php
          test -s "$PVIEW_RENDER_FILE"
      - name: Browser QA on offline HTML - 3 sizes / 8 sections / keyboard
        shell: bash
        env:
          PVIEW_HTML_FILE: ${{ runner.temp }}/pview-perf-preview.html
          PVIEW_HASH_PREFIX: pview-
          PVIEW_SHOT_PREFIX: pview-perf
          PVIEW_EVIDENCE_DIR: ${{ runner.temp }}/pview-perf-evidence
        run: |
          node --check apps/portal/preview/tests/pview_browser_check.mjs
          node apps/portal/preview/tests/pview_browser_check.mjs
