name: Portal Onepage editorial control deny (draft only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - review/portal-onepage-render-plan-manifest-deny-2026-11-19
    paths:
      - '.github/workflows/onepage-editorial-control-deny.yml'
      - 'apps/portal/app/Domain/SitesIntegration/OnepageRenderPlanCandidateEncoder.php'
      - 'tests/onepage-render-plan-candidate-offline.php'
      - 'apps/portal/app/Domain/SitesIntegration/OnepageBriefSnapshotCandidateEncoder.php'
      - 'tests/onepage-plan-sites-render-parity.php'
      - 'docs/PORTAL-ONEPAGE-RENDER-PLAN-CANDIDATE.md'

permissions:
  contents: read

concurrency:
  group: portal-onepage-controls-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  plan-parity:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'review/portal-onepage-editorial-control-deny-2026-11-20' &&
      github.event.pull_request.base.sha == '7acee97ebaf474d630415ca456a616b5e12f2df7'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - name: Checkout Portal review branch without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout immutable public Sites renderer and parsers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-sites
          ref: 3ac4e9c7d3106b57096b6eb7143a057d0267de35
          path: .pinned-sites
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable Sites reference
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .pinned-sites rev-parse HEAD)" = '3ac4e9c7d3106b57096b6eb7143a057d0267de35'
          test -s .pinned-sites/src/Production/BriefRenderProvenance.php
          test -s .pinned-sites/src/Production/LocalSiteRendering.php
          test -s .pinned-sites/contracts/portal-sites/candidates/brief-production-v1/examples/brief-render-plan.synthetic.json
      - name: Setup isolated PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, dom
          tools: none
      - name: Test snapshot, separate editorial plan and full pinned rendering
        shell: bash
        env:
          SITES_PINNED_CANDIDATE_CI: '1'
        run: |
          set -euo pipefail
          php -l apps/portal/app/Domain/SitesIntegration/OnepageRenderPlanCandidateEncoder.php
          php -l tests/onepage-render-plan-candidate-offline.php
          php -l tests/onepage-plan-sites-render-parity.php
          php tests/onepage-brief-export-candidate-offline.php
          php tests/onepage-brief-sites-candidate-parity.php
          php tests/onepage-render-plan-candidate-offline.php | tee "$RUNNER_TEMP/onepage-render-plan.txt"
          php tests/onepage-plan-sites-render-parity.php | tee "$RUNNER_TEMP/onepage-site-render-parity.txt"
          grep -Eq '^PORTAL ONEPAGE RENDER PLAN CANDIDATE OFFLINE PASS: [1-9][0-9]* checks; no publishing authority[.]$' "$RUNNER_TEMP/onepage-render-plan.txt"
          grep -Eq '^PORTAL-SITES PINNED RENDER PLAN PARITY PASS: [1-9][0-9]* checks; no commercial authority[.]$' "$RUNNER_TEMP/onepage-site-render-parity.txt"
