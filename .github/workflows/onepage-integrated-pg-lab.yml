name: Onepage integrated PostgreSQL laboratory (single draft)
on:
  pull_request:
    types: [opened]
    branches: ['test/onepage-binding-durable-2026-11-17']
    paths:
      - '.github/workflows/onepage-integrated-pg-lab.yml'
permissions:
  contents: read
jobs:
  onepage-integrated-laboratory:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == 'rafhael100/imagine-portal' &&
      github.event.pull_request.head.ref == 'test/onepage-integrated-pg-lab-2026-11-17' &&
      github.event.pull_request.base.repo.full_name == 'rafhael100/imagine-portal' &&
      github.event.pull_request.base.ref == 'test/onepage-binding-durable-2026-11-17' &&
      github.event.pull_request.base.sha == '7c42a13c03e7f98c1626f3950b9f19bf2f77d4a4'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LC_ALL: C
      ORDER_LAB_RELEASE: disabled
      ORDER_LAB_PSP: disabled
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 3
      - name: Verify immutable source stack before installing dependencies
        run: |
          set -euo pipefail
          base='7c42a13c03e7f98c1626f3950b9f19bf2f77d4a4'
          base_tree='56a89c0424e5ff2f365e8b180a1a5b9b7b29ae75'
          source_tree='f8c729273bff8715bfc4243a94e02b625540d5e9'
          source=$(git show -s --format=%P HEAD)
          [[ "$source" =~ ^[0-9a-f]{40}$ ]]
          test "$(git show -s --format=%P "$source")" = "$base"
          test "$(git rev-parse "$base^{tree}")" = "$base_tree"
          test "$(git rev-parse "$source^{tree}")" = "$source_tree"
          test "$(git diff-tree --no-commit-id --name-status --no-renames -r HEAD)" = \
            "$(printf 'A\t.github/workflows/onepage-integrated-pg-lab.yml')"
          paths=$(printf '%s\n' \
            .github/workflows/onepage-integrated-pg-lab.yml \
            apps/portal/app/Homologation/Commerce/CommercialSelectionIntent.php \
            apps/portal/labs/onepage-composed-private/README.md \
            apps/portal/labs/onepage-composed-private/bound-checkpoint.php \
            apps/portal/labs/onepage-composed-private/bound-read.sql.inc \
            apps/portal/labs/onepage-composed-private/decision-checkpoint.php \
            apps/portal/labs/onepage-composed-private/decision.sql.inc \
            apps/portal/labs/onepage-composed-private/own-checkpoint.php \
            apps/portal/labs/onepage-composed-private/run.py \
            apps/portal/labs/onepage-decision-projection/Projection.php \
            apps/portal/labs/onepage-installment-policy/CalendarArrears.php \
            apps/portal/labs/onepage-installment-policy/Evaluator.php \
            apps/portal/labs/onepage-native-admission/OwnReview.php \
            apps/portal/labs/onepage-native-admission/pg-increment.php \
            apps/portal/labs/onepage-payment-observation/Observation.php)
          expected=$(printf '%s\n' "$paths" | sed 's/^/A\t/')
          test "$(git diff --name-status --no-renames "$base" HEAD)" = "$expected"
          while IFS= read -r path; do
            entry=$(git ls-tree HEAD -- "$path")
            [[ "$entry" == "100644 blob "* ]]
          done <<< "$paths"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, sodium, dom, xml
          tools: composer:v2
          coverage: none
      - name: Extract authenticated official PG18 tooling without system installation
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_CODENAME" = noble
          test "$(dpkg --print-architecture)" = amd64
          tooling=$(mktemp -d "$RUNNER_TEMP/onepage-pending-order-pg18-XXXXXXXX")
          mkdir -p "$tooling/lists/partial" "$tooling/cache/archives/partial" "$tooling/debs" "$tooling/root"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$tooling/pgdg.asc"
          fingerprint=$(gpg --batch --show-keys --with-colons "$tooling/pgdg.asc" | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          # All APT indexes/cache/config are local. Normal signature/hash checks remain enabled.
          # No system APT hooks, package installation, maintainer scripts or global files.
          cat > "$tooling/apt.conf" <<EOF
          Dir::Etc::parts "-";
          Dir::Etc::main "-";
          Dir::Etc::sourcelist "$tooling/sources.list";
          Dir::Etc::sourceparts "-";
          Dir::State::lists "$tooling/lists";
          Dir::Cache "$tooling/cache";
          Dir::Log "$tooling";
          EOF
          cat > "$tooling/sources.list" <<EOF
          deb [signed-by=$tooling/pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe
          EOF
          export APT_CONFIG="$tooling/apt.conf"
          apt-get --error-on=any update -qq
          cd "$tooling/debs"
          # Other runtime libraries are supplied by the standard Noble runner and checked below.
          apt-get download postgresql-18 postgresql-client-18 libpq5 liburing2
          for package in ./*.deb; do
            dpkg-deb --show "$package"
            sha256sum "$package"
            dpkg-deb --extract "$package" "$tooling/root"
          done
          pg_bin="$tooling/root/usr/lib/postgresql/18/bin"
          runtime_lib="$tooling/root/usr/lib/x86_64-linux-gnu"
          export LD_LIBRARY_PATH="$runtime_lib"
          for binary in postgres initdb pg_ctl pg_controldata psql; do
            ldd "$pg_bin/$binary" > "$tooling/$binary.ldd"
            cat "$tooling/$binary.ldd"
            if grep -q 'not found' "$tooling/$binary.ldd"; then
              echo 'Required local runtime library unavailable; stopping before cluster creation' >&2
              exit 1
            fi
          done
          "$pg_bin/initdb" --version | grep -E '^initdb \(PostgreSQL\) 18[.]'
          "$pg_bin/postgres" --version | grep -E '^postgres \(PostgreSQL\) 18[.]'
          echo "PG_BIN=$pg_bin" >> "$GITHUB_ENV"
          echo "ONEPAGE_PG_RUNTIME_LIB=$runtime_lib" >> "$GITHUB_ENV"
      - name: Locked application dependencies without scripts or plugins
        working-directory: apps/portal
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          git diff --exit-code -- composer.lock
      - name: Incremental offline and pinned composition only
        working-directory: apps/portal
        run: |
          set -euo pipefail
          for file in labs/onepage-composed-private/*.php; do php -l "$file"; done
          python3 labs/onepage-atomic-read/test-runner.py
          env -i PATH=/usr/bin:/bin LC_ALL=C PHP_BIN="$(command -v php)" \
            /usr/bin/python3 labs/onepage-composed-private/run.py --check
      - name: Own review, bound line, and synthetic projection in one ephemeral cluster
        working-directory: apps/portal
        run: |
          set -euo pipefail
          test "$ORDER_LAB_RELEASE" = disabled
          test "$ORDER_LAB_PSP" = disabled
          env -i PATH=/usr/bin:/bin LC_ALL=C ONEPAGE_ORDER_ALLOW_LOCAL_START=SYNTHETIC_ONLY \
            PG_BIN="$PG_BIN" PHP_BIN="$(command -v php)" ONEPAGE_PG_RUNTIME_LIB="$ONEPAGE_PG_RUNTIME_LIB" \
            /usr/bin/python3 labs/onepage-composed-private/run.py --run
