name: OnePage Portal approval before private read R20 (CI-only)
on:
  push:
    branches: ['test/onepage-approval-before-second-read-r20-20261122']
    paths:
      - '.github/workflows/onepage-source-approval-before-read-r20.yml'
      - 'apps/portal/app/Domain/SitesIntegration/OnepageApprovedBriefExportGate.php'
      - 'tests/onepage-approved-brief-export-gate-offline.php'
      - 'docs/PORTAL-ONEPAGE-APPROVAL-BEFORE-READ-R20.md'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['test/onepage-source-read-guard-r19-20261122']
permissions:
  contents: read
concurrency:
  group: onepage-source-approval-r20-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  fail-closed-before-private-read:
    if: >-
      github.repository == 'rafhael100/imagine-portal' &&
      ((github.event_name == 'push' &&
        github.ref == 'refs/heads/test/onepage-approval-before-second-read-r20-20261122') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'test/onepage-approval-before-second-read-r20-20261122' &&
        github.event.pull_request.base.ref == 'test/onepage-source-read-guard-r19-20261122' &&
        github.event.pull_request.base.sha == 'ef2a4398f2eb6f4ef40ed8b7150f98c289ad42ec'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
          tools: none
      - name: Lint the exact guard and test, then run isolated denial checks
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/portal/app/Domain/SitesIntegration/OnepageApprovedBriefExportGate.php
          php -l tests/onepage-approved-brief-export-gate-offline.php
          php tests/onepage-approved-brief-export-gate-offline.php | tee "$RUNNER_TEMP/r20.txt"
          grep -Eq '^ONEPAGE APPROVED BRIEF SOURCE BOUNDARY PASS: [1-9][0-9]* checks; default-deny, no official approval or transport[.]$' "$RUNNER_TEMP/r20.txt"
