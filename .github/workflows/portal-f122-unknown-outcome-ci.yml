name: Portal F122 - Fail-closed PostgreSQL unknown-outcome delivery gate
on:
  push:
    branches:
      - review/portal-f122-unknown-outcome-lease-hold-2026-11-10
  pull_request:
    paths:
      - 'apps/portal/labs/commercial-intake-f117/**'
      - 'apps/portal/labs/commercial-intake-f118/**'
      - 'apps/portal/labs/commercial-intake-f119/**'
      - 'apps/portal/labs/commercial-intake-f122/**'
      - '.github/workflows/portal-f122-unknown-outcome-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-delivery-hold-pg18:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f122-fixture-only-not-a-real-secret
          POSTGRES_DB: portal_commercial_lab
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_commercial_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PORTAL_F118_PG_LAB: '1'
      PORTAL_F119_PG_LAB: '1'
      PORTAL_F122_GATE_LAB: '1'
      DB_HOST: '127.0.0.1'
      DB_DATABASE: portal_commercial_lab
      DB_PASSWORD: f122-fixture-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo,pdo_pgsql
          coverage: none
          tools: none
      - name: Ensure test-only lease/hold functions stay out of Laravel routes
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'commercial-intake-f122|portal_f122_worker|note_unknown_lab_a' \
            apps/portal/routes apps/portal/bootstrap apps/portal/app 2>/dev/null; then
            echo 'F122 private delivery gate referenced in runtime code' >&2
            exit 1
          fi
      - name: Run real PostgreSQL 18 bounded-claim and unknown-hold tests
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/portal/labs/commercial-intake-f122/test_unknown_hold_pg18.php
          php apps/portal/labs/commercial-intake-f117/test_commercial_metadata.php
          php apps/portal/labs/commercial-intake-f118/test_pg18_metadata_atomicity.php
          php apps/portal/labs/commercial-intake-f119/test_pg18_service_mac_nonce.php
          php apps/portal/labs/commercial-intake-f122/test_unknown_hold_pg18.php
