name: Portal PVIEW-PERF-06 - SQL-derived static contract parity and offline Blade QA

on:
  push:
    branches:
      - feat/portal-pview-perf-06-pg-readonly-demo-2026-11-09

permissions:
  contents: read

concurrency:
  group: portal-perf-storage-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout pinned public Performance F1-25 fixture producer
        uses: actions/checkout@v5
        with:
          repository: rafhael100/imagine-performance-ai
          ref: 68ad8e26eb3ee7d93f1a1cb484d1b3b0b031d4dc
          path: performance-source
          persist-credentials: false
      - name: Prove exact motor fixture and no standalone API dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C performance-source rev-parse HEAD)" = 68ad8e26eb3ee7d93f1a1cb484d1b3b0b031d4dc
          cmp performance-source/contracts/demo/performance-storage-preview-v1.json apps/portal/preview/fixtures/performance-storage-preview-v1.json
          test "$(git -C performance-source rev-parse HEAD)" != ""
          echo 'PASS PVIEW-PERF-06 source bytes pinned to approved engine CI commit'
      - name: PHP 8.4 and locked Composer toolchain
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: mbstring, dom, xml, pdo, pdo_pgsql, curl, fileinfo, intl, bcmath, zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Laravel without migrations or external providers
        shell: bash
        run: |
          set -euo pipefail
          cd apps/portal
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          composer dump-autoload --no-interaction --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          git diff --exit-code -- composer.lock
      - name: Run versioned snapshot validation and preview tests
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/portal/app/Presentation/Preview/PerformanceDemoSnapshot.php
          php -l apps/portal/tests/Feature/PerformanceDemoSnapshotContractTest.php
          php -l apps/portal/app/Presentation/Preview/PerformanceStoragePreview.php
          php -l apps/portal/tests/Feature/PerformanceStoragePreviewContractTest.php
          cd apps/portal
          ./vendor/bin/phpunit tests/Feature/PerformanceDemoSnapshotContractTest.php
          ./vendor/bin/phpunit tests/Feature/PerformanceStoragePreviewContractTest.php
          ./vendor/bin/phpunit tests/Feature/PviewPerformanceDetailTest.php
          ./vendor/bin/phpunit tests/Feature/PviewNavigationPresentationTest.php
      - name: Render offline Blade and test browser navigation
        shell: bash
        env:
          PVIEW_RENDER_FILE: ${{ runner.temp }}/pview-perf-storage-demo.html
          PVIEW_HTML_FILE: ${{ runner.temp }}/pview-perf-storage-demo.html
          PVIEW_HASH_PREFIX: pview-
          PVIEW_SHOT_PREFIX: pview-perf-storage
          PVIEW_EVIDENCE_DIR: ${{ runner.temp }}/pview-perf-storage-evidence
        run: |
          set -euo pipefail
          php apps/portal/preview/tests/render_blade_preview.php
          node --check apps/portal/preview/tests/pview_browser_check.mjs
          node apps/portal/preview/tests/pview_browser_check.mjs
