name: Portal INT-F156 - Organization revision and state fence PG18 (NO-GO)
on:
  push:
    branches:
      - review/portal-int-f156-org-revision-pg18-fence-2026-11-11
  pull_request:
    branches:
      - review/portal-int-f155-org-status-revision-boundary-2026-11-11
    paths:
      - 'apps/portal/database/migrations/2026_11_11_000013_fence_portal_organization_revision.php'
      - 'apps/portal/labs/identity-f156/**'
      - '.github/workflows/portal-int-f156-org-revision-pg18.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  organization-revision-pg18:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f156-review-admin-only
          POSTGRES_DB: portal_f156_lab
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_f156_lab"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      PORTAL_F156_PG_LAB: NON_OPERATIONAL_F156
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: portal_f156_lab
      DB_USERNAME: postgres
      DB_PASSWORD: f156-review-admin-only
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: portal_f156_lab
      PGUSER: postgres
      PGPASSWORD: f156-review-admin-only
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    defaults:
      run:
        shell: bash
        working-directory: apps/portal
    steps:
      - name: Checkout review branch without persisted credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: PHP for disposable PG18
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: pdo,pdo_pgsql,mbstring,dom,xml,curl,fileinfo,intl,bcmath,zip
      - name: Validate schema and read-only fixture
        run: |
          set -euo pipefail
          php -l database/migrations/2026_11_11_000013_fence_portal_organization_revision.php
          php -l labs/identity-f156/test_pg_org_security_revision.php
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          composer dump-autoload --no-interaction --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
      - name: Apply identity, org revision session column and new organization guard
        run: |
          set -euo pipefail
          php artisan migrate --path=database/migrations/2026_11_09_000002_create_portal_identity_foundation.php --force --no-interaction
          php artisan migrate --path=database/migrations/2026_11_10_000004_add_org_revision_to_portal_sessions.php --force --no-interaction
          php artisan migrate --path=database/migrations/2026_11_11_000013_fence_portal_organization_revision.php --force --no-interaction
          psql -X -A -t -c "SELECT count(*) FROM pg_trigger WHERE tgname='portal_f156_org_revision_guard' AND NOT tgisinternal" | grep -xq 1
          psql -X -A -t -c "SELECT count(*) FROM pg_proc WHERE proname='portal_f156_guard_org_status_revision' AND prosecdef" | grep -xq 0
          psql -X -A -t -c "SELECT count(*) FROM pg_policies WHERE schemaname='public' AND tablename IN ('portal_organizations','portal_auth_sessions')" | grep -xq 0
      - name: Prove suspension, session invalidation and no access through a worker role
        run: |
          set -euo pipefail
          php labs/identity-f156/test_pg_org_security_revision.php
      - name: Rollback must fail while any organization or session exists
        run: |
          set -euo pipefail
          if php artisan migrate:rollback --path=database/migrations/2026_11_11_000013_fence_portal_organization_revision.php --force --no-interaction; then
            echo 'SECURITY ERROR: F156 accepted downgrade despite organization/session' >&2
            exit 1
          fi
          psql -X -A -t -c "SELECT count(*) FROM migrations WHERE migration='2026_11_11_000013_fence_portal_organization_revision'" | grep -xq 1
      - name: Destroy only disposable rows and test down migration
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          DELETE FROM public.portal_auth_sessions WHERE id='55555555-5555-4555-8555-555555555555';
          DELETE FROM public.portal_memberships WHERE id='33333333-3333-4333-8333-333333333333';
          DELETE FROM public.portal_identities WHERE id='11111111-1111-4111-8111-111111111111';
          DELETE FROM public.portal_organizations WHERE id='22222222-2222-4222-8222-222222222222';
          COMMIT;
          SQL
          php artisan migrate:rollback --path=database/migrations/2026_11_11_000013_fence_portal_organization_revision.php --force --no-interaction
          psql -X -A -t -c "SELECT count(*) FROM pg_trigger WHERE tgname='portal_f156_org_revision_guard' AND NOT tgisinternal" | grep -xq 0
          php artisan migrate:rollback --path=database/migrations/2026_11_10_000004_add_org_revision_to_portal_sessions.php --force --no-interaction
          php artisan migrate:rollback --path=database/migrations/2026_11_09_000002_create_portal_identity_foundation.php --force --no-interaction
          test "$(psql -X -A -t -c "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'portal_%'")" = 0
          git diff --exit-code -- composer.lock routes/ bootstrap/
