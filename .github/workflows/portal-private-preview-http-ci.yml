name: Portal P0 - private synthetic preview loopback only

on:
  pull_request:
    paths:
      - 'apps/portal/tools/serve_private_preview.py'
      - 'apps/portal/tests/test_private_preview_http.py'
      - 'docs/PORTAL-P0-PRIVATE-LOOPBACK-REVIEW.md'
      - '.github/workflows/portal-private-preview-http-ci.yml'
  push:
    branches:
      - review/portal-p0-private-loopback-bundle-viewer-2026-11-13

permissions:
  contents: read

jobs:
  no-deploy-private-http:
    name: Python stdlib / ZIP integrity / local-only HTTP
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Compile read-only preview viewer and test harness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile apps/portal/tools/serve_private_preview.py
          python3 -m py_compile apps/portal/tests/test_private_preview_http.py
      - name: Run negative and HTTP security tests on isolated runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s apps/portal/tests -p 'test_private_preview_http.py' -v
      - name: Enforce runtime isolation from Laravel, public deploy and credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('apps/portal/tools/serve_private_preview.py').read_text()
          assert '127.0.0.1' in source
          assert 'ThreadingHTTPServer(("127.0.0.1", port), Handler)' in source
          assert '--serve' in source and '--check' in source
          import ast
          parsed=ast.parse(source)
          imported=set()
          for node in ast.walk(parsed):
              if isinstance(node, ast.Import):
                  imported.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imported.add(node.module.split('.')[0])
          assert not imported.intersection({
              'subprocess', 'requests', 'paramiko', 'socket',
              'urllib', 'ftplib', 'smtplib', 'dotenv'
          }), imported
          assert 'ThreadingHTTPServer(("127.0.0.1", port), Handler)' in source
          assert '0.0.0.0' not in source
          assert 'docker run' not in source
          print('NO-GO: no deployment, no public hosting, no runtime or customer authorization.')
          PY
