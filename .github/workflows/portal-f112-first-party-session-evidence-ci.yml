name: Portal F112 - First-party PostgreSQL session evidence CI
on:
  push:
    branches:
      - review/portal-f112-trusted-session-db-proof-2026-11-10
  pull_request:
    paths:
      - 'apps/portal/labs/identity-f112/**'
      - 'apps/portal/app/Domain/Identity/Invitations/**'
      - 'apps/portal/database/migrations/2026_11_09_000002_create_portal_identity_foundation.php'
      - 'apps/portal/database/migrations/2026_11_10_000004_add_org_revision_to_portal_sessions.php'
      - '.github/workflows/portal-f112-first-party-session-evidence-ci.yml'
permissions:
  contents: read
jobs:
  db-only-first-party-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-f112-pg-only
          POSTGRES_DB: portal_identity_lab
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_identity_lab"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      PORTAL_F112_PG_LAB: '1'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: portal_identity_lab
      DB_USERNAME: postgres
      DB_PASSWORD: ci-f112-pg-only
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: portal_identity_lab
      PGUSER: postgres
      PGPASSWORD: ci-f112-pg-only
      F66_PG_ADMIN_PASSWORD: ci-f112-pg-only
      F112_PG_READER_PASSWORD: ci-f112-reader-only
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    defaults:
      run:
        shell: bash
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: pdo,pdo_pgsql,mbstring,dom,xml,curl,fileinfo,intl,bcmath,zip,sodium
      - name: Locked dependencies and source check
        run: |
          set -euo pipefail
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          composer dump-autoload --no-interaction --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php -l labs/identity-f112/PortalF112OfflinePgSessionIdentitySource.php
          php -l labs/identity-f112/test_pg_verified_session_evidence.php
          php artisan test --no-ansi --filter=PortalInvitationPreflight
      - name: Prove real PG18 session data origin with EXECUTE-only role
        run: |
          set -euo pipefail
          php artisan migrate --path=database/migrations/2026_11_09_000002_create_portal_identity_foundation.php --force --no-interaction
          php artisan migrate --path=database/migrations/2026_11_10_000004_add_org_revision_to_portal_sessions.php --force --no-interaction
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -f labs/identity-f112/verified_portal_session_evidence.sql
          php labs/identity-f112/test_pg_verified_session_evidence.php
          test "$(php artisan route:list --json | php -r '$v=json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR); echo count($v);')" -eq 1
          ! grep -R -E 'PortalF112OfflinePgSessionIdentitySource|PORTAL_F112_PG_LAB|portal_f112_verified_session_evidence' routes/ bootstrap/ app/Providers/ public/ config/
      - name: Remove disposable SQL and restore closed identity baseline
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "DROP FUNCTION public.portal_f112_verified_session_evidence(text,uuid)"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "DROP POLICY portal_f112_session_read ON public.portal_auth_sessions"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "DROP POLICY portal_f112_membership_read ON public.portal_memberships"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "DROP POLICY portal_f112_organization_read ON public.portal_organizations"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "DROP POLICY portal_f112_identity_read ON public.portal_identities"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "DROP OWNED BY portal_f112_owner"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "DROP ROLE portal_f112_owner"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "DROP OWNED BY portal_f112_reader"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "DROP ROLE portal_f112_reader"
          php artisan migrate:rollback --path=database/migrations/2026_11_10_000004_add_org_revision_to_portal_sessions.php --force --no-interaction
          php artisan migrate:rollback --path=database/migrations/2026_11_09_000002_create_portal_identity_foundation.php --force --no-interaction
          test "$(psql -X -A -t -d "$PGDATABASE" -c "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'portal_%'")" -eq 0
          git diff --exit-code -- composer.lock routes/ bootstrap/
