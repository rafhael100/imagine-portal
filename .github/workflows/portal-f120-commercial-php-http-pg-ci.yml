name: Portal F120 - Private PHP HTTP to PG18 signed intake
on:
  push:
    branches:
      - review/portal-f120-commercial-php-http-pg-loopback-2026-11-10
  pull_request:
    paths:
      - 'apps/portal/labs/commercial-intake-f117/**'
      - 'apps/portal/labs/commercial-intake-f118/**'
      - 'apps/portal/labs/commercial-intake-f119/**'
      - 'apps/portal/labs/commercial-intake-f120/**'
      - '.github/workflows/portal-f120-commercial-php-http-pg-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-php-http-private-pg18:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f120-fixture-only-not-a-real-secret
          POSTGRES_DB: portal_commercial_lab
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_commercial_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PORTAL_F118_PG_LAB: '1'
      PORTAL_F119_PG_LAB: '1'
      PORTAL_F120_HTTP_LAB: '1'
      DB_HOST: 127.0.0.1
      DB_DATABASE: portal_commercial_lab
      DB_PASSWORD: f120-fixture-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo,pdo_pgsql
          coverage: none
          tools: none
      - name: Block runtime imports of the test-only HTTP intake
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'commercial-intake-f120|router_loopback.php|test_loopback_http.php' \
            apps/portal/routes apps/portal/bootstrap apps/portal/app 2>/dev/null; then
            echo 'F120 private HTTP lab imported into production runtime' >&2
            exit 1
          fi
      - name: Run PHP tests then private HTTP + PostgreSQL integration
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/portal/labs/commercial-intake-f120/router_loopback.php
          php -l apps/portal/labs/commercial-intake-f120/test_loopback_http.php
          php -l apps/portal/labs/commercial-intake-f119/PortalF119SyntheticServiceReservation.php
          php apps/portal/labs/commercial-intake-f117/test_commercial_metadata.php
          php apps/portal/labs/commercial-intake-f118/test_pg18_metadata_atomicity.php
          php apps/portal/labs/commercial-intake-f119/test_pg18_service_mac_nonce.php
          export PORTAL_F120_TEST_KEY="$(openssl rand -hex 48)"
          php -S 127.0.0.1:19119 \
            apps/portal/labs/commercial-intake-f120/router_loopback.php \
            >/dev/null 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if php -r '$s=@fsockopen("127.0.0.1",19119,$e,$m,0.2);if($s){fclose($s);exit(0);}exit(1);'; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" -eq 1
          php apps/portal/labs/commercial-intake-f120/test_loopback_http.php
