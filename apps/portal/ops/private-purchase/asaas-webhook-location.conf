# Include inside the existing HTTPS portal-dev server, not a new public site.
# Only this exact machine endpoint uses its own constant-time token authentication.
location = /integrations/asaas/sandbox/events {
    auth_basic off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:18084;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    access_log off;
}
