name: Portal F91 - BRL daily budget F107 offline (private/public)
on:
  pull_request:
    paths:
      - 'apps/portal/app/Domain/PerformanceDashboard/CredentialBoundBudgetPreview.php'
      - 'apps/portal/tests/Unit/CredentialBoundBudgetPreviewStandalone.php'
      - 'apps/portal/app/Domain/PerformanceDashboard/CredentialBoundPerformanceWorkbenchPreview.php'
      - 'apps/portal/app/Domain/PerformanceDashboard/PerformanceCampaignObservationState.php'
      - 'apps/portal/app/Domain/PerformanceDashboard/PerformanceReviewObservationState.php'
      - 'apps/portal/app/Domain/Catalog/PerformanceChannel.php'
      - '.github/workflows/portal-f64-precise-budget-preview-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-f91-budget-${{ github.ref }}
  cancel-in-progress: true
jobs:
  strict-offline-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
        node: ['22','24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Exact currency cents, leap calendar and NO-GO contract
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/portal/app/Domain/PerformanceDashboard/CredentialBoundBudgetPreview.php
          php -l apps/portal/tests/Unit/CredentialBoundBudgetPreviewStandalone.php
          php apps/portal/tests/Unit/CredentialBoundBudgetPreviewStandalone.php
          php apps/portal/tests/Unit/CredentialBoundPerformanceWorkbenchPreviewStandalone.php
          node apps/portal/tests/ui/test-f63-static-credential-workbench.mjs
          if grep -R -n -E 'CredentialBoundBudgetPreview|PORTAL_F64_BUDGET_PREVIEW_LAB' apps/portal/routes/ apps/portal/bootstrap/ apps/portal/app/Providers/; then
            echo 'FAIL: budget preview referenced by operational endpoint' >&2
            exit 1
          fi
