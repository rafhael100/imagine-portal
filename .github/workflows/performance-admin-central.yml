name: ADMIN P0 - Portal central with pinned Performance engine and PostgreSQL18
on:
  pull_request:
    paths: ['apps/portal/**', '.github/workflows/performance-admin-central.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  central:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: perf-admin-ci-disposable
          POSTGRES_DB: perf_admin_central_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d perf_admin_central_ci" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      CI: 'true'
      APP_ENV: testing
      APP_DEBUG: 'false'
      PORTAL_ADMIN_AUTH_ENABLED: 'true'
      PERFORMANCE_ADMIN_LAB_ENABLED: 'true'
      PERFORMANCE_ADMIN_PG_CI: '1'
      AUTOMATION_ADMIN_PG_CI: '1'
      IMAGINE_AUTOMATION_ADMIN_ENABLED: 'true'
      IMAGINE_AUTOMATION_ADMIN_MODE: isolated_ci
      PERFORMANCE_ADMIN_LAB_ENGINE_ROOT: ${{ github.workspace }}/engine
      PERFORMANCE_ADMIN_BROWSER_VAULT: /tmp/perf-admin-vault.json
      PERFORMANCE_ADMIN_EVIDENCE: /tmp/perf-admin-evidence
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: perf_admin_central_ci
      DB_USERNAME: postgres
      DB_PASSWORD: perf-admin-ci-disposable
      SESSION_DRIVER: file
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LOG_CHANNEL: stderr
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-performance-ai
          ref: 5c5802bbcf231853764d7241fd3acf1a35588de7
          path: engine
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, sodium, mbstring, dom, xml, fileinfo, zip
          tools: composer:v2
          coverage: none
      - name: Install locked Portal and test engine contract
        run: |
          composer install --working-dir=apps/portal --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          php engine/tests/administrative_lab_engine_test.php
          php engine/tests/monthly_management_fee_floor_v7_candidate_test.php
      - name: Prepare only disposable CI database
        working-directory: apps/portal
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php artisan migrate --force --no-interaction
          php artisan view:cache
          for f in storage/framework/views/*.php; do php -l "$f" || exit 1; done
      - name: Tenant, role, revision, replay, approval and incident flows
        working-directory: apps/portal
        run: php artisan test --no-ansi --filter='AutomationStateReaderTest|AutomationAdministrationTest|PerformanceAdministrationTest|AdministrativeActionAvailabilityTest|PrivateDemonstrationPolicyTest|SignedServiceReadClientTest|PerformanceAuthorityBridgeTest'
      - name: Seed unique CI-only reviewer without credential output
        run: |
          mkdir -p "$PERFORMANCE_ADMIN_EVIDENCE"
          php apps/portal/tests/Fixtures/performance-admin-seed.php
          php apps/portal/tests/Fixtures/render-performance-admin.php
          cd apps/portal
          php artisan serve --host=127.0.0.1 --port=18942 > "$RUNNER_TEMP/perf-admin-server.log" 2>&1 &
      - name: Browser journey and credential-free evidence
        run: |
          mkdir -p "$RUNNER_TEMP/perf-admin-browser"
          cd "$RUNNER_TEMP/perf-admin-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.58.2 @axe-core/playwright@4.10.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          NODE_PATH="$RUNNER_TEMP/perf-admin-browser/node_modules" node "$GITHUB_WORKSPACE/apps/portal/tests/Fixtures/performance-admin-browser.cjs"
      - name: Separate applications over verified private HTTPS and mTLS (synthetic authorities)
        env:
          ADMIN_PHASE3_HTTPS_CI: '1'
          ADMIN_PHASE3_TLS: /tmp/admin-phase3-tls
          ADMIN_PHASE3_STATE: /tmp/admin-phase3-tls/state.json
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$ADMIN_PHASE3_TLS"
          cd "$ADMIN_PHASE3_TLS"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout ca.key -out ca.pem -subj '/CN=Disposable Phase3 CI CA' >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj '/CN=performance-ci.internal' >/dev/null 2>&1
          printf 'subjectAltName=DNS:performance-ci.internal\nextendedKeyUsage=serverAuth\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 1 -out server.pem -extfile server.ext >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout client.key -out client.csr -subj '/CN=portal-service-ci' >/dev/null 2>&1
          printf 'extendedKeyUsage=clientAuth\n' > client.ext
          openssl x509 -req -in client.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 1 -out client.pem -extfile client.ext >/dev/null 2>&1
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 1 -out stranger.pem -extfile client.ext >/dev/null 2>&1
          openssl x509 -in client.pem -noout -serial | cut -d= -f2 > client.serial
          sudo ip address add 172.30.250.1/32 dev lo
          cd "$GITHUB_WORKSPACE"
          php apps/portal/tests/Fixtures/phase3/setup.php
          python3 apps/portal/tests/Fixtures/phase3/https-server.py > "$ADMIN_PHASE3_TLS/server.log" 2>&1 &
          phase3_server_pid=$!
          trap 'kill "$phase3_server_pid" 2>/dev/null || true; sudo ip address del 172.30.250.1/32 dev lo; rm -rf "$ADMIN_PHASE3_TLS"' EXIT
          for attempt in $(seq 1 40); do
            if curl --silent --noproxy '*' --cacert "$ADMIN_PHASE3_TLS/ca.pem" --cert "$ADMIN_PHASE3_TLS/client.pem" --key "$ADMIN_PHASE3_TLS/client.key" --resolve performance-ci.internal:19443:172.30.250.1 https://performance-ci.internal:19443/ >/dev/null; then break; fi
            sleep 0.1
          done
          if ADMIN_PHASE3_VERIFY_FAILURE_TEST=1 php apps/portal/tests/Fixtures/phase3/client.php > "$ADMIN_PHASE3_TLS/expected-failure.log" 2>&1; then
            echo 'Verifier incorrectly accepted an intentional failure' >&2
            exit 1
          fi
          php apps/portal/tests/Fixtures/phase3/client.php
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: performance-admin-credential-free-evidence
          path: /tmp/perf-admin-evidence
          retention-days: 7
      - name: Delete ephemeral authentication material
        if: always()
        run: rm -f "$PERFORMANCE_ADMIN_BROWSER_VAULT"
